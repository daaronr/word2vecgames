-06"},{"id":"paper-lemons","cat":"paper","kind":"paper","prompt":"The Market for \"Lemons\"","ask":"What field is it from, and what is the paper about?","full":"The Market for \"Lemons\": Quality Uncertainty and the Market Mechanism","authors":"Akerlof","journal":"The Quarterly Journal of Economics","year":1970,"field":"Economics","truth":"Economics. When sellers know more about quality than buyers, as with used cars, buyers will only pay an average price, owners of good cars stop selling, and bad ones take over the market: asymmetric information.","more":"Three journals turned it down first, two of them for 'triviality', and one referee objected that if it were correct, economics would be different. Akerlof shared the 2001 Nobel Prize in economics for work on markets with asymmetric information.","key":["information","cars","quality","sellers","economics"],"clues":["The fruit in the title is slang; nobody squeezes anything.","The main example is a buyer on a used-car lot who can't tell a good car from a bad one.","The seller knows something the buyer doesn't, and the good products drift out of the market."],"decoys":["Economics. Lemon prices swing from year to year because growers plant according to last season's price, a textbook boom-and-bust cycle.","Economics. Buyers judge cars by brand name, so carmakers with good reputations can charge more for nearly identical models.","Economics. Laws letting buyers return faulty cars made used-car dealers raise prices, pushing poorer buyers out of the market."],"graded":[{"g":"economics, asymmetric information in the used car market","s":98,"h":"Spot on."},{"g":"adverse selection","s":88,"h":"Spot on; the field is implied."},{"g":"sellers know more than buyers so bad products drive out good","s":88,"h":"Right idea; name the field too."},{"g":"used cars and hidden defects","s":75,"h":"Close; why does the market break down?"},{"g":"economics of the used car market","s":65,"h":"Right field and example; what goes wrong?"},{"g":"lemon laws for faulty cars","s":40,"h":"Right kind of lemon, wrong question."},{"g":"economics of the citrus fruit trade","s":30,"h":"Right field, but the fruit is slang."},{"g":"agriculture, lemon crop prices","s":8,"h":"Too literal: these lemons aren't fruit."},{"g":"making lemonade out of bad situations","s":3,"h":"Nowhere near."},{"g":"biology of citrus trees","s":0,"h":"Nowhere near."}],"rating":"G","fun":3,"difficulty":2,"url":"https://doi.org/10.2307/1879431","source":"QJE 84(3):488-500, https://doi.org/10.2307/1879431; rejection history in Akerlof's 2001 essay: https://equitablegrowth.org/must-read-george-akerlof-2001-writing-the-the-market-for-lemons-a-personal-interpretive-essay/","checked":"2026-10-06"},{"id":"paper-bowling-alone","cat":"paper","kind":"paper","prompt":"Bowling Alone","ask":"What field is it from, and what is the paper about?","full":"Bowling Alone: America's Declining Social Capital","authors":"Putnam","journal":"Journal of Democracy","year":1995,"field":"Political science","truth":"Political science (or sociology). Americans had been joining fewer clubs, unions, churches and civic groups for decades, and Putnam argued this loss of 'social capital', the trust and ties that make communities work, was weakening democracy.","more":"The title comes from one statistic: between 1980 and 1993 the number of Americans who bowled rose 10 percent while league bowling fell 40 percent. The article grew into a 2000 book of the same name.","key":["community","decline","civic","clubs","trust","social"],"clues":["The sport in the title is only an example.","More people were bowling than before, yet fewer of them in leagues.","Its subject is the shrinking membership of clubs, churches and parent-teacher groups, and the trust that goes with it."],"decoys":["Sociology. Americans spend more leisure time alone than they used to, and the paper links solo hobbies like bowling and fishing to rising rates of depression.","Economics. Bowling alleys closed in large numbers after the 1970s because the suburbs left them stranded downtown, an example of how cities shape business.","Political science. Voters who live alone are much less likely to turn out on election day, so the rise of one-person homes is lowering turnout."],"graded":[{"g":"sociology, americans join fewer groups and lose social capital","s":97,"h":"Spot on."},{"g":"political science about the decline of civic life in america","s":95,"h":"Spot on."},{"g":"social capital","s":88,"h":"Spot on; the field is implied."},{"g":"decline of community groups in america","s":86,"h":"Right idea; name the field too."},{"g":"loneliness in modern america","s":55,"h":"Right worry, narrower subject."},{"g":"people spending more time alone","s":50,"h":"Warm; think about what people belong to."},{"g":"political science about voting","s":35,"h":"Right field, missing the main idea."},{"g":"economics of the bowling industry","s":20,"h":"The bowling numbers are only a symptom."},{"g":"sports science of bowling","s":5,"h":"Too literal: the sport is an example."},{"g":"the history of cricket","s":0,"h":"Nowhere near."}],"rating":"G","fun":3,"difficulty":2,"url":"https://doi.org/10.1353/jod.1995.0002","source":"Journal of Democracy 6(1):65-78, https://doi.org/10.1353/jod.1995.0002; https://en.wikipedia.org/wiki/Bowling_Alone","checked":"2026-10-06"},{"id":"paper-emily-greg","cat":"paper","kind":"paper","prompt":"Are Emily and Greg More Employable than Lakisha and Jamal?","ask":"What field is it from, and what is the paper about?","full":"Are Emily and Greg More Employable Than Lakisha and Jamal? A Field Experiment on Labor Market Discrimination","authors":"Bertrand & Mullainathan","journal":"American Economic Review","year":2004,"field":"Economics","truth":"Economics. About 5,000 fake resumes sent to job ads in Boston and Chicago got 50 percent more interview callbacks when they carried a white-sounding name than a Black-sounding one: racial discrimination in hiring.","more":"A better resume raised callbacks for white names far more than for Black names, and employers who advertised as an 'Equal Opportunity Employer' discriminated as much as the rest.","key":["discrimination","race","names","resumes","hiring","economics"],"clues":["The four names were chosen for what they suggest about a person.","The researchers answered real job ads on behalf of people who didn't exist.","Only the name at the top changed, and that alone changed who got called back."],"decoys":["Economics. Workers with common, easy-to-spell first names earn more over their careers than those with unusual names, even within the same family.","Psychology. Interviewers rated applicants named Emily and Greg as warmer and those named Lakisha and Jamal as more competent, a study of first impressions.","Economics. Job seekers who shortened their first names on applications got more interviews at tech firms than at stores or hospitals."],"graded":[{"g":"economics, fake resumes with Black names got fewer callbacks","s":98,"h":"Spot on."},{"g":"resume study showing racial discrimination by name","s":90,"h":"Spot on."},{"g":"racial discrimination in hiring","s":88,"h":"Spot on; the field is implied."},{"g":"whether names affect your job chances","s":70,"h":"Close; say what the names signal."},{"g":"racism","s":60,"h":"Right theme; where did it show up?"},{"g":"economics of first names and earnings","s":40,"h":"Right field, missing the main point."},{"g":"gender discrimination at work","s":35,"h":"Right kind of bias, wrong group."},{"g":"education levels of different students","s":8,"h":"Cold; think about employers."},{"g":"which baby names are most popular","s":5,"h":"Too literal; think about employers."},{"g":"a sitcom about two couples","s":0,"h":"Nowhere near."}],"rating":"G","fun":3,"difficulty":1,"url":"https://doi.org/10.1257/0002828042002561","source":"AER 94(4):991-1013; NBER working paper w9873: https://www.nber.org/system/files/working_papers/w9873/w9873.pdf","checked":"2026-10-06"},{"id":"paper-hot-hand","cat":"paper","kind":"paper","prompt":"The hot hand in basketball","ask":"What field is it from, and what is the paper about?","full":"The hot hand in basketball: On the misperception of random sequences","authors":"Gilovich, Vallone & Tversky","journal":"Cognitive Psychology","year":1985,"field":"Psychology","truth":"Psychology. Fans and players believe a shooter who has just scored is more likely to score again, but shooting records showed no more streaks than chance would produce: people misread randomness.","more":"The data came from the Philadelphia 76ers, Boston Celtics free throws and a shooting test with Cornell players. In 2018 Miller and Sanjurjo found a subtle bias in this way of counting streaks; corrected, the data suggest a modest hot hand may exist after all.","key":["streaks","random","illusion","shooting","psychology"],"clues":["Its subject is a belief that nearly every fan and coach holds.","The researchers checked whether a made shot really makes the next one more likely.","People see patterns in coin-flip sequences that aren't there."],"decoys":["Sports science. Players who warm up their hands before a game shoot more accurately in cold arenas, measured with thermal cameras.","Psychology. Players who have just scored take harder shots, so their hit rate drops, which hides a real streak from fans watching.","Physiology. Shooting accuracy rises with heart rate up to a point, so players shoot best in the closing minutes of close games."],"graded":[{"g":"psychology, the hot hand is a fallacy and streaks are just chance","s":98,"h":"Spot on."},{"g":"hot hand fallacy","s":88,"h":"Spot on; the field is implied."},{"g":"people see streaks in random sequences","s":88,"h":"Spot on; name the field too."},{"g":"gambler's fallacy","s":65,"h":"Close cousin, pointing the other way."},{"g":"whether basketball players really get on streaks","s":65,"h":"Right question; what did they find?"},{"g":"statistics of basketball shooting","s":50," <script>const CONFIG = {"env":"artifact","vectorUrls":["judge-vectors.wasm"],"shareUrl":"","judgeApi":""};</script>
<script>
/*
 * "What Is It?" judges.
 *
 * The robot judge is free and runs offline: it compares the words of a guess with an item's key
 * words using ConceptNet Numberbatch vectors (the Word Bocce "common sense" set, reduced to 96
 * dims by tools/build_vectors.py). It rewards guesses that land near the key ideas and explains
 * each match, so players can see why it scored the way it did. It also checks whether a guess sits
 * closer to one of the item's decoys (the obvious-but-wrong reading) than to the truth.
 *
 * The AI judge is a prompt plus a tolerant reply parser; who runs the prompt (the viewer's own
 * Claude plan, the player's own API key, or a chatbot the player pastes it into) is decided in app.js.
 *
 * Works in the browser (window.WhatJudge) and in Node (module.exports), like web/engine.js.
 */
(function (root) {
  "use strict";

  // ---------- word lists ----------
  const STOP = new Set((
    "a an the and or but nor of to in on for with at by from as into onto off over under about " +
    "is are was were be been being am it its it's this that these those there here what which who whom whose " +
    "where when why how i you he she we they me him her us them my your his our their mine yours " +
    "not no yes do does did done doing can could would should will shall may might must just very really " +
    "quite some any all each every more most other such only own same so than too also again then once " +
    "like thing things stuff something someone somebody anything kind type sort lot lots bit maybe probably " +
    "perhaps guess think pretty sure actually basically literally get gets got make makes made " +
    "website site web page webpage online internet com www http https net org url link dot " +
    "s t d ll ve re m"
  ).split(/\s+/));

  // Common spellings the vector vocabulary lacks.
  const ALIAS = {
    donut: "doughnut", donuts: "doughnut", favorite: "favourite", colour: "color", colours: "color",
    anaesthetist: "anesthesia", anesthesiologist: "anesthesia", anaesthesia: "anesthesia",
    tv: "television", telly: "television", movie: "film", movies: "film", cellphone: "phone",
    smartphone: "phone", ad: "advertisement", ads: "advertisement", vid: "video", vids: "video",
    bbq: "barbecue", aeroplane: "airplane", gaming: "game", ecommerce: "shop", startup: "company",
  };

  function tokenize(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[‘’]/g, "'")
      .replace(/https?:\/\/\S+/g, " ")
      .split(/[^a-z0-9'à-ÿ]+/)
      .map((w) => w.replace(/^'+|'+$/g, "").replace(/'s$/, ""))
      .filter(Boolean);
  }

  /** Content words of a text, in order, without duplicates. */
  function contentWords(text, limit) {
    const out = [];
    const seen = new Set();
    for (const w of tokenize(text)) {
      if (STOP.has(w) || w.length < 2 || /^\d+$/.test(w)) continue;
      const k = stem(w);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(w);
      if (limit && out.length >= limit) break;
    }
    return out;
  }

  /** A crude stem, used only to decide that two words are "the same word". */
  function stem(w) {
    w = ALIAS[w] || w;
    if (w.length > 5 && w.endsWith("ies")) return w.slice(0, -3) + "y";
    if (w.length > 5 && w.endsWith("ing")) return w.slice(0, -3);
    if (w.length > 4 && w.endsWith("ed")) return w.slice(0, -2);
    if (w.length > 4 && w.endsWith("es") && /(ch|sh|ss|x|z)es$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
    return w;
  }

  /** Spellings to try in the vocabulary, most likely first. */
  function variants(w) {
    const v = [w];
    if (ALIAS[w]) v.unshift(ALIAS[w]);
    const add = (x) => { if (x.length > 1 && !v.includes(x)) v.push(x); };
    if (w.endsWith("ies")) add(w.slice(0, -3) + "y");
    if (w.endsWith("es")) add(w.slice(0, -2));
    if (w.endsWith("s") && !w.endsWith("ss")) add(w.slice(0, -1));
    if (w.endsWith("ing")) { add(w.slice(0, -3)); add(w.slice(0, -3) + "e"); add(w.slice(0, -4)); }
    if (w.endsWith("ed")) { add(w.slice(0, -2)); add(w.slice(0, -1)); add(w.slice(0, -3)); }
    if (w.endsWith("ers")) { add(w.slice(0, -3)); add(w.slice(0, -2)); }
    if (w.endsWith("er")) { add(w.slice(0, -2)); add(w.slice(0, -1)); }
    if (w.endsWith("ly")) add(w.slice(0, -2));
    if (w.includes("ou")) add(w.replace("ou", "o")); // British spellings
    if (w.endsWith("ise")) add(w.slice(0, -3) + "ize");
    return v;
  }

  // ---------- vectors ----------
  class Space {
    /** buf: ArrayBuffer in the WIIV format written by tools/build_vectors.py */
    constructor(buf) {
      const dv = new DataView(buf);
      const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
      if (magic !== "WIIV") throw new Error("Not a judge-vectors file");
      const n = dv.getUint32(4, true);
      const dim = dv.getUint32(8, true);
      const vb = dv.getUint32(12, true);
      const vocab = new TextDecoder().decode(new Uint8Array(buf, 16, vb)).split("\n");
      const q = new Int8Array(buf, 16 + vb, n * dim);
      const M = new Float32Array(n * dim);
      for (let r = 0; r < n; r++) {
        let ss = 0;
        const o = r * dim;
        for (let k = 0; k < dim; k++) ss += q[o + k] * q[o + k];
        const inv = ss > 0 ? 1 / Math.sqrt(ss) : 0;
        for (let k = 0; k < dim; k++) M[o + k] = q[o + k] * inv;
      }
      this.n = n;
      this.dim = dim;
      this.vocab = vocab;
      this.M = M;
      this.index = new Map(vocab.map((w, i) => [w, i]));
    }
    /** The vocabulary word a typed word maps to, or null. */
    lookup(w) {
      for (const x of variants(w)) if (this.index.has(x)) return x;
      return null;
    }
    sim(a, b) {
      const i = this.index.get(a);
      const j = this.index.get(b);
      if (i === undefined || j === undefined) return 0;
      const { M, dim } = this;
      let s = 0;
      for (let k = 0; k < dim; k++) s += M[i * dim + k] * M[j * dim + k];
      return s;
    }
  }

  async function loadSpace(urls) {
    let lastErr = null;
    for (const url of urls) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(url + ": HTTP " + res.status);
        return new Space(await res.arrayBuffer());
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error("No vector file to load");
  }

  // ---------- scoring ----------
  // Cosines below LO count as unrelated (97th percentile of random word pairs is ~0.24);
  // at HI and above, two words mean nearly the same thing (pen/pens 0.82, shop/store 0.85).
  const LO = 0.22;
  const HI = 0.7;
  // The first two keys carry the answer; later ones are details.
  const WEIGHTS = [1, 0.8, 0.4, 0.3, 0.25, 0.2];
  const lift = (s) => Math.max(0, Math.min(1, (s - LO) / (HI - LO)));

  /** Similarity of two typed words: 1 for the same word, else vector cosine (0 if unknown). */
  function wordSim(space, a, b) {
    if (stem(a) === stem(b)) return 1;
    if (!space) return 0;
    const x = space.lookup(a);
    const y = space.lookup(b);
    if (!x || !y) return 0;
    if (x === y) return 1;
    return space.sim(x, y);
  }

  /**
   * Score a free-text guess against a target {keys, text}. keys are the key ideas, most important
   * first; text is the full answer, whose exact words also earn a little credit.
   * Returns {score 0-100, matches:[{key, word, sim}], unknown:[words], words:[considered words]}.
   */
  function scoreAgainst(space, guess, target) {
    const words = contentWords(guess, 8);
    const keys = (target.keys && target.keys.length ? target.keys : contentWords(target.text, 6)).map((k) =>
      String(k).toLowerCase()
    );
    const unknown = space ? words.filter((w) => !space.lookup(w)) : [];
    if (!words.length || !keys.length) return { score: 0, matches: [], unknown, words };

    let num = 0;
    let den = 0;
    const matches = keys.map((k, i) => {
      let best = 0;
      let by = null;
      for (const w of words) {
        const s = wordSim(space, k, w);
        if (s > best) { best = s; by = w; }
      }
      const wt = WEIGHTS[i] !== undefined ? WEIGHTS[i] : 0.2;
      num += wt * lift(best);
      den += wt;
      return { key: k, word: by, sim: best };
    });
    const recall = num / den;

    // Precision: how much of the guess is about the answer at all.
    const truthWords = contentWords(target.text || "", 24);
    let prec = 0;
    let exact = 0;
    for (const w of words) {
      let best = 0;
      for (const k of keys) best = Math.max(best, lift(wordSim(space, k, w)));
      for (const t of truthWords) {
        if (stem(t) === stem(w)) { exact++; best = Math.max(best, 1); break; }
        best = Math.max(best, 0.8 * lift(wordSim(space, t, w)));
      }
      prec += best;
    }
    prec /= words.length;

    const bonus = Math.min(0.15, 0.05 * exact);
    let score = Math.round(100 * Math.max(0, Math.min(1, 0.75 * recall + 0.25 * prec + bonus)));
    // "Spot on" needs the main idea itself (or a word from the answer), not just a close cousin
    // (shoes for a sock company, or ice cream for mint chip).
    if (score >= 85 && matches[0].sim < 1 && exact === 0) score = 84;
    return { score, matches, unknown, words };
  }

  /** Score a guess against a game item, and check the decoys for a trap. */
  function scoreGuess(space, guess, item) {
    const main = scoreAgainst(space, guess, { keys: item.key, text: item.truth });
    let trap = null;
    for (const d of item.decoys || []) {
      const s = scoreAgainst(space, guess, { keys: contentWords(d, 4), text: d }).score;
      if (s >= 45 && s > main.score + 15 && (!trap || s > trap.score)) trap = { decoy: d, score: s };
    }
    return { ...main, trap };
  }

  // ---------- answer keys ----------
  // Items carry `graded`: example guesses scored in advance, [{g: guess, s: score, h: hint}]. A guess
  // that says the same thing as one of them takes its score and hint, so no AI call is needed; a
  // guess near some of them is nudged toward their scores.
  const NEG = new Set(["not", "no", "nor", "never", "isn't", "aren't", "don't", "doesn't", "wasn't"]);
  const negated = (text) => tokenize(text).some((w) => NEG.has(w));

  /** A guess reduced to its content words, for exact matching (answer keys, caches). */
  function normGuess(text) {
    return tokenize(text).filter((w) => NEG.has(w) || !STOP.has(w)).map(stem).join(" ");
  }

  /** How closely two short texts say the same thing, 0-1: each word's best match, both ways. */
  function textSim(space, a, b) {
    const wa = contentWords(a, 10);

  return sdkPromise;
}

/** round: {prompt, kindLabel, ask, truth, more, results}; guesses: [{name, text}] */
async function aiJudge(round, guesses) {
  const prompt = J.judgePrompt(round, guesses);
  const src = aiSource();
  if (src === "site") {
    const body = round.id
      ? { id: round.id, guesses }
      : { custom: { prompt: round.prompt, truth: round.truth, kind: /web address/.test(round.kindLabel || "") ? "domain" : "phrase", results: round.results }, guesses };
    const out = await siteJudge(body);
    return { scores: out.scores, funniest: out.funniest, comment: out.comment, source: "site" };
  }
  if (src === "claude") {
    try {
      const out = await RT.sample.json(prompt, { modelTier: "quick" });
      return Object.assign(J.parseJudgeReply(out, guesses.length), { source: "claude" });
    } catch (e) {
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) RT.sample = null;
      throw new Error(sampleErrorText(e));
    }
  }
  if (src === "key") {
    const mod = await loadSdk();
    const client = new mod.Anthropic({ apiKey: SETTINGS.apiKey, dangerouslyAllowBrowser: true });
    const model = SETTINGS.model || "claude-opus-5-5";
    const params = {
      model,
      max_tokens: 4000,
      messages: [{ role: "user", content: prompt }],
      output_config: { format: mod.jsonSchemaOutputFormat(J.JUDGE_SCHEMA) },
    };
    if (model !== "claude-haiku-4-5") {
      params.output_config.effort = "low";
      params.betas = ["server-side-fallback-2026-07-01"];
      params.fallbacks = "default";
    }
    let msg;
    try {
      msg = await client.beta.messages.parse(params);
    } catch (e) {
      throw new Error(apiErrorText(e));
    }
    if (msg.stop_reason === "refusal") throw new Error("The model declined to judge this round.");
    const text = (msg.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    return Object.assign(J.parseJudgeReply(msg.parsed_output || text, guesses.length), { source: "key", model });
  }
  return pasteJudge(prompt, guesses.length);
}
function sampleErrorText(e) {
  const code = e && e.code;
  if (code === "not_granted") return "Claude wasn't allowed to judge on this page. You can still paste the prompt into a chatbot.";
  if (code === "rate_limited") return "Claude is busy or your usage limit was reached. Try again in a bit.";
  if (code === "invalid_json") return "Claude's verdict didn't come back in the right shape. Try again.";
  return "Claude couldn't judge this one" + (e && e.message ? ": " + e.message : ".");
}
function apiErrorText(e) {
  const status = e && e.status;
  if (status === 401) return "That API key was rejected. Check it in Settings.";
  if (status === 429) return "Rate limited by the API. Wait a moment and try again.";
  if (status === 400) return "The API rejected the request: " + (e.message || "bad request");
  return "The API call failed" + (e && e.message ? ": " + e.message : ".");
}
function pasteJudge(prompt, n) {
  return new Promise((resolve, reject) => {
    let done = false;
    const close = modal((closeFn) => {
      const reply = h("textarea", { class: "input", id: "paste-reply", rows: 6, placeholder: "Paste the chatbot's whole reply here" });
      const err = h("p", { class: "small", style: { color: "var(--bad)" } });
      return [
        h("h3", {}, "Ask your own AI to judge"),
        h("ol", { class: "small", style: { margin: 0, paddingLeft: "1.2em" } },
          h("li", {}, "Copy the prompt below."),
          h("li", {}, "Paste it into ChatGPT, Claude, Gemini or any chatbot you use."),
          h("li", {}, "Paste the reply back here.")),
        h("div", { class: "code" }, prompt),
        h("div", { class: "row" }, h("button", { class: "btn small", onclick: () => copyText(prompt, "Prompt copied") }, "Copy prompt")),
        h("div", { class: "field" }, h("label", { for: "paste-reply" }, "The reply"), reply),
        err,
        h("div", { class: "row" },
          h("button", { class: "btn primary", onclick: () => {
            try {
              const out = J.parseJudgeReply(reply.value, n);
              done = true;
              closeFn();
              resolve(Object.assign(out, { source: "paste" }));
            } catch (e) {
              err.textContent = "Couldn't read a verdict in that reply. Paste all of it, including the part in curly brackets.";
            }
          } }, "Use this verdict"),
          h("button", { class: "btn ghost", onclick: () => { closeFn(); if (!done) reject(new Error("cancelled")); } }, "Cancel")),
      ];
    });
    void close;
  });
}

/** Magnifier view of an image item: [size %, position x %, position y %] for a zoom level. */
function lensView(item, level) {
  const zooms = item.zooms || [10, 5, 2.5, 1];
  const z = zooms[Math.min(level || 0, zooms.length - 1)];
  const [fx, fy] = item.focus || [0.5, 0.5];
  const pos = (f) => {
    if (z <= 1) return 50;
    const left = Math.max(0, Math.min(1 - 1 / z, f - 0.5 / z));
    return (100 * left * z) / (z - 1);
  };
  return { size: z * 100 + "%", x: pos(fx) + "%", y: pos(fy) + "%", z };
}
/** Point every magnifier inside `root` at a new zoom level (after a clue). */

    el.style.backgroundSize = v.size;
    el.style.backgroundPosition = `${v.x} ${v.y}`;
    el.dataset.z = v.z;
  });
}

/** "How fun was that one?" for an item. The element has .flush() to save any unsaved rating. */
function funRating(item, mode, extra = {}) {
  const key = "r" + Date.now().toString(36) + RAND.int(1e9).toString(36);
  const rec = Object.assign({ id: item.id || null, prompt: item.prompt, cat: item.cat || "byo", mode, fun: 0, tags: [], feel: "", note: "" }, extra);
  let lastSent = "";
  let timer = null;
  const status = h("span", { class: "small muted" });
  const flush = async () => {
    clearTimeout(timer);
    if (!rec.fun && !rec.tags.length && !rec.feel && !rec.note) return;
    const sig = JSON.stringify(rec);
    if (sig === lastSent) return;
    lastSent = sig;
    status.textContent = savedMsg(await Store.send("item", rec, key));
  };
  const later = () => { clearTimeout(timer); timer = setTimeout(flush, 1500); };
  const note = h("input", { class: "input", id: "fun-note-" + key, placeholder: "Anything to add? (optional)", maxlength: 500, oninput: (e) => { rec.note = e.target.value; later(); } });
  const el = h("div", { class: "rate" },
    h("div", { class: "spread" }, h("span", { class: "label" }, "How fun was that one?"), status),
    stars((n) => { rec.fun = n; later(); }, 0, "How fun"),
    h("span", { class: "small muted" }, "What made it that way? Pick any."),
    multiSeg(FUN_TAGS, (v) => { rec.tags = v; later(); }),
    h("span", { class: "small muted" }, "Difficulty"),
    seg([["easy", "Too easy"], ["right", "About right"], ["hard", "Too hard"]], "", (v) => { rec.feel = v; later(); }),
    note,
    item.id ? h("button", { class: "btn ghost small", style: { justifySelf: "start" }, onclick: () => { flush(); suggestScreen({ clueFor: item }); } }, "Suggest a better clue") : null);
  el.flush = flush;
  return el;
}

/**
 * Pass-and-play: each player in turn types privately. Renders into `host`; resolves with texts.
 * opts: {item, prompt (label), placeholder, check(text, i) -> error string or ""}
 */
function collectPrivately(host, players, opts) {
  return new Promise((resolve) => {
    const out = new Array(players.length).fill("");
    let i = 0;
    const step = (phase) => {
      clear(host);
      if (i >= players.length) { resolve(out); return; }
      const who = players[i];
      if (phase === "pass") {
        host.append(h("div", { class: "panel passcard" },
          h("span", { class: "eyebrow" }, `${i + 1} of ${players.length}`),
          h("div", {}, "Pass the device to"),
          h("div", { class: "who" }, who),
          h("button", { class: "btn primary", onclick: () => step("type") }, "I'm " + who)));
        return;
      }
      const input = h("input", { class: "input", id: "private-" + i, autocomplete: "off", placeholder: opts.placeholder || "Your guess", maxlength: 160 });
      const err = h("p", { class: "small", style: { color: "var(--bad)" } });
      const submit = () => {
        const text = input.value.trim();
        if (!text) { err.textContent = "Write something first."; return; }
        const problem = opts.check ? opts.check(text, i) : "";
        if (problem) { err.textContent = problem; return; }
        out[i] = text;
        i++;
        step("pass");
      };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      host.append(h("div", { class: "stack" },
        opts.item ? mysteryCard(opts.item, null, { level: opts.level }) : null,
        h("div", { class: "field" }, h("label", { for: "private-" + i }, `${who}: ${opts.prompt || "your guess"}`), input),
        err,
        h("div", { class: "row" },
          h("button", { class: "btn primary", onclick: submit }, "Done, hide it"),
          opts.skippable ? h("button", { class: "btn ghost", onclick: () => { out[i] = ""; i++; step("pass"); } }, "Skip") : null)));
      input.focus();
    };
    step("pass");
  });
}

/**
 * Judge a set of guesses. Shows controls inside `host`; calls onAward(winners, funniest, details).
 * opts.threshold: everyone scoring at least this is marked right (Daily Double, Final); otherwise the
 * top score wins. opts.penalty: also ask who was way off (they lose points; details.penalized).
 */
function judgePanel(host, { round, item, players, guesses, mode, defaultJudge, onAward, threshold, penalty, pickLabel }) {
  const typed = guesses && guesses.some((g) => g);
  const picked = new Set();
  const off = new Set();
  let funniest = null;
  let details = { judge: "room" };
  const box = h("div", { class: "stack" });
  const pickRow = h("div", { class: "pick", role: "group", "aria-label": "Winner" });
  const offRow = h("div", { class: "pick off", role: "group", "aria-label": "Way off" });
  const funRow = h("div", { class: "pick", role: "group", "aria-label": "Funniest guess" });
  const paintPicks = () => {
    pickRow.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(picked.has(i))));
    offRow.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(off.has(i))));
    funRow.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(funniest === i)));
  };
  players.forEach((p, i) => {
    pickRow.append(h("button", { type: "button", onclick: () => { picked.has(i) ? picked.delete(i) : (picked.add(i), off.delete(i)); paintPicks(); } }, p));
    offRow.append(h("button", { type: "button", onclick: () => { off.has(i) ? off.delete(i) : (off.add(i), picked.delete(i)); paintPicks(); } }, p));
    funRow.append(h("button", { type: "button", onclick: () => { funniest = funniest === i ? null : i; paintPicks(); } }, p));
  });
  const results = h("div", { class: "guesslog" });
  const showScores = (scores, label) => {
    clear(results);
    const order = players.map((_, i) => i).filter((i) => guesses[i]).sort((a, b) => (scores[b] ? scores[b].score : -1) - (scores[a] ? scores[a].score : -1));
    for (const i of order) {
      const s = scores[i];
      const w = J.warmth(s ? s.score : 0);
      results.append(h("div", { class: "g" },
        h("span", { class: "t" }, players[i], ": “", guesses[i], "”"),
        h("span", { class: "s lv" + w.level }, s ? s.score : "–"),
        s && s.why ? h("span", { class: "why small muted" }, s.why) : null));
    }
    results.prepend(h("p", { class: "small muted" }, label));
    picked.clear();
    off.clear();
    const top = order.length ? (scores[order[0]] ? scores[order[0]].score : 0) : 0;
    order.forEach((i) => {
      const sc = scores[i] ? scores[i].score : 0;
      if (threshold != null ? sc >= threshold : sc === top && top > 0) picked.add(i);
      if (penalty && sc < 25) off.add(i);
    });
    paintPicks();
  };
  // The free judge: answer key first, then word vectors. Returns how many guesses the key covered.
  const freeScores = async () => {
    const sp = await loadRobot();
    if (!sp) return null;
    const scores = guesses.map((g) => {
      if (!g) return null;
      const r = round.custom ? J.scoreAgainst(SPACE, g, round.target) : robotScore(g, item);
      return { score: r.score, why: r.by === "key" ? r.hint : "", byKey: r.by === "key" };
    });
    return scores;
  };
  const robotBtn = h("button", { class: "btn small", onclick: async () => {
    robotBtn.disabled = true;
    const scores = await freeScores();
    robotBtn.disabled = false;
    if (!scores) { toast("The robot judge couldn't load its word list."); return; }
    details = { judge: "robot", scores: scores.map((s) => (s ? s.score : null)) };
    showScores(scores, "Free judge: the mystery's answer key where a guess matches it, word-vector closeness otherwise.");
  } }, "Free judge");
  let auto = false; // set while the AI judge runs by default rather than by a tap
  const aiBtn = h("button", { class: "btn small", onclick: async () => {
    const wasAuto = auto;
    auto = false;
    aiBtn.disabled = true;
    const old = aiBtn.textContent;
    aiBtn.textContent = "Judging…";
    try {
      const list = players.map((p, i) => ({ name: p, text: guesses[i] })).filter((g) => g.text);
      const idx = players.map((_, i) => i).filter((i) => guesses[i]);
      const out = await aiJudge(round, list);
      const scores = new Array(players.length).fill(null);
      out.scores.forEach((s, k) => { scores[idx[k]] = s; });
      details = { judge: "ai", source: out.source, scores: scores.map((s) => (s ? s.score : null)), comment: out.comment };
      showScores(scores, `AI judge (${aiSourceLabel(out.source)}). ${out.comment || ""}`);
      if (out.funniest != null) { funniest = idx[out.funniest]; paintPicks(); }
    } catch (e) {
      if (e.message !== "cancelled") toast(e.message);
      if (wasAuto) robotBtn.click();
    } finally {
      aiBtn.disabled = false;
      aiBtn.textContent = old;
    }
  } }, "AI judge");

  const ask = pickLabel || (threshold != null ? `Who got it? (${threshold} or more counts)` : "Who was closest?");
  box.append(h("p", { class: "label" }, typed ? ask : ask + " Read your guesses out, then tap names."));
  if (typed) box.append(h("div", { class: "row" }, robotBtn, aiBtn, h("span", { class: "small muted" }, "or just tap a name")));
  box.append(results, pickRow);
  if (penalty) box.append(h("p", { class: "label" }, "Way off? (they lose the value)"), offRow);
  if (threshold == null) box.append(h("p", { class: "label" }, "Funniest guess (bonus, optional)"), funRow);
  box.append(h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
    details.winners = [...picked];
    details.penalized = [...off];
    details.funniest = funniest;
    if (details.judge !== "room" && typed) {
      Store.send("judge", { id: item && item.id, prompt: round.prompt, truth: round.truth, mode, guesses, judge: details.judge, scores: details.scores, winners: details.winners });
    }
    onAward([...picked], funniest, details);
  } }, "Award and continue")));
  host.append(box);
  if (!typed) return;
  // AI by default, unless the answer key already covers every guess (then it costs nothing).
  // Pasting into a chatbot is never started automatically: without a built-in AI, the free judge runs.
  const aiAuto = () => { if (aiSource() === "paste") robotBtn.click(); else { auto = true; aiBtn.click(); } };
  if (defaultJudge === "ai" && !round.custom) {
    freeScores().then((scores) => {
      if (scores && scores.every((s, i) => !guesses[i] || (s && s.byKey))) {
        details = { judge: "robot", scores: scores.map((s) => (s ? s.score : null)) };
        showScores(scores, "Answer key: every guess matched one scored in advance.");
      } else aiAuto();
    });
  } else if (defaultJudge === "ai") aiAuto();
  else if (defaultJudge === "robot") robotBtn.click();
}

function timerEl(seconds, onEnd) {
  if (!seconds) return { el: null, stop() {} };
  let left = seconds;
  const el = h("span", { class: "timer", "aria-live": "polite" }, left + "s");
  const id = setInterval(() => {
    left--;
    el.textContent = left > 0 ? left + "s" : "Time!";
    if (left <= 0) { clearInterval(id); if (onEnd) onEnd(); }
  }, 1000);
  return { el, stop() { clearInterval(id); } };
}

// ---- daily.js ----
/* Trial A: Daily five. Solo; five mysteries a day, one per category. Type guesses and the robot
   judge says how warm each one is; clues and "pick from four" are there when stuck, at a cost. */

const CLUE_MULT = [1, 0.85, 0.7, 0.55];
const MAX_GUESSES = 4;
const { dayNumber } = window.WhatPick;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dailyItems(dateStr) {
  return window.WhatPick.dailyItems(CONTENT, dateStr);
}

function practiceItems() {
  const cats = catsAvailable().filter((c) => c !== "double" || SETTINGS.pg13);
  return RAND.shuffle(cats.slice()).slice(0, 5).map((c) => {
    const p = pool(c);
    return p[RAND.int(p.length)];
  });
}

function newRound() {
  return { guesses: [], clues: 0, mc: null, verdict: null, revealed: false, points: 0, ai: null };
}

function roundPoints(item, r) {
  const best = r.guesses.reduce((m, g) => Math.max(m, g.s), 0);
  let base = best;
  if (r.mc && r.mc.pick != null) base = r.mc.right ? Math.max(best, 50) : Math.round(best / 2);
  let pts = Math.round(base * CLUE_MULT[r.clues]);
  if (item.kind === "plate" && r.verdict && item.dmv && r.verdict === item.dmv) pts += 10;
  return pts;
}
function pointsWhy(item, r) {
  const best = r.guesses.reduce((m, g) => Math.max(m, g.s), 0);
  const bits = [];
  if (r.mc && r.mc.pick != null) bits.push(r.mc.right ? "picked the right one of four (50)" : "picked a wrong one of four (half your best guess)");
  else bits.push(r.guesses.length ? "best guess " + best : "no guess");
  if (r.clues) bits.push(`× ${CLUE_MULT[r.clues]} for ${r.clues} clue${r.clues > 1 ? "s" : ""}`);
  if (item.kind === "plate" && r.verdict) bits.push(r.verdict === item.dmv ? "+10 for calling the DMV verdict" : "DMV verdict missed");
  return bits.join(", ");
}
function emojiFor(points) {
  return points >= 70 ? "🟩" : points >= 45 ? "🟨" : points >= 20 ? "🟧" : "⬛";
}

function dailyScreen(opts = {}) {
  const practice = !!opts.practice;
  const date = todayStr();
  const items = practice ? practiceItems() : dailyItems(date);
  const key = "daily:" + date;
  const st = (!practice && load(key, null)) || { date, i: 0, rounds: items.map(newRound) };
  const persist = () => { if (!practice) save(key, st); };
  const root = h("div", { class: "stack" });
  let rating = null;
  let robot = "loading";
  // Each guess goes to the answer key first (free), then the site's AI judge if there is one; the
  // word-vector robot stands in when neither can answer.
  loadRobot().then((s) => { robot = s ? "ready" : "failed"; if (!st.rounds[st.i] || !st.rounds[st.i].revealed) render(); });
  render();
  return root;

  function header() {
    return h("div", { class: "spread" },
      h("div", { class: "stack-sm" },
        h("span", { class: "eyebrow" }, practice ? "Trial A · Practice five" : `Trial A · Daily No. ${dayNumber(date)}`),
        h("div", { class: "pips", "aria-label": `Mystery ${Math.min(st.i + 1, 5)} of 5` },
          items.map((_, i) => h("i", { class: i < st.i ? "done" : i === st.i ? "now" : "" })))),
      h("span", { class: "tabular muted small" }, st.rounds.reduce((s, r) => s + (r.revealed ? r.points : 0), 0), " pts"));
  }

  function render() {
    clear(root);
    root.append(header());
    if (st.i >= items.length) { renderEnd(); return; }
    const item = items[st.i];
    const r = st.rounds[st.i];
    root.append(mysteryCard(item, h("span", { class: "num" }, `${st.i + 1}/5`), { level: r.clues }));
    if (r.revealed) renderReveal(item, r);
    else renderPlay(item, r);
    window.scrollTo({ top: 0 });
  }

  function guessLog(r, withChips) {
    if (!r.guesses.length) return null;
    return h("div", { class: "guesslog" }, r.guesses.map((g, i) => {
      const w = J.warmth(g.s);
      const last = i === r.guesses.length - 1;
      return h("div", { class: "g" },
        h("span", { class: "t" }, g.t),
        h("span", { class: "s lv" + w.level }, g.s),
        last && withChips && g.res ? h("div", { class: "why" }, warmthMeter(g.s)) : null,
        last && withChips && g.res ? h("div", { class: "why" }, matchChips(g.res)) : null,
        last && withChips && (g.by === "ai" || g.by === "key") ? h("div", { class: "why" }, warmthMeter(g.s)) : null,
        g.hint ? h("div", { class: "why small muted" }, g.hint) : null,
        g.trap ? h("div", { class: "why trapnote small" }, "That's close to a tempting wrong answer: “" + g.trap + "”") : null);
    }));
  }

  function renderPlay(item, r) {
    const left = MAX_GUESSES - r.guesses.length;
    const input = h("input", { class: "input", id: "daily-guess", autocomplete: "off", maxlength: 160, placeholder: r.guesses.length ? "Another guess" : "Your guess, in a few words" });
    const go = async () => {
      const text = input.value.trim();
      if (!text) return;
      input.disabled = true;
      let entry = null;
      const sp = await loadRobot();
      const local = sp ? robotScore(text, item) : null;
      if (local && local.by === "key") entry = { t: text, s: local.score, hint: local.hint, by: "key" };
      if (!entry && siteJudgeUsable()) {
        try {
          const out = await siteJudge({ mode: "score", id: item.id, guesses: [text] });
          entry = { t: text, s: out.score, hint: out.hint, by: out.by === "key" ? "key" : "ai" };
        } catch (e) {
          if (!siteJudgeUsable() && SITE_NOTE) toast(SITE_NOTE);
        }
      }
      if (!entry) {
        if (!local) { input.disabled = false; toast("The judge didn't load. Use “Pick from four” instead."); return; }
        entry = { t: text, s: local.score, trap: local.trap ? local.trap.decoy : null, res: { matches: local.matches, unknown: local.unknown }, by: "robot" };
      }
      r.guesses.push(entry);
      if (entry.s >= 85 || r.guesses.length >= MAX_GUESSES) finish(item, r);
      persist();
      render();
      const again = $("#daily-guess");
      if (again) again.focus();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });

    const log = guessLog(r, true);
    if (log) root.append(log);
    if (r.clues) root.append(h("div", { class: "stack-sm" }, item.clues.slice(0, r.clues).map((c, i) => h("p", { class: "clue" }, h("b", {}, "Clue " + (i + 1) + ": "), c))));

    if (r.mc) {
      root.append(h("p", { class: "label" }, "Which one is it?"),
        h("div", { class: "choices" }, r.mc.opts.map((o, i) => h("button", { class: "choice", onclick: () => {
          r.mc.pick = i;
          r.mc.right = o === item.truth;
          finish(item, r);
          persist();
          render();
        } }, o))));
    } else {
      root.append(h("div", { class: "guessrow" }, input, h("button", { class: "btn primary", onclick: go, disabled: left <= 0 }, "Guess")));
      root.append(h("p", { class: "small muted" },
        robot === "loading" ? "Warming up the judge… " : robot === "failed" && !siteJudgeUsable() ? "The judge couldn't load here; pick from four instead. " : "",
        `${left} guess${left === 1 ? "" : "es"} left. A score of 85 or more counts as spot on.`));
    }

    if (item.kind === "plate" && item.dmv) {
      root.append(h("div", { class: "stack-sm" },
        h("span", { class: "label" }, "Side bet (+10): did the DMV approve it?"),
        seg([["approved", "Approved"], ["denied", "Denied"]], r.verdict, (v) => { r.verdict = v; persist(); })));
    }

    const clueBtn = h("button", { class: "btn small", disabled: r.clues >= Math.min(3, (item.clues || []).length) || !!r.mc, onclick: () => { r.clues++; persist(); render(); } },
      r.clues >= (item.clues || []).length ? "No more clues" : `Clue (×${CLUE_MULT[r.clues + 1] || CLUE_MULT[3]})`);
    const mcBtn = h("button", { class: "btn small", disabled: !!r.mc || !(item.decoys && item.decoys.length), onclick: () => {
      const opts2 = rng("mc-" + item.id).shuffle([item.truth, ...item.decoys.slice(0, 3)]);
      r.mc = { opts: opts2, pick: null, right: null };
      persist();
      render();
    } }, "Pick from four");
    const giveUp = h("button", { class: "btn ghost small", onclick: () => { finish(item, r); persist(); render(); } }, "Show me");
    root.append(h("div", { class: "row" }, clueBtn, mcBtn, giveUp));
    root.append(howJudging());
    if (!r.mc) input.focus();
  }

  function finish(item, r) {
    r.revealed = true;
    r.points = roundPoints(item, r);
  }

  function renderReveal(item, r) {
    const extra = [];
    if (item.kind === "plate" && r.verdict) {
      extra.push(h("p", { class: "small" }, `You said ${r.verdict}: `, r.verdict === item.dmv ? h("b", {}, "right (+10)") : "not this time"));
    }
    if (r.mc && r.mc.pick != null) {
      extra.push(h("p", { class: "small" }, r.mc.right ? "You picked the real one." : `You picked: “${r.mc.opts[r.mc.pick]}”`));
    }
    root.append(revealCard(item, { extra: extra.length ? h("div", { class: "stack-sm" }, extra) : null }));
    root.append(h("div", { class: "spread" },
      h("span", { class: "scorebig tabular" }, "+" + r.points),
      h("span", { class: "small muted", style: { maxWidth: "40ch", textAlign: "right" } }, pointsWhy(item, r))));
    const log = guessLog(r, false);
    if (log) root.append(log);

    if (r.guesses.length && r.guesses.some((g) => g.by === "robot")) {
      const aiBox = h("div", { class: "stack-sm" });
      if (r.ai) aiBox.append(aiCompare(r));
      else {
        const btn = h("button", { class: "btn small", onclick: async () => {
          btn.disabled = true;
          btn.textContent = "Asking…";
          try {
            const out = await aiJudge(
              { id: item.id, prompt: item.prompt, kindLabel: kindLabel(item), ask: item.ask, truth: item.truth, more: item.more },
              r.guesses.map((g, i) => ({ name: "Guess " + (i + 1), text: g.t })));
            r.ai = { source: out.source, scores: out.scores.map((s) => (s ? s.score : null)), why: out.scores.map((s) => (s ? s.why : "")), comment: out.comment };
            persist();
            Store.send("judge", { id: item.id, prompt: item.prompt, truth: item.truth, mode: "daily", guesses: r.guesses.map((g) => g.t), robot: r.guesses.map((g) => g.s), ai: r.ai.scores, source: out.source });
            clear(aiBox).append(aiCompare(r));
          } catch (e) {
            btn.disabled = false;
            btn.textContent = "Ask the AI judge for a second opinion";
            if (e.message !== "cancelled") toast(e.message);
          }
        } }, "Ask the AI judge for a second opinion");
        aiBox.append(h("div", { class: "row" }, btn, h("span", { class: "small muted" }, "Uses " + aiSourceLabel(aiSource()) + ". Compare it with the robot.")));
      }
      root.append(aiBox);
    }

    rating = funRating(item, practice ? "practice" : "daily", { points: r.points, guesses: r.guesses.length, clues: r.clues, mc: !!r.mc });
    root.append(rating);
    root.append(h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
      if (rating) rating.flush();
      st.i++;
      persist();
      render();
    } }, st.i < items.length - 1 ? "Next mystery" : "See your score")));
  }

  function aiCompare(r) {
    return h("div", { class: "panel stack-sm" },
      h("span", { class: "label" }, "Robot vs AI judge (" + aiSourceLabel(r.ai.source) + ")"),
      r.guesses.map((g, i) => h("div", { class: "spread small" },
        h("span", {}, "“", g.t, "”"),
        h("span", { class: "tabular" }, "robot ", h("b", {}, g.s), " · AI ", h("b", {}, r.ai.scores[i] == null ? "–" : r.ai.scores[i])),
        r.ai.why[i] ? h("span", { class: "muted", style: { flexBasis: "100%" } }, r.ai.why[i]) : null)),
      r.ai.comment ? h("p", { class: "small muted" }, r.ai.comment) : null);
  }

  function renderEnd() {
    const total = st.rounds.reduce((s, r) => s + r.points, 0);
    const grid = st.rounds.map((r) => emojiFor(r.points)).join("");
    const share = `What Is It? ${practice ? "practice" : "No. " + dayNumber(date)}\n${grid} ${total}/500${CONFIG.shareUrl ? "\n" + CONFIG.shareUrl : ""}`;
    root.append(h("div", { class: "panel stack" },
      h("span", { class: "eyebrow" }, practice ? "Practice done" : "Today's five, done"),
      h("div", { class: "spread" }, h("span", { class: "scorebig tabular" }, total, " / 500"), h("span", { class: "grid-emoji", "aria-label": "Results grid" }, grid)),
      h("div", { class: "row" },
        h("button", { class: "btn primary", onclick: () => copyText(share, "Result copied") }, "Copy result"),
        h("button", { class: "btn", onclick: () => go("practice") }, "Practice five more"))));
    root.append(h("div", { class: "stack-sm" }, items.map((it, i) => h("div", { class: "panel", style: { padding: "12px 14px" } },
      h("div", { class: "spread" }, h("span", { class: "eyebrow" }, CATS[it.cat].short), h("span", { class: "tabular small" }, emojiFor(st.rounds[i].points), " ", st.rounds[i].points)),
      h("div", {}, h("b", {}, it.prompt), " — ", it.truth)))));
    root.append(trialRating("A", "Rate Trial A: Daily five"));
  }
}

function howJudging() {
  return h("details", { class: "how" },
    h("summary", {}, "How guesses are scored"),
    h("div", { class: "prose small" },
      h("p", {}, "Every mystery has an answer key: a dozen likely guesses, scored in advance with hints. If your guess says the same thing as one of them, it gets that score straight away."),
      h("p", {}, "A new guess goes to a small AI model, which reads it next to the real answer and scores how close it is in meaning, from 0 to 100, with a hint that doesn't give the answer away. 85 or more is spot on."),
      h("p", {}, "If the AI judge isn't available, a free word-vector \u201crobot\u201d stands in: it compares your words with the answer's key ideas and the nearest answer-key guesses, using the ConceptNet Numberbatch word map from Word Bocce. It is quicker but more literal.")));
}

// ---- party.js ----
/* Trial B: Party board. Same room or on a call. Pick a square; everyone guesses; the closest guess
   takes it. Three boards:
   - Points, Jeopardy-style: categories x values. By default a column's lower values must go before its
     higher ones (on TV any square may be picked; that is an option). Whoever takes a square picks
     next. One hidden Daily Double: the picker alone answers, for a wager. Optionally, way-off guesses
     lose the value. A Final mystery with wagers ends the game.
   - Tic-tac-toe and Connect Four, two teams: the team that wins a round claims the square. */

const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const CLUE_VALUE = [1, 0.75, 0.5, 0.25];
const C4_SIZE = { quick: { cols: 5, rows: 4 }, full: { cols: 7, rows: 6 } };
const RIGHT = 65; // a Daily Double or Final guess this close or closer counts as right

function partyScreen() {
  const root = h("div", { class: "stack" });
  let P = null;
  setup();
  return root;

  function teams(style) { return style === "ttt" || style === "c4"; }

  function setup() {
    clear(root);
    const cfg = Object.assign(
      { style: "points", entry: "typed", judge: siteJudgeUsable() ? "ai" : "robot", timer: 0, rows: 3, ladder: true, dd: true, final: true, penalty: false, c4: "quick", cats: null },
      load("party-cfg", {}));
    let editor;
    const edHost = h("div");
    const optHost = h("div", { class: "stack" });
    const catHost = h("div", { class: "stack-sm" });
    const paintEditor = () => {
      clear(edHost);
      const names = teams(cfg.style) ? load("party-teams", ["Team X", "Team O"]) : (SETTINGS.players.length ? SETTINGS.players : ["Player 1", "Player 2", "Player 3"]);
      editor = teams(cfg.style)
        ? playersEditor(names.slice(0, 2), { min: 2, max: 2, noun: "Team" })
        : playersEditor(names, { min: 2, max: 8, noun: "Player" });
      edHost.append(h("p", { class: "label" }, teams(cfg.style) ? "Two teams" : "Players or teams"), editor.el);
    };
    let catPick;
    const paintCats = () => {
      clear(catHost);
      const avail = catsAvailable().filter((c) => c !== "double" || SETTINGS.pg13 || pg.checked);
      const max = cfg.style === "points" ? 6 : cfg.style === "c4" ? C4_SIZE[cfg.c4].cols : 9;
      const saved = (cfg.cats || []).filter((c) => avail.includes(c));
      const start = saved.length ? saved.slice(0, max) : RAND.shuffle(avail.filter((c) => c !== "double")).slice(0, Math.min(max, 6));
      catPick = chipPicker(avail.map((c) => [c, CATS[c].label]), start, max);
      catHost.append(h("span", { class: "label" }, cfg.style === "c4" ? `Categories (one per column, up to ${max})` : `Categories (up to ${max})`), catPick.el);
    };
    const paintOpts = () => {
      clear(optHost);
      if (cfg.style === "points") {
        optHost.append(
          h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Rows"),
            seg([[3, "3 rows: 100 to 300"], [5, "5 rows: 200 to 1,000"]], cfg.rows, (v) => { cfg.rows = v; })),
          h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Picking squares"),
            seg([[true, "Lowest first in each column"], [false, "Any square (as on TV)"]], cfg.ladder, (v) => { cfg.ladder = v; })),
          check("party-dd", "One hidden Daily Double: the picker answers alone, for a wager", cfg.dd, (v) => { cfg.dd = v; }),
          check("party-penalty", "Way-off guesses lose the value", cfg.penalty, (v) => { cfg.penalty = v; }),
          check("party-final", "Final mystery with wagers", cfg.final, (v) => { cfg.final = v; }));
      } else if (cfg.style === "c4") {
        optHost.append(h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Board size"),
          seg([["quick", "Quick: 5 columns, 4 rows"], ["full", "Full: 7 columns, 6 rows"]], cfg.c4, (v) => { cfg.c4 = v; paintCats(); })));
      }
    };
    const pg = h("input", { type: "checkbox", id: "party-pg13", checked: SETTINGS.pg13, onchange: () => paintCats() });
    paintEditor();
    paintCats();
    paintOpts();
    root.append(
      h("div", { class: "stack-sm" }, h("span", { class: "eyebrow" }, "Trial B"), h("h2", {}, "Party board"),
        h("p", { class: "lede" }, "For a room or a video call. Pick a square, everyone guesses what the mystery really is, and the closest guess takes the square.")),
      h("div", { class: "panel stack" },
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Board"),
          seg([["points", "Points board"], ["ttt", "Tic-tac-toe"], ["c4", "Connect Four"]], cfg.style, (v) => {
            cfg.style = v;
            paintEditor();
            paintCats();
            paintOpts();
          })),
        edHost, catHost, optHost,
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Guesses"),
          seg([["typed", "Type them on this device, passing it round"], ["paper", "Paper or out loud"]], cfg.entry, (v) => { cfg.entry = v; })),
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Judge"),
          seg([["robot", "Free judge"], ["ai", "AI"], ["room", "The room decides"]], cfg.judge, (v) => { cfg.judge = v; }),
          h("p", { class: "small muted" }, "The free judge uses each mystery's answer key and word vectors. Judges need typed guesses; you can always overrule them by tapping a name.")),
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Timer"),
          seg([[0, "None"], [30, "30 seconds"], [60, "60 seconds"]], cfg.timer, (v) => { cfg.timer = v; })),
        h("label", { class: "check", for: "party-pg13" }, pg, h("span", {}, "Include ", h("b", {}, "Double take"), " (PG-13 misreadings)")),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
          SETTINGS.pg13 = pg.checked;
          const names = editor.get();
          if (teams(cfg.style)) save("party-teams", names);
          else SETTINGS.players = names;
          saveSettings();
          cfg.cats = catPick.get();
          if (!cfg.cats.length) { toast("Pick at least one category"); return; }
          save("party-cfg", cfg);
          start(cfg, names);
        } }, "Deal the board"))));
  }

  function check(id, label, on, onChange) {
    const box = h("input", { type: "checkbox", id, checked: on, onchange: (e) => onChange(e.target.checked) });
    return h("label", { class: "check", for: id }, box, h("span", {}, label));
  }

  function start(cfg, names) {
    loadRobot();
    const used = new Set();
    const take = (cat, diff) => {
      const p = pool(cat).filter((it) => !used.has(it.id));
      const exact = p.filter((it) => (it.difficulty || 2) === diff);
      const from = exact.length ? exact : p.length ? p : CONTENT.filter((it) => allowed(it) && !used.has(it.id));
      const it = from[RAND.int(from.length)];
      used.add(it.id);
      return it;
    };
    const cats = cfg.cats && cfg.cats.length ? cfg.cats : catsAvailable().slice(0, 6);
    P = { cfg, players: names.map((n) => ({ name: n, score: 0 })), turn: 0, control: 0, take };
    if (cfg.style === "points") {
      const rows = cfg.rows === 5 ? 5 : 3;
      const values = rows === 5 ? [200, 400, 600, 800, 1000] : [100, 200, 300];
      const diff = rows === 5 ? [1, 1, 2, 3, 3] : [1, 2, 3];
      P.cols = RAND.shuffle(cats.slice()).slice(0, 6).map((cat) => ({ cat, tiles: values.map((v, r) => ({ value: v, item: take(cat, diff[r]), done: false, by: [] })) }));
      if (cfg.dd) {
        const deep = P.cols.flatMap((c) => c.tiles.slice(1));
        deep[RAND.int(deep.length)].dd = true;
      }
      if (cfg.final) {
        const fc = cats[RAND.int(cats.length)];
        P.final = take(fc, 3);
      }
    } else if (cfg.style === "ttt") {
      const order = RAND.shuffle(cats.slice());
      P.cells = Array.from({ length: 9 }, (_, i) => {
        const cat = order[i % order.length];
        return { cat, item: take(cat, 1 + RAND.int(3)), mark: null, done: false };
      });
    } else {
      const { cols, rows } = C4_SIZE[cfg.c4] || C4_SIZE.quick;
      const order = RAND.shuffle(cats.slice());
      P.c4 = { cols, rows, grid: new Array(cols * rows).fill(null), colCats: Array.from({ length: cols }, (_, i) => order[i % order.length]) };
    }
    board();
  }

  function topValue() {
    return Math.max(...P.cols.flatMap((c) => c.tiles.map((t) => t.value)));
  }
  function open(col, t) {
    if (t.done) return false;
    if (!P.cfg.ladder) return true;
    return col.tiles.every((x) => x === t || x.value > t.value || x.done);
  }

  function scoresBar() {
    const top = Math.max(...P.players.map((p) => p.score));
    const two = P.cfg.style !== "points";
    const count = (i) => (P.cfg.style === "ttt" ? P.cells.filter((c) => c.mark === i).length : P.c4.grid.filter((m) => m === i).length);
    return h("div", { class: "scores" }, P.players.map((p, i) => h("div", { class: "sc" + (!two && p.score === top && top > 0 ? " lead" : "") + (two ? (i === 0 ? " team-x" : " team-o") : "") + (!two && P.control === i ? " control" : "") },
      h("span", { class: "small muted" }, two ? (i === 0 ? "X · " : "O · ") + p.name : p.name),
      h("b", { class: "tabular" }, two ? count(i) : p.score))));
  }

  function board() {
    clear(root);
    root.append(h("div", { class: "spread" }, h("span", { class: "eyebrow" }, "Trial B · Party board"),
      h("button", { class: "btn ghost small", onclick: () => { if (P) end(); } }, "End game")));
    root.append(scoresBar());
    if (P.cfg.style === "points") pointsBoard();
    else if (P.cfg.style === "ttt") tttBoard();
    else c4Board();
  }

  function pointsBoard() {
    if (P.cols.every((c) => c.tiles.every((t) => t.done))) {
      if (P.final && !P.finalDone) finalRound();
      else end();
      return;
    }
    root.append(h("p", { class: "label" }, `${P.players[P.control].name} has control: pick a square.`));
    const grid = h("div", { class: "board points", style: { "--cols": P.cols.length } });
    P.cols.forEach((c) => grid.append(h("div", { class: "head" }, CATS[c.cat].label)));
    const rows = P.cols[0].tiles.length;
    for (let row = 0; row < rows; row++) {
      P.cols.forEach((c) => {
        const t = c.tiles[row];
        const can = open(c, t);
        grid.append(h("button", { class: "tile" + (!t.done && !can ? " locked" : ""), disabled: !can, "aria-label": `${CATS[c.cat].label}, ${t.value}${!t.done && !can ? ", locked" : ""}`,
          onclick: () => (t.dd ? dailyDouble(c, t) : round({ kind: "points", tile: t, cat: c.cat, item: t.item })) },
          t.done ? (t.by.length ? P.players[t.by[0]].name.slice(0, 10) : "–") : t.value));
      });
    }
    root.append(grid);
    root.append(h("p", { class: "small muted" },
      P.cfg.ladder ? "Clear a column's lower values to unlock its higher ones. " : "Any square is open. ",
      "Whoever takes a square picks next. Bigger numbers are harder.",
      P.cfg.dd ? " One square hides a Daily Double." : ""));
  }

  function tttBoard() {
    const team = P.players[P.turn % 2];
    root.append(h("p", { class: "label" }, `${P.turn % 2 === 0 ? "X" : "O"} · ${team.name} picks a square. Both teams guess; the closer one claims it.`));
    const grid = h("div", { class: "board ttt" });
    P.cells.forEach((c) => grid.append(h("button", { class: "tile" + (c.mark === 0 ? " x" : c.mark === 1 ? " o" : ""), disabled: c.done, "aria-label": c.done ? "Taken" : CATS[c.cat].label, onclick: () => round({ kind: "ttt", cell: c, cat: c.cat, item: c.item }) },
      c.mark === 0 ? h("span", { class: "mark" }, "X") : c.mark === 1 ? h("span", { class: "mark" }, "O") : c.done ? "–" : CATS[c.cat].short)));
    root.append(grid);
  }

  function c4Board() {
    const { cols, rows, grid, colCats } = P.c4;
    const team = P.players[P.turn % 2];
    root.append(h("p", { class: "label" }, `${P.turn % 2 === 0 ? "X" : "O"} · ${team.name} picks a column. Both teams guess; the closer one drops a disc there.`));
    const el = h("div", { class: "board c4", style: { "--cols": cols } });
    for (let c = 0; c < cols; c++) {
      const full = grid[(rows - 1) * cols + c] !== null;
      el.append(h("button", { class: "drop", disabled: full, "aria-label": `Column ${c + 1}: ${CATS[colCats[c]].label}${full ? ", full" : ""}`,
        onclick: () => {
          const r = grid.findIndex((m, k) => k % cols === c && m === null);
          const height = Math.floor(r / cols);
          round({ kind: "c4", col: c, cat: colCats[c], item: P.take(colCats[c], Math.min(3, 1 + Math.floor((height * 3) / rows))) });
        } }, CATS[colCats[c]].short));
    }
    for (let r = rows - 1; r >= 0; r--) {
      for (let c = 0; c < cols; c++) {
        const m = grid[r * cols + c];
        el.append(h("span", { class: "slot" + (m === 0 ? " x" : m === 1 ? " o" : ""), "aria-label": m === 0 ? "X" : m === 1 ? "O" : "empty" }));
      }
    }
    root.append(el);
    root.append(h("p", { class: "small muted" }, "Four in a row across, up or diagonally wins. If neither team is closer, no disc drops."));
  }

  function c4Winner() {
    const { cols, rows, grid } = P.c4;
    const at = (c, r) => (c >= 0 && c < cols && r >= 0 && r < rows ? grid[r * cols + c] : null);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const m = at(c, r);
        if (m === null) continue;
        for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
          if ([1, 2, 3].every((k) => at(c + dc * k, r + dr * k) === m)) return m;
        }
      }
    }
    return null;
  }

  /** A round: show the mystery, give clues, collect guesses, reveal, judge, award. */
  function round(sel) {
    const item = sel.item;
    const names = P.players.map((p) => p.name);
    let clues = 0;
    clear(root);
    const valueEl = h("span", { class: "chip" });
    const paintValue = () => {
      valueEl.textContent = sel.kind === "points" ? `Worth ${Math.round(sel.tile.value * CLUE_VALUE[clues])}` : sel.kind === "c4" ? "Wins the disc" : "Claims the square";
    };
    paintValue();
    const t = timerEl(P.cfg.timer, () => toast("Time's up"));
    const card = mysteryCard(item, valueEl);
    root.append(card);
    const clueBox = h("div", { class: "stack-sm" });
    const clueBtn = h("button", { class: "btn small", onclick: () => {
      if (clues >= (item.clues || []).length) return;
      clueBox.append(h("p", { class: "clue" }, h("b", {}, "Clue " + (clues + 1) + ": "), item.clues[clues]));
      clues++;
      zoomTo(card, item, clues);
      paintValue();
      if (clues >= (item.clues || []).length) clueBtn.disabled = true;
    } }, item.kind === "image" ? "Zoom out (clue)" : "Give a clue");
    const area = h("div", { class: "stack" });
    root.append(h("div", { class: "row" }, clueBtn, t.el), clueBox, area);

    const reveal = (guesses) => {
      t.stop();
      clear(area);
      zoomTo(card, item, 99);
      area.append(revealCard(item));
      const rating = funRating(item, "party");
      judgePanel(area, {
        round: { id: item.id, prompt: item.prompt, kindLabel: kindLabel(item), ask: item.ask, truth: item.truth, more: item.more },
        item, players: names, guesses, mode: "party", defaultJudge: P.cfg.entry === "typed" ? P.cfg.judge : "room",
        penalty: sel.kind === "points" && P.cfg.penalty,
        onAward: (winners, funniest, details) => {
          rating.flush();
          if (sel.kind === "points") {
            const pts = Math.round(sel.tile.value * CLUE_VALUE[clues]);
            winners.forEach((w) => { P.players[w].score += pts; });
            (details.penalized || []).forEach((w) => { P.players[w].score -= pts; });
            if (funniest != null) P.players[funniest].score += 50;
            sel.tile.done = true;
            sel.tile.by = winners;
            if (winners.length && !winners.includes(P.control)) P.control = winners[0];
          } else if (sel.kind === "ttt") {
            sel.cell.done = true;
            sel.cell.mark = winners.length === 1 ? winners[0] : null;
            P.turn++;
            const winner = LINES.find((l) => l.every((k) => P.cells[k].mark === 0)) ? 0 : LINES.find((l) => l.every((k) => P.cells[k].mark === 1)) ? 1 : null;
            if (winner != null || P.cells.every((c) => c.done)) { end(winner); return; }
          } else {
            const { cols, grid } = P.c4;
            if (winners.length === 1) {
              const k = grid.findIndex((m, i) => i % cols === sel.col && m === null);
              if (k >= 0) grid[k] = winners[0];
            }
            P.turn++;
            const winner = c4Winner();
            if (winner != null || grid.every((m) => m !== null)) { end(winner); return; }
          }
          board();
        },
      });
      area.append(rating);
    };
    collect(area, item, names, () => clues, reveal);
  }

  /** Guesses typed in private, passing the device round, or on paper. */
  function collect(area, item, names, level, then, label) {
    if (P.cfg.entry === "typed") {
      area.append(h("p", { class: "muted" }, label || "Everyone take a look. Then pass the device round so each player types a guess in private."),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: async () => {
          const guesses = await collectPrivately(area, names, { item, level: level(), prompt: "what is it?", placeholder: "Your guess, in a few words", skippable: true });
          clear(area);
          area.append(h("p", { class: "label" }, "All guesses are in."), h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => then(guesses) }, "Reveal the answer")));
        } }, "Collect guesses")));
    } else {
      area.append(h("p", { class: "muted" }, "Everyone write a guess on paper (or keep it in your head). When you're ready, reveal."),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => then(names.map(() => "")) }, "Reveal the answer")));
    }
  }

  function wagerInput(id, max, value) {
    return h("input", { class: "input", id, type: "number", inputmode: "numeric", min: 0, max, step: 50, value: String(value) });
  }

  function dailyDouble(col, tile) {
    const who = P.control;
    const me = P.players[who];
    const max = Math.max(me.score, topValue());
    clear(root);
    const input = wagerInput("dd-wager", max, Math.min(max, tile.value));
    const err = h("p", { class: "small", style: { color: "var(--bad)" } });
    root.append(h("div", { class: "panel stack dd" },
      h("span", { class: "eyebrow" }, CATS[col.cat].label),
      h("h2", { class: "scorebig" }, "Daily Double"),
      h("p", {}, `${me.name} answers alone. Wager up to ${max} (your score, or the board's top value if that's more). Clues cut what you can win, not what you can lose.`),
      h("div", { class: "field" }, h("label", { for: "dd-wager" }, `${me.name}'s wager`), input), err,
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
        const w = Math.round(Number(input.value));
        if (!(w >= 5 && w <= max)) { err.textContent = `Wager between 5 and ${max}.`; return; }
        play(w);
      } }, "Lock in the wager"))));
    input.focus();

    function play(wager) {
      const item = tile.item;
      let clues = 0;
      clear(root);
      const valueEl = h("span", { class: "chip" }, `Daily Double · ${wager}`);
      const card = mysteryCard(item, valueEl);
      const clueBox = h("div", { class: "stack-sm" });
      const clueBtn = h("button", { class: "btn small", onclick: () => {
        if (clues >= (item.clues || []).length) return;
        clueBox.append(h("p", { class: "clue" }, h("b", {}, "Clue " + (clues + 1) + ": "), item.clues[clues]));
        clues++;
        zoomTo(card, item, clues);
        valueEl.textContent = `Daily Double · win ${Math.round(wager * CLUE_VALUE[clues])}, lose ${wager}`;
        if (clues >= (item.clues || []).length) clueBtn.disabled = true;
      } }, item.kind === "image" ? "Zoom out (clue)" : "Give a clue");
      const area = h("div", { class: "stack" });
      const guessIn = h("input", { class: "input", id: "dd-guess", autocomplete: "off", maxlength: 160, placeholder: "Your guess, in a few words" });
      root.append(card, h("div", { class: "row" }, clueBtn), clueBox, area);
      const reveal = (guess) => {
        clear(area);
        zoomTo(card, item, 99);
        area.append(revealCard(item));
        const rating = funRating(item, "party", { dd: true });
        judgePanel(area, {
          round: { id: item.id, prompt: item.prompt, kindLabel: kindLabel(item), ask: item.ask, truth: item.truth, more: item.more },
          item, players: [me.name], guesses: [guess], mode: "party", defaultJudge: guess ? P.cfg.judge : "room", threshold: RIGHT,
          pickLabel: `Did ${me.name} get it? (${RIGHT} or more counts)`,
          onAward: (winners) => {
            rating.flush();
            me.score += winners.length ? Math.round(wager * CLUE_VALUE[clues]) : -wager;
            tile.done = true;
            tile.by = winners.length ? [who] : [];
            board();
          },
        });
        area.append(rating);
      };
      if (P.cfg.entry === "typed") {
        area.append(h("div", { class: "field" }, h("label", { for: "dd-guess" }, `${me.name}: what is it?`), guessIn),
          h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => reveal(guessIn.value.trim()) }, "Reveal the answer")));
        guessIn.focus();
      } else {
        area.append(h("p", { class: "muted" }, `${me.name}, say your answer out loud.`),
          h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => reveal("") }, "Reveal the answer")));
      }
    }
  }

  function finalRound() {
    const item = P.final;
    const names = P.players.map((p) => p.name);
    const maxes = P.players.map((p) => Math.max(0, p.score));
    clear(root);
    root.append(h("span", { class: "eyebrow" }, "Trial B · Final mystery"), scoresBar(),
      h("div", { class: "panel stack" },
        h("h2", {}, "Final mystery: ", CATS[item.cat].label),
        h("p", {}, "Everyone wagers up to their score (nothing if it's zero or less), knowing only the category. Then everyone guesses. ",
          `${RIGHT} or more counts as right: win your wager; otherwise lose it.`)));
    const area = h("div", { class: "stack" });
    root.append(area);
    const afterWagers = (wagers) => {
      clear(area);
      const card = mysteryCard(item);
      area.append(card);
      const guessArea = h("div", { class: "stack" });
      area.append(guessArea);
      collect(guessArea, item, names, () => 0, (guesses) => {
        clear(guessArea);
        zoomTo(card, item, 99);
        guessArea.append(revealCard(item));
        judgePanel(guessArea, {
          round: { id: item.id, prompt: item.prompt, kindLabel: kindLabel(item), ask: item.ask, truth: item.truth, more: item.more },
          item, players: names, guesses, mode: "party", defaultJudge: P.cfg.entry === "typed" ? P.cfg.judge : "room", threshold: RIGHT,
          pickLabel: `Who got it? (${RIGHT} or more counts)`,
          onAward: (winners) => {
            if (wagers) applyWagers(wagers, winners);
            else paperWagers(winners);
          },
        });
      }, "Now everyone sees the mystery. Pass the device round so each player types a guess in private.");
    };
    const applyWagers = (wagers, winners) => {
      P.players.forEach((p, i) => { p.score += winners.includes(i) ? wagers[i] : -wagers[i]; });
      P.finalDone = true;
      end();
    };
    // Paper games: wagers were written down; type them in after the reveal.
    const paperWagers = (winners) => {
      clear(area);
      const inputs = P.players.map((p, i) => wagerInput("final-w-" + i, maxes[i], 0));
      area.append(h("div", { class: "panel stack" }, h("p", { class: "label" }, "Enter the wagers people wrote down"),
        P.players.map((p, i) => h("div", { class: "field" }, h("label", { for: "final-w-" + i }, `${p.name} (up to ${maxes[i]})${winners.includes(i) ? ": right" : ": wrong"}`), inputs[i])),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
          applyWagers(inputs.map((el, i) => Math.max(0, Math.min(maxes[i], Math.round(Number(el.value) || 0)))), winners);
        } }, "Settle up"))));
    };
    if (P.cfg.entry === "typed") {
      area.append(h("div", { class: "row" }, h("button", { class: "btn primary", onclick: async () => {
        const typed = await collectPrivately(area, names, {
          prompt: "your wager", placeholder: "A number",
          check: (text, i) => {
            const w = Number(text);
            return Number.isFinite(w) && w >= 0 && w <= maxes[i] ? "" : `Wager between 0 and ${maxes[i]}.`;
          },
        });

      } }, "Collect wagers")));
    } else {

  }

  function end(teamWinner) {

      const count = (i) => (P.cfg.style === "ttt" ? P.cells.filter((c) => c.mark === i).length : P.c4.grid.filter((m) => m === i).length);
      const line = P.cfg.style === "ttt" ? "three in a row" : "four in a row";
      headline = teamWinner != null ? `${P.players[teamWinner].name} got ${line}` : (() => {
        const x = count(0);

        return x === o ? "A draw" : `${P.players[x > o ? 0 : 1].name} took more squares`;
      })();
    } else {
      const top = Math.max(...P.players.map((p) => p.score));

      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => start(P.cfg, P.players.map((p) => p.name)) }, "Play again"),
        h("button", { class: "btn", onclick: setup }, "Change setup")),

}

/** Toggle chips with a limit. Returns {el, get()}; get() keeps the options' order. */
function chipPicker(options, initial, max) {
  const on = new Set(initial);
  const wrap = h("div", { class: "seg", role: "group" });
  const paint = () => wrap.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(on.has(options[i][0]))));
  for (const [value, label] of options) {
    wrap.append(h("button", { type: "button", onclick: () => {
      if (on.has(value)) on.delete(value);
      else if (on.size < max) on.add(value);
      else toast(`Up to ${max}`);
      paint();
    } }, label));
  }
  paint();
  return { el: wrap, get: () => options.map(([v]) => v).filter((v) => on.has(v)) };
}

  function lookup(gs) {

    const q = encodeURIComponent(item.prompt);
    const truth = h("textarea", { class: "input", id: "byo-truth", rows: 3, placeholder: "e.g. “A forum thread where pool players argue about bringing their own pool balls”" });
    const r2 = h("input", { class: "input", id: "byo-r2", placeholder: "Result 2 (optional)" });

          link("https://duckduckgo.com/?q=" + q, "DuckDuckGo"),
          link("https://www.bing.com/search?q=" + q, "Bing"),

        h("div", { class: "field" }, h("label", { for: "byo-truth" }, "What did you find? The top result, or what the site is, in a sentence"), truth),
        h("details", {}, h("summary", { class: "small" }, "Family Feud bonus: add results 2 and 3"),
          h("div", { class: "stack-sm", style: { marginTop: "8px" } }, r2, r3,
            h("p", { class: "small muted" }, "Guesses that match the top result score 3, the second 2, the third 1 (robot-judged)."))),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
          if (!truth.value.trim()) { toast("Describe what you found first"); return; }
          judge(gs, truth.value.trim(), [r2.value.trim(), r3.value.trim()].filter(Boolean));
        } }, "Judge the guesses"))));
  }

  function judge(gs, truthText, extra) {
    clear(root);
    const base = itemFor();
    const item = Object.assign(base, { truth: truthText, decoys: [], key: J.keysFromText(truthText) });
    const round = {
      prompt: item.prompt, kindLabel: item.kind === "domain" ? "a web address" : "a search phrase", ask: item.ask, truth: truthText,
      results: extra.length ? [truthText, ...extra] : null, custom: true, target: { keys: item.key, text: truthText },

    root.append(mysteryCard(item), revealCard(item));
    const area = h("div", { class: "stack" });
    root.append(area);
    const typed = gs.some((g) => g);
    if (typed && extra.length) area.append(feudPanel(gs, [truthText, ...extra]));
    const rating = funRating(item, "byo", { truth: truthText });
    judgePanel(area, {
      round, item, players: S.players, guesses: gs, mode: "byo", defaultJudge: typed ? "robot" : "room",
      onAward: (winners, funniest) => {
        rating.flush();
        winners.forEach((w) => { const n = S.players[w]; S.tally[n] = (S.tally[n] || 0) + 1; });
        if (funniest != null) { const n = S.players[funniest]; S.tally[n] = (S.tally[n] || 0) + 0.5; }
