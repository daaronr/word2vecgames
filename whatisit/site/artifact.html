<title>What Is It?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@600&family=Public+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: a quiet frame around one mystery at a time. Each mystery is drawn in its own habitat
   (an address bar, a licence plate, a patent front page, a shop sign, a search box); the frame
   around it stays plain so the habitat carries the look. */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --surface-2: #e8ebf0;
  --ink: #16181d;
  --muted: #586070;
  --line: #d4d9e1;
  --accent: #f2b200;
  --accent-ink: #231a00;
  --accent-soft: #fdf0c7;
  --focus: #2b59c3;
  --good: #1d8a57;
  --bad: #c0392b;
  --cold: #3d7be8;
  --cool: #63a3d8;
  --warm: #e9b300;
  --hot: #ec6a2a;
  --spot: #d4243c;
  /* habitats: physical things keep their real colours */
  --plate-bg: #fbfbf6;
  --plate-ink: #1c2a7c;
  --plate-red: #b0232b;
  --plate-edge: #9aa1ad;
  --paper: #fcfbf6;
  --paper-ink: #1f1f1f;
  --paper-rule: #8a8a8a;
  --bar-bg: #e3e6eb;
  --bar-field: #ffffff;
  --bar-ink: #202227;
  --sign-board: #1e3a34;
  --sign-ink: #f7f1df;
  --awning-a: #1e6b57;
  --awning-b: #f1ead6;
  --search-ring: #c9ced8;
  --newsprint: #f1ede1;
  --lens-rim: #2a2d33;
  --lens-handle: #5b3a22;
  --tv-frame: #15161a;
  --tv-sky: #2b4a8a;
  --tv-night: #0b1530;
  --tv-desk: #6b4a2b;
  --chyron-bg: #f4f4f2;
  --chyron-ink: #111216;
  --shadow: 0 1px 2px rgba(20, 24, 33, 0.06), 0 6px 18px rgba(20, 24, 33, 0.07);

  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --plate-face: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --serif: Georgia, "Times New Roman", Times, serif;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: 2.75rem;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115;
    --surface: #181b21;
    --surface-2: #232730;
    --ink: #eceef2;
    --muted: #a2a9b6;
    --line: #2f3440;
    --accent: #ffc21a;
    --accent-ink: #1e1600;
    --accent-soft: #3a3010;
    --focus: #8fb0ff;
    --good: #46c28a;
    --bad: #ff6b5e;
    --cold: #6ea3ff;
    --cool: #8cc0ea;
    --warm: #ffc21a;
    --hot: #ff8a4c;
    --spot: #ff5468;
    --plate-bg: #ecece4;
    --plate-ink: #1c2a7c;
    --plate-red: #b0232b;
    --plate-edge: #6d7480;
    --paper: #ecebe4;
    --paper-ink: #1f1f1f;
    --paper-rule: #7a7a7a;
    --bar-bg: #2a2e36;
    --bar-field: #14171c;
    --bar-ink: #e9ebef;
    --sign-board: #183029;
    --sign-ink: #f7f1df;
    --awning-a: #1e6b57;
    --awning-b: #d9d2bf;
    --search-ring: #3a404c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #181b21;
  --surface-2: #232730;
  --ink: #eceef2;
  --muted: #a2a9b6;
  --line: #2f3440;
  --accent: #ffc21a;
  --accent-ink: #1e1600;
  --accent-soft: #3a3010;
  --focus: #8fb0ff;
  --good: #46c28a;
  --bad: #ff6b5e;
  --cold: #6ea3ff;
  --cool: #8cc0ea;
  --warm: #ffc21a;
  --hot: #ff8a4c;
  --spot: #ff5468;
  --plate-bg: #ecece4;
  --plate-ink: #1c2a7c;
  --plate-red: #b0232b;
  --plate-edge: #6d7480;
  --paper: #ecebe4;
  --paper-ink: #1f1f1f;
  --paper-rule: #7a7a7a;
  --bar-bg: #2a2e36;
  --bar-field: #14171c;
  --bar-ink: #e9ebef;
  --sign-board: #183029;
  --sign-ink: #f7f1df;
  --awning-a: #1e6b57;
  --awning-b: #d9d2bf;
  --search-ring: #3a404c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--step-0) / 1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--focus); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 14px; }
.wordmark { white-space: nowrap; font-family: var(--display); font-size: clamp(1.15rem, 5vw, var(--step-2)); letter-spacing: 0.01em; line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.wordmark .q { color: var(--accent); -webkit-text-stroke: 1px var(--accent-ink); }
.topnav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.topnav button { background: none; border: 0; padding: 6px 10px; border-radius: 999px; color: var(--muted); cursor: pointer; font-size: var(--step--1); font-weight: 600; }
.topnav button:hover, .topnav button[aria-current="true"] { background: var(--surface-2); color: var(--ink); }

/* ---------- generic ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.eyebrow { font-size: var(--step--1); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 60ch; }
.tabular { font-variant-numeric: tabular-nums; }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.04); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: var(--step--1); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-weight: 700; font-size: var(--step--1); }
.input, textarea.input, select.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--focus); outline: none; }
.guessrow { display: flex; gap: 8px; }
.guessrow .input { flex: 1; font-size: var(--step-1); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 999px; font-weight: 600; cursor: pointer; font-size: var(--step--1); }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); font-size: var(--step--1); }
.chip b { font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px); text-align: center; }

/* ---------- hub ---------- */
.hero { display: grid; gap: 18px; padding-block: 8px 6px; }
.hero h1 { font-family: var(--display); font-size: clamp(2.1rem, 8vw, var(--step-4)); line-height: 0.98; letter-spacing: 0.005em; }
.hero h1 .q { color: var(--accent); -webkit-text-stroke: 1.5px var(--accent-ink); }
.trials { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.trial { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.trial .tag { font-family: var(--mono); font-size: var(--step--1); color: var(--muted); }
.trial h2 { font-size: var(--step-1); }
.trial p { color: var(--muted); }
.trial .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.meta { font-size: var(--step--1); color: var(--muted); }

/* ---------- mystery habitats ---------- */
.mystery { display: flex; flex-direction: column; gap: 12px; }
.mystery .ask { font-size: var(--step-1); font-weight: 700; }
.catline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.catline .num { font-family: var(--mono); color: var(--muted); font-size: var(--step--1); }

.bar { background: var(--bar-bg); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.bar .dots { display: flex; gap: 6px; margin: 0 0 8px 4px; }
.bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--plate-edge); opacity: 0.55; }
.bar .field { flex-direction: row; align-items: center; gap: 10px; background: var(--bar-field); color: var(--bar-ink); border-radius: 999px; padding: 10px 16px; }
.bar .url { font-family: var(--mono); font-size: clamp(1.15rem, 5vw, 1.7rem); font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.bar .url .proto { color: var(--muted); font-weight: 400; }
.bar svg { flex: none; width: 16px; height: 16px; color: var(--muted); }

.plate-wrap { display: flex; justify-content: center; }
.plate { position: relative; width: min(100%, 420px); aspect-ratio: 2 / 1; background: var(--plate-bg); border: 3px solid var(--plate-edge); border-radius: 16px; box-shadow: var(--shadow), inset 0 0 0 5px var(--plate-bg), inset 0 0 0 7px var(--plate-edge); display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 12px 18px 10px; }
.plate .state { font-family: var(--serif); font-style: italic; font-weight: 700; color: var(--plate-red); font-size: clamp(1rem, 4.5vw, 1.45rem); line-height: 1; letter-spacing: 0.01em; }
.plate .chars { align-self: center; font-family: var(--plate-face); font-weight: 600; color: var(--plate-ink); font-size: clamp(2.3rem, 13vw, 4.4rem); line-height: 1; letter-spacing: 0.06em; white-space: nowrap; }
.plate .foot { font-family: var(--ui); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--plate-ink); opacity: 0.75; }
.plate .bolt { position: absolute; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--plate-edge); opacity: 0.6; }
.plate .bolt.l { left: 22%; } .plate .bolt.r { right: 22%; }

.patent { background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 16px 18px 18px; box-shadow: var(--shadow); font-family: var(--serif); }
.patent .hd { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 3px double var(--paper-rule); padding-bottom: 8px; font-size: 0.95rem; }
.patent .hd b { font-size: 1.05rem; }
.patent .inid { font-size: 0.82rem; color: #444; margin-top: 10px; font-variant-numeric: tabular-nums; }
.patent .title { margin-top: 4px; font-size: clamp(1.15rem, 4.6vw, 1.55rem); line-height: 1.25; text-transform: uppercase; letter-spacing: 0.02em; }

.sign { box-shadow: var(--shadow); border-radius: 8px; overflow: hidden; }
.sign .awning { height: 28px; background: repeating-linear-gradient(90deg, var(--awning-a) 0 28px, var(--awning-b) 28px 56px); }
.sign .board { background: var(--sign-board); color: var(--sign-ink); padding: 22px 18px 24px; text-align: center; }
.sign .name { font-family: var(--display); font-size: clamp(1.7rem, 8vw, 2.9rem); line-height: 1.05; overflow-wrap: anywhere; }
.sign .est { margin-top: 8px; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.7; }

.searchbox { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1.5px solid var(--search-ring); border-radius: 999px; padding: 12px 18px; box-shadow: var(--shadow); }
.searchbox svg { flex: none; width: 20px; height: 20px; color: var(--muted); }
.searchbox .q { font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.searchbox .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); vertical-align: -0.15em; margin-left: 2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- warmth ---------- */
.warmth { display: grid; gap: 6px; }
.warmth .track { position: relative; height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--cold) 0%, var(--cool) 25%, var(--warm) 50%, var(--hot) 72%, var(--spot) 100%); }
.warmth .pin { position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); transform: translate(-50%, -50%); transition: left 0.5s ease; }
.warmth .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.warmth .word { font-family: var(--display); font-size: var(--step-1); }
.warmth .num { font-family: var(--mono); font-weight: 600; }
.guesslog { display: grid; gap: 8px; }
.guesslog .g { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.guesslog .g .t { font-weight: 600; overflow-wrap: anywhere; }
.guesslog .g .s { font-family: var(--mono); font-weight: 700; }
.guesslog .g .why { grid-column: 1 / -1; }
.lv1 { color: var(--cold); } .lv2 { color: var(--cool); } .lv3 { color: var(--warm); } .lv4 { color: var(--hot); } .lv5 { color: var(--spot); }

.clue { border-left: 4px solid var(--accent); padding: 6px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.choice:hover { border-color: var(--muted); }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }

/* ---------- reveal ---------- */
.reveal { border: 2px solid var(--ink); border-radius: var(--radius); padding: 18px; background: var(--surface); display: grid; gap: 10px; animation: rise 0.35s ease both; }
@keyframes rise { from { transform: translateY(6px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.reveal .truth { font-size: var(--step-2); font-weight: 800; line-height: 1.2; text-wrap: pretty; }
.reveal .more { color: var(--muted); }
.results { display: grid; gap: 6px; }
.results .r { padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.results .r .d { font-family: var(--mono); font-size: var(--step--1); color: var(--good); }
.stamp { justify-self: start; font-family: var(--display); font-size: 1.05rem; letter-spacing: 0.06em; padding: 4px 12px; border: 3px solid currentColor; border-radius: 6px; transform: rotate(-4deg); }
.stamp.ok { color: var(--good); } .stamp.no { color: var(--bad); }
.trapnote { font-weight: 600; color: var(--hot); }

.stars { display: inline-flex; gap: 2px; }
.stars button { background: none; border: 0; font-size: 1.7rem; line-height: 1; padding: 4px; cursor: pointer; color: var(--line); }
.stars button[aria-pressed="true"] { color: var(--accent); }
.stars button:hover { transform: scale(1.08); }
.rate { display: grid; gap: 8px; padding: 14px; border-radius: var(--radius); background: var(--surface-2); }

/* ---------- daily ---------- */
.pips { display: flex; gap: 6px; }
.pips i { width: 30px; height: 8px; border-radius: 999px; background: var(--line); }
.pips i.done { background: var(--ink); } .pips i.now { background: var(--accent); }
.scorebig { font-family: var(--display); font-size: var(--step-3); }
.grid-emoji { font-size: 1.6rem; letter-spacing: 0.1em; }

/* ---------- party board ---------- */
.board { display: grid; gap: 6px; }
.board.points { grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); }
.board.ttt { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 460px; margin: 0 auto; width: 100%; }
.board .head { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; padding: 6px 2px; color: var(--muted); line-height: 1.2; display: flex; align-items: end; justify-content: center; min-height: 3.2em; }
.tile { aspect-ratio: 4 / 3; border-radius: 10px; border: 0; background: var(--sign-board); color: var(--accent); font-family: var(--display); font-size: clamp(1rem, 4.4vw, 1.6rem); cursor: pointer; display: grid; place-items: center; padding: 4px; text-align: center; }
.board.ttt .tile { aspect-ratio: 1; font-family: var(--ui); font-weight: 800; font-size: clamp(0.8rem, 3.4vw, 1rem); color: var(--sign-ink); line-height: 1.15; }
.tile:hover:not([disabled]) { filter: brightness(1.2); }
.tile[disabled] { cursor: default; background: var(--surface-2); color: var(--muted); }
.tile .mark { font-family: var(--display); font-size: clamp(2rem, 12vw, 3.6rem); line-height: 1; }
.tile.x { background: color-mix(in srgb, var(--spot) 18%, var(--surface)); color: var(--spot); }
.tile.o { background: color-mix(in srgb, var(--cold) 18%, var(--surface)); color: var(--cold); }
.scores { display: flex; gap: 8px; flex-wrap: wrap; }
.scores .sc { flex: 1 1 120px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.scores .sc b { display: block; font-family: var(--display); font-size: var(--step-2); }
.scores .sc.lead { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick button { padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.pick button[aria-pressed="true"] { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.timer { font-family: var(--mono); font-weight: 700; font-size: var(--step-2); }
.passcard { text-align: center; padding: 28px 18px; display: grid; gap: 14px; justify-items: center; }
.passcard .who { font-family: var(--display); font-size: var(--step-3); }

/* ---------- bluff ---------- */
.votes { display: grid; gap: 8px; }
.vote { padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.vote.truth { border-color: var(--good); }
.vote .by { font-size: var(--step--1); color: var(--muted); margin-top: 4px; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 16, 0.55); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { width: min(100%, 640px); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 14px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.code { font-family: var(--mono); font-size: 0.8rem; white-space: pre-wrap; background: var(--surface-2); padding: 10px; border-radius: 8px; max-height: 220px; overflow: auto; }

details.how { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
details.how summary { cursor: pointer; font-weight: 700; }
details.how[open] summary { margin-bottom: 8px; }
.prose { display: grid; gap: 10px; max-width: 65ch; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

/* ---------- more habitats ---------- */
.lens-wrap { position: relative; width: min(calc(100% - 64px), 300px); aspect-ratio: 1; margin: 6px auto 46px; }
.lens { width: 100%; height: 100%; border-radius: 50%; background-color: var(--paper); background-repeat: no-repeat; border: 12px solid var(--lens-rim); box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.14), var(--shadow); transition: background-size 0.6s ease, background-position 0.6s ease; position: relative; }
.lens::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 38%); pointer-events: none; }
.lens-wrap .handle { position: absolute; left: calc(85.4% - 12px); top: 85.4%; width: 24px; height: 72px; border-radius: 10px; background: var(--lens-handle); transform: rotate(-45deg); transform-origin: top center; box-shadow: var(--shadow); }
.reveal-img { width: 132px; height: 132px; justify-self: start; }
.reveal .cite { font-size: var(--step--1); color: var(--muted); margin: 0; }

.paper { background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 14px 20px 18px; box-shadow: var(--shadow); font-family: var(--serif); display: grid; gap: 10px; }
.paper .jhd { display: flex; justify-content: space-between; gap: 12px; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--paper-rule); padding-bottom: 6px; }
.paper .ptitle { font-size: clamp(1.3rem, 4.6vw, 1.8rem); font-weight: 700; line-height: 1.2; text-align: center; text-wrap: balance; }
.paper .ptitle .rest { color: var(--paper-rule); font-weight: 400; }
.paper .authors { text-align: center; font-style: italic; font-size: 0.9rem; }
.redact { background: var(--paper-ink); color: transparent; border-radius: 2px; user-select: none; }
.paper .lines, .news .cols { display: grid; gap: 6px; }
.paper .lines i, .news .cols i { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--paper-rule) 35%, transparent); }
.paper .lines i:last-child { width: 55%; }

.lyric { background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 16px 20px 20px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.lyric .staff { height: 33px; background: repeating-linear-gradient(to bottom, var(--paper-rule) 0 1px, transparent 1px 8px); opacity: 0.55; }
.lyric .line { font-family: var(--serif); font-style: italic; font-size: clamp(1.25rem, 4.6vw, 1.65rem); line-height: 1.35; margin: 0; text-align: center; text-wrap: balance; }

.tv { background: var(--tv-frame); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); }
.tv .screen { position: relative; aspect-ratio: 16 / 8; min-height: 150px; border-radius: 8px; overflow: hidden; background: radial-gradient(ellipse at 50% 25%, var(--tv-sky), var(--tv-night) 72%); }
.tv .desk { position: absolute; left: 12%; right: 12%; bottom: 30%; height: 16%; border-radius: 6px 6px 0 0; background: var(--tv-desk); }
.tv .chyron { position: absolute; left: 0; right: 0; bottom: 7%; display: flex; background: var(--chyron-bg); color: var(--chyron-ink); }
.tv .chyron .tag { flex: none; display: flex; align-items: center; padding: 6px 10px; background: var(--spot); color: #fff; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.tv .chyron .story { padding: 7px 12px; font-weight: 800; font-size: clamp(0.9rem, 3.6vw, 1.15rem); line-height: 1.25; }

.news { background: var(--newsprint); color: var(--paper-ink); border-radius: 2px; padding: 12px 18px 18px; box-shadow: var(--shadow); font-family: var(--serif); display: grid; gap: 8px; }
.news .mast { text-align: center; font-weight: 900; font-size: clamp(1.05rem, 4vw, 1.35rem); letter-spacing: 0.04em; border-bottom: 3px double var(--paper-ink); padding-bottom: 4px; }
.news .dateline { display: flex; justify-content: space-between; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid var(--paper-rule); padding-bottom: 4px; }
.news .head { font-size: clamp(1.45rem, 5.6vw, 2.15rem); font-weight: 900; line-height: 1.08; text-align: center; text-wrap: balance; }
.news .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; }

/* ---------- party extras ---------- */
.tile.locked[disabled] { background: color-mix(in srgb, var(--sign-board) 35%, var(--surface-2)); color: color-mix(in srgb, var(--sign-ink) 55%, transparent); cursor: not-allowed; }
.scores .sc.control { box-shadow: inset 0 0 0 2px var(--ink); }
.scores .sc.team-x b { color: var(--spot); }
.scores .sc.team-o b { color: var(--cold); }
.pick.off button[aria-pressed="true"] { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.dd { border: 2px solid var(--accent); background: var(--accent-soft); }
.board.c4 { grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); max-width: 520px; width: 100%; margin: 0 auto; padding: 8px; border-radius: 14px; background: var(--sign-board); }
.board.c4 .drop { min-height: 42px; padding: 4px 2px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: clamp(0.6rem, 2.6vw, 0.8rem); line-height: 1.1; cursor: pointer; overflow-wrap: anywhere; }
.board.c4 .drop[disabled] { opacity: 0.35; cursor: default; }
.board.c4 .slot { aspect-ratio: 1; border-radius: 50%; background: var(--bg); box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35); }
.board.c4 .slot.x { background: var(--spot); }
.board.c4 .slot.o { background: var(--cold); }

@media (max-width: 520px) {
  .topnav button { padding: 5px 6px; font-size: 0.75rem; }
  .wordmark { font-size: 1.05rem; }
  .topbar { gap: 6px; }
  .board.points .head { font-size: 0.6rem; }
  .panel { padding: 14px; }
  .reveal .truth { font-size: var(--step-1); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

0,"h":"Off track."}],"rating":"G","fun":4,"difficulty":1,"url":"https://www.goodreads.com/work/quotes/733744","source":"Goodreads entry for 'Squad Helps Dog Bite Victim, and Other Flubs from the Nation's Press'; search results describing CJR's two 1980s anthologies of ambiguous headlines","checked":"2026-10-06"},{"id":"headline-red-tape-bridge","cat":"headline","kind":"headline","prompt":"Red Tape Holds Up New Bridge","where":"Title of Columbia Journalism Review's second collection, 'Red Tape Holds Up New Bridge' (1987)","ask":"What was the story actually about?","truth":"Bureaucratic paperwork and permits are delaying construction of a new bridge.","more":"Read literally, strips of red tape are all that keep the bridge standing. It named CJR's 1987 follow-up book of newspaper flubs, and the same five words ran again in 2022 over a story in McKenzie River Reflections, a weekly paper in Oregon.","key":["bureaucracy","delay","bridge","paperwork","permits"],"clues":["It's a story about a construction project.","The color is a figure of speech.","Forms, approvals and officials are slowing everything down."],"decoys":["A new bridge has been closed to traffic because inspectors found cracks in its support cables.","The opening of a new bridge was postponed so the mayor could cut a ribbon at a formal ceremony.","Protesters tied red ribbons along a new bridge to oppose plans for a toll on drivers."],"graded":[{"g":"bureaucracy is delaying the new bridge","s":95,"h":"Spot on."},{"g":"paperwork holdup on bridge construction","s":95,"h":"Spot on."},{"g":"waiting on permits to build a bridge","s":90,"h":"Spot on."},{"g":"new bridge delayed","s":75,"h":"Right outcome; what's causing it?"},{"g":"government problems with a bridge","s":55,"h":"Right area; be more specific."},{"g":"ribbon cutting at the bridge opening","s":20,"h":"Tempting, but there's no opening yet."},{"g":"bridge closed for repairs","s":20,"h":"Wrong cause."},{"g":"a bridge held together with tape","s":5,"h":"That's the misreading."},{"g":"a bridge painted red","s":3,"h":"Off track: the color is a metaphor."}],"rating":"G","fun":3,"difficulty":1,"url":"https://mckenzieriverreflectionsnewspaper.com/story/2022/03/31/news/red-tape-holds-up-new-bridge/4474.html","source":"Search results describing CJR's two 1980s anthologies ('Squad Helps Dog Bite Victim' and 'Red Tape Holds Up New Bridge'); McKenzie River Reflections story of March 31, 2022 under the same headline","checked":"2026-10-06"},{"id":"headline-british-left-waffles","cat":"headline","kind":"headline","prompt":"British Left Waffles on Falklands","where":"Said to date from the 1982 Falklands War; no paper or date has been traced","ask":"What was the story actually about?","truth":"Britain's political left was wavering, unable to decide whether to back the 1982 war with Argentina over the Falkland Islands.","more":"Read another way, British troops left breakfast waffles on the islands. It is one of the most quoted ambiguous headlines, yet the accounts found give no paper or date (one reader's letter to A.Word.A.Day recalls it from 'a now-forgotten American newspaper'), so it may well be apocryphal.","key":["wavering","left","indecisive","war","islands"],"clues":["It's political news from 1982.","The first two words are one group: a side of politics.","To waffle is to talk around a question without settling on an answer."],"decoys":["Britain's Labour Party demanded an immediate ceasefire and peace talks over the Falkland Islands.","British troops left behind tons of unused rations when they pulled out of the Falkland Islands.","Left-wing British newspapers refused to print government statements about the Falklands fighting."],"graded":[{"g":"the british left couldn't make up its mind about the war","s":95,"h":"Spot on."},{"g":"labour party indecisive on the falklands","s":95,"h":"Spot on."},{"g":"left-wingers keep changing their position","s":85,"h":"Spot on."},{"g":"labour opposes the falklands war","s":55,"h":"Right group, but they weren't that firm."},{"g":"british politics over the falklands","s":50,"h":"Right area; which side, doing what?"},{"g":"argentina invades the falklands","s":25,"h":"Right war; who is the headline about?"},{"g":"britain left the falklands","s":15,"h":"Read 'left' another way."},{"g":"british soldiers left waffles behind","s":5,"h":"That's the misreading."},{"g":"a breakfast shortage on the islands","s":2,"h":"Off track: it's politics."}],"rating":"G","fun":5,"difficulty":2,"url":"https://wordsmith.org/awad/awadmail1023.html","source":"A.Word.A.Day, AWADmail issue 1023 (reader Paul Kleyman's recollection; checked via search results). No primary printing found.","checked":"2026-10-06"},{"id":"headline-kids-snacks","cat":"headline","kind":"headline","prompt":"Kids Make Nutritious Snacks","where":"Classic of grammar textbooks and headline-blooper lists; no paper or date attached","ask":"What was the story actually about?","truth":"Children prepared healthy snacks, for example in a cooking class. 'Make' means cook or put together.","more":"Read the other way, children are good to eat. It turns up in grammar exercises and lists of ambiguous headlines, but the lists found don't name the paper that printed it.","key":["children","snacks","healthy","cooking"],"clues":["It's the kind of item a school newsletter might run.","The young people are the ones doing something.","Picture an after-school class, aprons on, fruit and yogurt on the counter."],"decoys":["A survey found that children now eat more snacks than full meals during the school day.","A school replaced the candy in its vending machines with fruit after a campaign by parents.","Doctors say growing children need snacks between meals to keep up their energy at school."],"graded":[{"g":"children cooking healthy snacks","s":95,"h":"Spot on."},{"g":"kids prepare healthy food in class","s":92,"h":"Spot on."},{"g":"a cooking class for kids","s":80,"h":"Close; what did they turn out?"},{"g":"healthy snacks for ory actually about?","truth":"People who drink milk are switching to powdered milk.","more":"Read the other way, milk drinkers are crumbling into dust. It is quoted on blooper lists without a paper or date, and no original printing turned up in our searches.","key":["powdered","milk","switching","drinkers"],"clues":["It's a story about shopping habits.","'Turning to' here means 'taking up'.","Add water and stir."],"decoys":["Milk drinkers are switching from dairy milk to oat and almond drinks.","Doctors warn that heavy milk drinkers may still get brittle bones in old age.","Dairy farmers are drying unsold milk into powder because demand has fallen."],"graded":[{"g":"people switching to powdered milk","s":98,"h":"Spot on."},{"g":"milk drinkers buy dried milk now","s":95,"h":"Spot on."},{"g":"more people buying milk powder","s":85,"h":"Spot on."},{"g":"milk drinkers change what they buy","s":55,"h":"Right idea; switching to what?"},{"g":"people switching to oat milk","s":30,"h":"Right kind of change, wrong product."},{"g":"milk gives you weak bones","s":10,"h":"Off track: it's about shopping."},{"g":"milk drinkers crumble into dust","s":5,"h":"That's the misreading."},{"g":"people turning into ghosts","s":2,"h":"Off track."}],"rating":"G","fun":4,"difficulty":1,"url":"https://www.cs.toronto.edu/~krueger/csc165h/lectures/headlines.html","source":"Known from lists of ambiguous headlines; no documentation found in searches (this headline not confirmed on the linked page)","checked":"2026-10-06","status":"unverified"},{"id":"headline-grandmother-hole-in-one","cat":"headline","kind":"headline","prompt":"Grandmother of Eight Makes Hole in One","where":"Quoted on headline-blooper lists; no paper or date attached","ask":"What was the story actually about?","truth":"A woman with eight grandchildren hit a hole in one at golf: her tee shot went straight into the cup.","more":"Read the other way, she put a hole in one of her eight grandchildren. It is quoted on blooper lists without a paper or date, and no original printing turned up in our searches.","key":["golf","grandmother","ace","shot"],"clues":["It's a small local sports item.","The number just describes her family.","One swing from the tee, and the ball dropped straight into the cup."],"decoys":["A grandmother of eight won her bowling league by rolling a perfect game of 300.","A grandmother of eight dug the first hole at the groundbreaking for a new community garden.","A grandmother of eight sank the winning basket in a charity basketball match."],"graded":[{"g":"grandma got a hole in one at golf","s":98,"h":"Spot on."},{"g":"she aced a golf hole","s":95,"h":"Spot on."},{"g":"a grandmother hit a great golf shot","s":80,"h":"Close; how great?"},{"g":"older woman wins a golf tournament","s":55,"h":"Right sport; the story is one stroke."},{"g":"grandmother wins at bowling","s":25,"h":"Right kind of feat, wrong sport."},{"g":"grandma digs a hole in her garden","s":10,"h":"Off track: it's sport."},{"g":"grandma pokes a hole in a grandchild","s":5,"h":"That's the misreading."},{"g":"grandmother knits a sweater","s":2,"h":"Off track."}],"rating":"PG","fun":4,"difficulty":1,"url":"https://www.cs.toronto.edu/~krueger/csc165h/lectures/headlines.html","source":"Known from lists of ambiguous headlines; no documentation found in searches (this headline not confirmed on the linked page)","checked":"2026-10-06","status":"unverified"},{"id":"headline-dropouts-halved","cat":"headline","kind":"headline","prompt":"Local High School Dropouts Cut in Half","where":"Quoted on headline-blooper lists; no paper or date attached","ask":"What was the story actually about?","truth":"The number of students dropping out of the local high school has fallen by half.","more":"Read the other way, a stage magician has been busy at the school. It is quoted on blooper lists without a paper or date, and no original printing turned up in our searches.","key":["dropouts","halved","students","decline","school"],"clues":["It ge cross-country flight with a layover.","Weather reports: hosts cast it as a rogue forecaster, filing detailed reports on every backyard barbecue it floated over."],"graded":[{"g":"a balloon is too silly to be scary","s":95,"h":"Spot on."},{"g":"it's like a birthday party balloon","s":92,"h":"Spot on."},{"g":"get well soon balloon from china","s":90,"h":"Spot on."},{"g":"shooting it down was a gender reveal","s":85,"h":"Spot on: that was one host's line."},{"g":"the balloon had feelings and was sad","s":45,"h":"Warm: one sketch did that. Bigger picture?"},{"g":"why spy with a balloon when they have tiktok","s":40,"h":"Different gag: think about how it looks."},{"g":"they made fun of china spying on us","s":30,"h":"Right subject, but what was the gag?"},{"g":"a balloon got shot down over the us","s":15,"h":"That's just the news. Where's the gag?"},{"g":"it was really aliens","s":10,"h":"Wrong kind of mystery."},{"g":"a hot dog eating contest","s":0,"h":"Off the mark."}],"url":"https://www.thewrap.com/seth-meyers-chinese-spy-balloon-joke-clip","source":"TheWrap on Seth Meyers' balloon segment (Feb. 6, 2023); NPR, 'Hours after its demise, the Chinese spy balloon was the star of the SNL cold open' (Feb. 5, 2023, mprnews.org copy), with Bowen Yang as the balloon and Colin Jost's gender reveal joke.","checked":"2026-10-06","fun":4,"difficulty":2,"rating":"G"},{"id":"latenight-pokemon-go","cat":"latenight","kind":"news","prompt":"The phone game Pokémon Go comes out (July 2016)","ask":"What's the deal with it? What joke did the late-night hosts make?","when":"July 2016","hosts":["The Late Show with Stephen Colbert","The Tonight Show Starring Jimmy Fallon"],"truth":"Players so hooked on chasing invisible monsters on their phones that they wander anywhere with eyes on the screen, even onto a TV set in the middle of a serious speech.","more":"Stephen Colbert opened The Late Show with a sincere message about a divided country and was interrupted by players wandering onto his s ah-jimmy-kimmel-seth-meyers-mock-trumps-lincoln-complex-fret-murder-hornets","source":"The Week, 'Stephen Colbert, Trevor Noah, Jimmy Kimmel, Seth Meyers ... fret murder hornets' (May 2020), quoting Colbert and Kimmel; TODAY, 'What are murder hornets and why won't people stop talking about them?'.","checked":"2026-10-06","fun":3,"difficulty":1,"rating":"G"},{"id":"latenight-cicada-plane","cat":"latenight","kind":"news","prompt":"Cicadas get into the engines of the plane carrying White House reporters to Europe (June 2021)","ask":"What's the deal with it? What joke did the late-night hosts make?","when":"June 2021","hosts":["The Late Show with Stephen Colbert","The Tonight Show Starring Jimmy Fallon","Jimmy Kimmel Live!"],"truth":"The bugs had it in for the president: hosts treated the swarm as an enemy attack on Joe Biden's trip, with a pilot who turned out to be a cicada and a call for a SWAT team.","more":"Stephen Colbert said the plane was delayed again when it turned out the pilot was also a cicada, and that Biden needed a swat team more than the Secret Service; that week Biden had brushed a cicada off his neck before boarding Air Force One. The Week rounded up cicada jokes from Colbert, Jimmy Fallon and Jimmy Kimmel.","key":["attack","enemy","president","swat","pilot"],"clues":["The hosts gave the insects a motive.","In the jokes, the swarm had it in for one particular traveler and his entourage.","Forget the Secret Service, one host said: this man needs a team trained to swat."],"decoys":["Snack food: hosts dared the press corps to eat the bugs, since chefs that summer were already frying cicadas for dinner.","Noise: hosts said the cicadas were so loud that the reporters on board finally knew how it felt to be shouted at.","Passports: hosts said the bugs only wanted a trip to Europe and had tried to skip the line at border control."],"graded":[{"g":"the cicadas were out to get biden","s":95,"h":"Spot on."},{"g":"bugs attacking the president, he needs a swat te eth Meyers"],"truth":"The whole country split into two camps over the color of one dress, each sure the other side was wrong: friendships and marriages supposedly ended over blue-and-black versus white-and-gold.","more":"Jimmy Kimmel said the dress split pretty evenly between people who see it as gold and white and people who are wrong. Jimmy Fallon opened by saying he'd just lost all his friends over the color of a dress. The dress was in fact blue and black; people who assumed it sat in shadow saw it as white and gold.","key":["argue","color","dress","wrong","friends"],"clues":["The jokes were about people, not about fashion.","Hosts treated it like a feud that could end friendships.","Two camps, two color schemes, and each one certain the other was blind."],"decoys":["The price: hosts were stunned that a dress everyone was talking about cost less than a dinner out, and tried to buy one live.","Fashion police: hosts mocked the dress as so ugly that nobody could agree what it even was, and held a makeover.","Optical illusions: hosts ran a week of eye tests and claimed half their audience needed glasses."],"graded":[{"g":"everyone fighting over what color it was","s":95,"h":"Spot on."},{"g":"people losing friends over a dress color","s":95,"h":"Spot on."},{"g":"half the country is wrong","s":88,"h":"Spot on: and which half?"},{"g":"blue and black or white and gold","s":70,"h":"Hot: and how did people react?"},{"g":"nobody could agree on the color","s":80,"h":"Hot: what did that do to people?"},{"g":"an optical illusion","s":35,"h":"That's the science, not the gag."},{"g":"the dress was ugly","s":15,"h":"Different gag."},{"g":"a fashion disaster on the red carpet","s":5,"h":"Wrong kind of dress story."},{"g":"a wedding dress mixup","s":10,"h":"Not a wedding."},{"g":"a cooking show","s":0,"h":"Off the mark."}],"url":"https://www.mediaite.com/media/tv/must-see-late-night-clips-kimmel-meyers-get-in-on-the-dress-color-debate","source":"Mediaite, 'Must-See Late Night Clips: Kimmel, Meyers Get in on the Dress Color Debate' (2015); Fallon's monologue line: NBC Bay Area, 'Jimmy Fallon Asks: What's The True Color of #TheDress?' (2015); Today.com, 'The Dress is 10 years old' (2025).","checked":"2026-10-06","fun":4,"difficulty":1,"rating":"G"},{"id":"latenight-louvre-heist","cat":"latenight","kind":"news","prompt":"Thieves take crown jewels from the Louvre in Paris (October 2025)","ask":"What's the deal with it? What joke did the late-night hosts make?","when":"October 2025","hosts":["The Tonight Show Starring Jimmy Fallon"],"truth":"It looked too easy to be real: thieves pulled up a furniture lift like a moving crew and were gone in about seven minutes, so hosts played it as a heist movie and went looking for a movie-star culprit.","more":"On Oct. 19 four thieves used a furniture-lift truck to reach a window of the Galerie d'Apollon and left with eight pieces of France's crown jewels. On The Tonight Show, Jesse Eisenberg, star of the magician-heist Now You See Me films, handed Jimmy Fallon a gift and kept pulling a crown and jewelry out of his bag.","key":["easy","movers","movie","security","lift"],"clues":["The hosts sounded more impressed than outraged.","The crooks' main tool looked like something a company uses to deliver sofas.","Seven minutes, broad daylight, a ladder truck: it played like a film, and one host had a suspect from the cast."],"decoys":["The Mona Lisa: hosts said the thieves skipped her because, like every tourist, they found her smaller than expected.","Tourist crowds: hosts said the thieves were the first visitors in years to get near anything through the selfie sticks.","French pride: hosts said Paris was more upset about a new chain coffee shop near the museum than about the jewels."],"graded":[{"g":"it was way too easy, like hiring movers","s":92,"h":"Spot on."},{"g":"the security was a joke","s":85,"h":"Spot on."},{"g":"like a real life heist movie","s":85,"h":"Spot on."},{"g":"they used a furniture lift in broad daylight","s":80,"h":"Hot: what did that say about it?"},{"g":"a celebrity did it","s":50,"h":"Warm: one host had a suspect."},{"g":"they made fun of france","s":25,"h":"Right place, but what was the gag?"},{"g":"the mona lisa was jealous","s":20,"h":"Different gag."},{"g":"jewels stolen from a museum","s":15,"h":"That's just the news. Where's the gag?"},{"g":"a cooking show","s":0,"h":"Off the mark."}],"url":"https://www.realitytea.com/2025/10/30/jimmy-fallon-thinks-jesse-eisenberg-did-louvre-heist/","source":"Confirmed: Jesse Eisenberg's crown-in-the-bag bit on The Tonight Show (realitytea.com, Oct. 30, 2025). Not yet confirmed: other shows' bits, and that 'too easy, like a heist movie' was the shared angle.","checked":"2026-10-06","fun":4,"difficulty":2,"rating":"G","status":"unverified"},{"id":"lyric-yankee-doodle-macaroni","cat":"lyric","kind":"lyric","prompt":"Stuck a feather in his cap and called it macaroni","song":"Yankee Doodle","year":"1770s","pd":true,"ask":"What does this line mean in the song?","truth":"Macaroni was 1700s slang for a showy, over-fashionable dandy: the joke is that a country bumpkin thinks one feather in his hat makes him the height of style.","more":"Young British men back from the Grand Tour of Europe in the 1760s wore towering powdered wigs and tight, bright clothes and were nicknamed macaronis. British soldiers sang the song to mock colonial Americans as hicks; the Americans later took it up as their own.","key":["dandy","fashionable","stylish","feather","mock"],"clues":["British soldiers sang this song to tease American colonists.","In 1770s London, the word was slang for a certain kind of young man.","Think powdered wigs, tight bright coats and giant shoe buckles."],"decoys":["Macaroni is the name he gives his pony after riding into town: the joke is a farm boy naming his horse after a foreign food.","Macaroni was army slang for an officer's plume, so the line mocks a raw recruit who promotes himself with a feather.","Pasta was a rare imported luxury, so the line mocks a poor farmer who pretends a cheap feather is worth a costly treat."],"url":"https://en.wikipedia.org/wiki/Yankee_Doodle","source":"https://www.atlasobscura.com/articles/the-macaroni-in-yankee-doodle-is-not-what-you-think","checked":"2026-10-06","fun":4,"difficulty":2,"rating":"G","graded":[{"g":"macaroni meant a fancy dandy","s":95,"h":"Spot on."},{"g":"slang for a guy who's way too into fashion","s":95,"h":"Spot on."},{"g":"he thinks a feather makes him stylish","s":85,"h":"Yes; the last word carries that meaning."},{"g":"a fancy hat style","s":55,"h":"Close: think about the person wearing it."},{"g":"making fun of americans as hicks","s":50,"h":"Right target; what does the word mean?"},{"g":"italian slang for something","s":30,"h":"Slang, yes; whose slang, and for what?"},{"g":"a type of feather","s":15,"h":"The feather is only the prop."},{"g":"the name of his pony","s":10,"h":"Tempting, but the pony has no name."},{"g":"pasta","s":5,"h":"Too literal."},{"g":"a secret spy password","s":3,"h":"Off the wall."}]},{"id":"lyric-pop-goes-the-weasel-eagle","cat":"lyric","kind":"lyric","prompt":"Up and down the City Road, in and out the Eagle","song":"Pop Goes the Weasel","year":"1850s","pd":true,"ask":"What does this line mean in the song?","truth":"The Eagle was a well-known pub and music hall on London's City Road: the singer keeps going in and out of it, and that's where his money goes.","more":"'Pop' was slang for pawn, so a popular story says he pawned his 'weasel' (a tailor's iron, or a coat in rhyming slang) for drink money, but nobody has shown what the weasel was, and that rhyming slang isn't recorded until the 1930s. A newer Eagle pub, opened in 1901 near the old site, has the rhyme painted on its front.","key":["pub","tavern","drinking","spending","money"],"clues":["It's a London verse of Pop Goes the Weasel, sung by 1856.","The next line is: that's the way the money goes.","This Eagle never flew: it poured pints and rds","coal","dark"],"clues":["The song was first printed in a London children's book in 1780.","The 1780 text uses a different word that sounds a little like 'calling'.","Twenty-four of the same bird went into a nursery-rhyme pie."],"decoys":["They are canaries: caged songbirds were a costly gift in the 1700s, prized because their calls filled the house.","They are carrier pigeons: the true love sends them so the singer can call back with messages of her own.","They are parrots: in the earliest version they are 'talking birds', taught to call out the lover's name."],"url":"https://en.wikipedia.org/wiki/The_Twelve_Days_of_Christmas_(song)","source":"https://unireadinghistory.com/2019/12/16/twelve-days-of-christmas-four-calling-birds/","checked":"2026-10-06","fun":4,"difficulty":2,"rating":"G","graded":[{"g":"blackbirds","s":95,"h":"Spot on."},{"g":"originally colly birds meaning black birds","s":100,"h":"Spot on."},{"g":"colly birds","s":75,"h":"Right word; what kind of bird?"},{"g":"crows or ravens","s":55,"h":"Right color, wrong bird."},{"g":"a misheard older word","s":45,"h":"Right idea; which word, which bird?"},{"g":"songbirds that sing to you","s":15,"h":"Too literal."},{"g":"parrots that can talk","s":10,"h":"Tempting, but nobody's talking."},{"g":"carrier pigeons","s":10,"h":"No messages here."},{"g":"a secret code for the four gospels","s":5,"h":"Think simpler: just a bird."},{"g":"phone calls","s":0,"h":"Off the wall."}]},{"id":"lyric-god-rest-ye-merry","cat":"lyric","kind":"lyric","prompt":"God rest ye merry, gentlemen, let nothing you dismay","song":"God Rest Ye Merry, Gentlemen","year":"1700s","pd":true,"ask":"What does this line mean in the song?","truth":"'God keep you merry, gentlemen': 'rest' here meant keep or make, so it wishes the listeners peace and happiness, and the comma belongs after 'merry'.","more":"Shakespeare uses 'rest you merry' as a friendly greeting in Romeo and Juliet in the 1590s. That sense of 'rest' survives today only in 'rest assured', so most people now hear a blessing on some merry gentlemen.","key":["keep","happy","merry","blessing","wish"],"clues":["It's one of the oldest carols still sung at Christmas.","Shakespeare's characters use a version of the phrase as a greeting.","The verb works the way it does in 'rest assured'."],"decoys":["It asks God to give eternal rest to cheerful men who have died, like a prayer said over a grave at Christmas.","It tells tipsy partygoers to go and sleep off their Christmas drinking so that nothing troubles them in the morning.","It greets the 'merry gentlemen', a band of carol singers, and wishes them a peaceful night after their rounds."],"url":"https://en.wikipedia.org/wiki/God_Rest_Ye_Merry,_Gentlemen","source":"https://www.phrases.org.uk/meanings/god-rest-you-merry-gentlemen.html; https://wordorigins.org/big-list-entries/merry-god-rest-you-merry","checked":"2026-10-06","fun":4,"difficulty":2,"rating":"G","graded":[{"g":"may god keep you happy, gentlemen","s":100,"h":"Spot on."},{"g":"god keep you merry","s":95,"h":"Spot on."},{"g":"god give you peace and joy","s":85,"h":"Yes; that's the wish."},{"g":"a christmas greeting","s":45,"h":"Right area; what exactly is wished?"},{"g":"the comma is in a different place","s":45,"h":"True; so what does it mean?"},{"g":"the gentlemen are already merry","s":25,"h":"Close words, wrong grammar."},{"g":"telling cheerful men to rest","s":15,"h":"That's the misreading the tune invites."},{"g":"rest in peace, happy men","s":10,"h":"Nobody has died."},{"g":"drunk men should go to bed","s":10,"h":"No sleeping involved."},{"g":"a pirate toast","s":0,"h":"Off the wall."}]},{"id":"lyric-good-king-wenceslas-stephen","cat":"lyric","kind":"lyric","prompt":"Good King Wenceslas looked out on the Feast of Stephen","song":"Good King Wenceslas","year":1853,"pd":true,"ask":"What does this line mean in the song?","truth":"The Feast of Stephen is St. Stephen's Day, December 26: the king looks out of his window on the day after Christmas.","more":"Listeners who picture a banquet wonder why he then carries meat, wine and pine logs out into the snow for a poor man. John Mason Neale wrote the words in 1853 about Wenceslaus, a 10th-century duke of Bohemia.","key":["december","saint","holiday","christmas","boxing"],"clues":["The carol was written in England in 1853.","This feast is on the church calendar, and no table is set.","In Britain the same date is called Boxing Day."],"decoys":["He gazes down on a royal banquet held for Stephen, a nobleman who is the guest of honor at his court that night.","The Feast of Stephen is New Year's Eve, when kings traditionally handed out food and firewood to the poor.","It's a village harvest festival named for the local saint, held each year at the end of autumn."],"url":"https://en.wikipedia.org/wiki/Good_King_Wenceslas","source":"https://www.mentalfloss.com/holidays/christmas/quick-10-10-archaic-christmas-carol-words-explained","checked":"2026-10-06","fun":3,"difficulty":2,"rating":"G","graded":[{"g":"st stephen's day, december 26","s":100,"h":"Spot on."},{"g":"the day after christmas","s":95,"h":"Spot on."},{"g":"boxing day","s":95,"h":"Spot on."},{"g":"a saint's feast day","s":65,"h":"Right kind of day; which date?"},{"g":"christmas day","s":60,"h":"Very close; off by one."},{"g":"a church holiday in winter","s":55,"h":"Right area; pin down the date."},{"g":"new year's eve","s":30,"h":"Right season, wrong date."},{"g":"a big dinner party","s":10,"h":"Too literal."},{"g":"a banquet for a guy named stephen","s":10,"h":"Too literal: no table is set."},{"g":"a jousting tournament","s":0,"h":"Off the wall."}]},{"id":"lyric-waltzing-matilda","cat":"lyric","kind":"lyric","prompt":"Who'll come a-waltzing Matilda with me?","song":"Waltzing Matilda","year":1895,"pd":true,"ask":"What does this line mean in the song?","truth":"Who'll come tramping the roads with me? 'Waltzing' was Australian slang for traveling on foot, and 'Matilda' was the swag, the blanket roll of belongings carried on the back.","more":"Banjo Paterson wrote the words in 1895, probably with the 1894 shearers' strike in mind. In the song a swagman steals a sheep, and when the landowner and three troopers come, he leaps into the billabong rather than be taken alive.","key":["walking","bundle","travel","blanket","wander"],"clues":["It's Australia's best-known bush ballad, from 1895.","Nobody dances, and no woman called Matilda appears.","A drifter's blanket roll gets a woman's name."],"decoys":["Who will dance a waltz with me tonight? Matilda is the girl the swagman left behind, and he still dreams of her.","Who'll come drinking with me? 'Waltzing Matilda' was bush slang for passing a bottle of rum around the campfire.","Who'll come droving with me? Matilda is the swagman's old horse, and waltzing meant riding behind a mob of sheep."],"url":"https://en.wikipedia.org/wiki/Waltzing_Matilda","source":"https://www.library.gov.au/documenting-federation/national-identity","checked":"2026-10-06","fun":4,"difficulty":2,"rating":"G","graded":[{"g":"walking the outback with your bedroll on your back","s":100,"h":"Spot on."},{"g":"wandering on foot carrying your stuff","s":90,"h":"Spot on."},{"g":"living as a tramp on the road","s":70,"h":"Right life; what do the words mean?"},{"g":"matilda is his bag","s":60,"h":"Half right; what's the waltzing?"},{"g":"waltzing means walking","s":60,"h":"Half right; who is Matilda?"},{"g":"stealing a sheep","s":25,"h":"That happens later in the song."},{"g":"drinking with your mates","s":10,"h":"No drinks here."},{"g":"dancing with a girl named matilda","s":5,"h":"Too literal."},{"g":"a kangaroo boxing match","s":0,"h":"Off the wall."}]},{"id":"lyric-clementine-herring-boxes","cat":"lyric","kind":"lyric","prompt":"Herring boxes, without topses, sandals were for Clementine","song":"Oh My Darling, Clementine","year":1884,"pd":true,"ask":"What does this line mean in the song?","truth":"Her feet were so huge that she wore open wooden fish crates, herring boxes with the tops off, as sandals.","more":"The line before is 'Light she was and like a fairy, and her shoes were number nine.' Percy Montrose's 1884 song poses as a sad ballad about a miner's daughter who drowns, but it's a parody that keeps mocking its heroine.","key":["huge","foot","shoes","boxes","big"],"clues":["It's from Oh My Darling, Clementine, an 1884 comic song.","The line just before mentions her shoe size.","No shoe in any store would fit her."],"decoys":["Her father packed fish for a living, and she sold his empty herring boxes to buy herself a pair of sandals.","She was so poor that she wove her sandals from the straw lining of the herring boxes at the mining camp.","Herring boxes were cheap wooden clogs worn by miners' daughters, named after the fish crates they looked like."],"url":"https://en.wikipedia.org/wiki/Oh_My_Darling,_Clementine","source":"https://www.singing-bell.com/oh-my-darling-clementine-printable-lyrics-pdf/","checked":"2026-10-06","fun":5,"difficulty":2,"rating":"G","graded":[{"g":"her feet were so big she wore fish boxes as shoes","s":100,"h":"Spot on."},{"g":"she had huge feet","s":90,"h":"Spot on."},{"g":"she wore boxes as shoes","s":70,"h":"Right footwear; why did she?"},{"g":"her shoes were really ugly","s":35,"h":"Close; what was the real problem?"},{"g":"she was too poor to buy shoes","s":30,"h":"Plausible, but the joke is elsewhere."},{"g":"nonsense words to fit the rhyme","s":25,"h":"Silly, yes, but it means something."},{"g":"she smelled like fish","s":15,"h":"Wrong sense; look lower down."},{"g":"her dad was a fisherman","s":10,"h":"He worked somewhere else."},{"g":"a greek sandal style","s":5,"h":"Off target."},{"g":"pirate treasure chests","s":0,"h":"Off the wall."}]},{"id":"lyric-jingle-bells-bobtail","cat":"lyric","kind":"lyric","prompt":"Bells on bobtail ring, making spirits bright","song":"Jingle Bells","year":1857,"pd":true,"ask":"What does this line mean in the song?","truth":"The bells hang on the horse pulling the sleigh, a bobtail: a horse whose tail has been cut short, or docked.","more":"Docking kept a horse's tail from tangling in the reins, which suited sleigh racing. James Lord Pierpont first published the song in 1857 as 'One Horse Open Sleigh'; a later verse ends with the sleigh in a snowbank: 'we got upsot.'","key":["horse","tail","docked","short","harness"],"clues":["It was first published in 1857 as 'One Horse Open Sleigh.'","The ringing comes from whatever is pulling the sleigh.","Its back end had been trimmed short."],"decoys":["Bob is the sleigh's driver, and the bells hang from the long tails of the winter coat he wears for the ride.","A bobtail was the short wooden pole at the back of a sleigh, where the set of sleigh bells was hung.","Bobtail is an old name for a bobsled: the bells are fixed to its back runners so they ring as it slides downhill."],"url":"https://en.wikipedia.org/wiki/Jingle_Bells","source":"https://horsenetwork.com/2021/12/the-hidden-history-of-jingle-bells","checked":"2026-10-06","fun":4,"difficulty":2,"rating":"G","graded":[{"g":"the horse has a short docked tail","s":100,"h":"Spot on."},{"g":"a horse with a cut tail","s":95,"h":"Spot on."},{"g":"bells on the horse","s":70,"h":"Right animal; what about its tail?"},{"g":"an animal with a short tail","s":60,"h":"Right tail; which animal?"},{"g":"reindeer harness bells","s":40,"h":"Right idea, wrong animal."},{"g":"bells on the back of the sleigh","s":25,"h":"Close; look at what pulls it."},{"g":"a bobsled","s":15,"h":"Tempting, but no."},{"g":"a guy named bob","s":5,"h":"Too literal."},{"g":"cheerful ghosts","s":3,"h":"Too literal."},{"g":"christmas tree ornaments","s":3,"h":"Off target."}]},{"id":"lyric-humpty-dumpty-riddle","cat":"lyric","kind":"lyric","prompt":"Humpty Dumpty sat on a wall, Humpty Dumpty had a great fall","song":"Humpty Dumpty","year":1797,"pd":true,"ask":"What does this line mean in the song?","truth":"It's a riddle, and the answer is an egg: that's why nobody can put him back together. The rhyme itself never says what he is.","more":"The earliest known printing, from 1797, ends 'Fourscore men and fourscore more could not make Humpty Dumpty where he was before.' Popular stories that he was a cannon at the siege of Colchester or King Richard III have no solid evidence behind them.","key":["egg","riddle","broken","fragile"],"clues":["The rhyme was first printed in 1797.","It began as a guessing game, and the answer was never written down.","Once broken, you can scramble it but never fix it."],"decoys":["Humpty Dumpty was a huge cannon on a town wall in the English Civil War, knocked down by enemy fire and never repaired.","Humpty Dumpty was a nickname for a hunchbacked king who fell from power and whose army could not restore him.","Humpty Dumpty was slang for a fat drunkard who tumbled off a garden wall and couldn't be hauled back up."],"url":"https://en.wikipedia.org/wiki/Humpty_Dumpty","source":"https://en.wikipedia.org/wiki/Humpty_Dumpty; https://blogs.loc.gov/folklife/2024/03/humpty-dumpty-metafolklore-riddles-and-yolks/","checked":"2026-10-06","fun":4,"difficulty":1,"rating":"G","graded":[{"g":"he's an egg","s":95,"h":"Spot on."},{"g":"a riddle where the answer is an egg","s":100,"h":"Spot on."},{"g":"something fragile that can't be fixed once broken","s":65,"h":"Right idea; what exactly is it?"},{"g":"it's a riddle","s":45,"h":"Right form; what's the answer?"},{"g":"a broken vase","s":35,"h":"Breakable, yes, but the wrong thing."},{"g":"a cannon in the civil war","s":15,"h":"A popular story with no evidence."},{"g":"a fat man falling off a wall","s":15,"h":"Too literal."},{"g":"king richard the third","s":10,"h":"A popular story with no evidence."},{"g":"the stock market crash","s":3,"h":"Off target."},{"g":"a ufo crash","s":0,"h":"Off the wall."}]},{"id":"lyric-sixpence-blackbird-pie","cat":"lyric","kind":"lyric","prompt":"Four and twenty blackbirds baked in a pie","song":"Sing a Song of Sixpence","year":"1740s","pd":true,"ask":"What does this line mean in the song?","truth":"Twenty-four live birds hidden under a pie crust, a real banquet trick: when the pie was cut open the birds flew out, which is why the next line says they began to sing.","more":"An Italian cookbook published in English in 1598, the Epulario, explains the method: bake the crust hollow, then slip live birds in through a hole in the bottom. Other banquet pies hid live frogs or rabbits.","key":["alive","birds","trick","surprise","banquet","fly"],"clues":["Read on: when the pie was opened, the birds began to sing.","A cookbook printed in English in 1598 explains how to make it.","The crust was baked empty, and the filling went in still breathing."],"decoys":["Blackbirds were a cheap everyday meat, so a pie of two dozen was an ordinary family supper in a hard winter.","The two dozen blackbirds stand for the 24 hours of the day, and the pie crust is the sky that closes over them.","It's a coded story of 24 pirates hidden in a ship's hold, who jump out to ambush the crew when it is opened."],"url":"https://en.wikipedia.org/wiki/Sing_a_Song_of_Sixpence","source":"https://theworld.org/stories/2015/07/16/medieval-cookbooks-actually-had-recipes-four-and-twenty-blackbirds-baked-pie","checked":"2026-10-06","fun":5,"difficulty":2,"rating":"G","graded":[{"g":"live birds in a pie that fly out as a party trick","s":100,"h":"Spot on."},{"g":"the birds were alive and flew out when cut","s":95,"h":"Spot on."},{"g":"a surprise pie at a medieval feast","s":70,"h":"Right setting; what made it surprising?"},{"g":"a magic trick","s":55,"h":"Close; how was it done?"},{"g":"a fancy dish for the king","s":40,"h":"Right table; what's special about it?"},{"g":"people really ate blackbird pie","s":20,"h":"Real dish, but not for eating."},{"g":"24 hours in a day","s":10,"h":"A popular theory; think more literally."},{"g":"pirates hiding on a ship","s":5,"h":"Off target."},{"g":"a rock band","s":0,"h":"Off the wall."}]},{"id":"lyric-deck-the-halls-troll","cat":"lyric","kind":"lyric","prompt":"Troll the ancient Yuletide carol","song":"Deck the Halls","year":1862,"pd":true,"ask":"What does this line mean in the song?","truth":"Sing the old Christmas song loudly and merrily: 'troll' was an old verb meaning to sing in a full, rolling voice.","more":"The Oxford English Dictionary records that sense of 'troll' from the 1500s, long before internet trolls. The English words were written in the 1860s for an old Welsh tune.","key":["sing","loudly","chant","carol","cheerfully"],"clues":["It's from Deck the Halls.","Here the word is a verb, and a musical one.","Think of belting out a tune at a party."],"decoys":["Drag the old Yule log in from the woods: 'troll' meant to haul something heavy along the ground.","Mock the stuffy old carols with silly new words: 'troll' meant to tease, much as it does online.","Go door to door fishing for tips: 'troll' meant to trail a line, so carolers trolled for coins."],"url":"https://en.wikipedia.org/wiki/Deck_the_Halls","source":"https://www.mentalfloss.com/holidays/christmas/quick-10-10-archaic-christmas-carol-words-explained","checked":"2026-10-06","fun":4,"difficulty":1,"rating":"G","graded":[{"g":"sing it loudly","s":95,"h":"Spot on."},{"g":"sing the old christmas song merrily","s":100,"h":"Spot on."},{"g":"chant the carol","s":85,"h":"Yes; add some gusto."},{"g":"sing it as a round","s":70,"h":"Close; it's more about the sound."},{"g":"play the carol on an instrument","s":40,"h":"Right area, wrong kind of music-making."},{"g":"celebrate christmas","s":30,"h":"Right season; what's the action?"},{"g":"make fun of old carols","s":10,"h":"That's the modern meaning."},{"g":"drag in the yule log","s":10,"h":"Wrong job."},{"g":"a troll from a fairy tale","s":3,"h":"Too literal."},{"g":"fishing","s":3,"h":"Off target."}]},{"id":"lyric-ring-around-the-rosie","cat":"lyric","kind":"lyric","prompt":"Ring around the rosie, a pocket full of posies, ashes, ashes, we all fall down","song":"Ring Around the Rosie","year":1881,"pd":true,"ask":"What does this line mean in the song?","truth":"It's the end of a children's circle game: everyone holds hands, skips round, and drops to the ground on the last line. Folklorists find no evidence that it is about the plague.","more":"The popular story that it describes the 1665 Great Plague (a rosy rash, posies against the smell, sneezing, death) first appears in print in 1961. The rhyme itself isn't recorded until 1881, and folklorists Iona and Peter Opie were not convinced by the plague reading.","key":["game","dance","circle","fall","children","play"],"clues":["The rhyme was first printed, in a British version, in 1881.","Folklorists say its famous dark meaning was invented in the 20th century.","Watch what the children do when they reach this line."],"decoys":["It describes the Great Plague of 1665: a rosy rash, flowers carried against the stench, sneezing, and then everyone falls dead.","It recalls the Great Fire of London in 1666, with the ashes of burned houses and families fleeing the flames.","It comes from May Day dances where girls tossed flower petals and curtsied low to the May Queen at the end."],"url":"https://blogs.loc.gov/folklife/2014/07/ring-around-the-rosie-metafolklore-rhyme-and-reason/","source":"https://blogs.loc.gov/folklife/2014/07/ring-around-the-rosie-metafolklore-rhyme-and-reason/; https://www.phrases.org.uk/meanings/ring-a-ring-of-roses.html","checked":"2026-10-06","fun":5,"difficulty":2,"rating":"G","graded":[{"g":"just a kids game where everyone falls down","s":95,"h":"Spot on."},{"g":"a circle dance and you all drop at the end","s":100,"h":"Spot on."},{"g":"nonsense for a playground game","s":85,"h":"Yes; the line is a cue."},{"g":"a nursery rhyme with no hidden meaning","s":70,"h":"Mostly; what does the line make happen?"},{"g":"kids being silly","s":55,"h":"Close; what are they doing?"},{"g":"a dance at a wedding","s":35,"h":"Right activity, wrong occasion."},{"g":"the black plague","s":10,"h":"The famous story; evidence says no."},{"g":"people dying of plague","s":10,"h":"The famous story; evidence says no."},{"g":"the great fire of london","s":10,"h":"Tempting, but no."},{"g":"a tax protest","s":0,"h":"Off the wall."}]},{"id":"lyric-silent-night-yon","cat":"lyric","kind":"lyric","prompt":"Round yon virgin, mother and child","song":"Silent Night","year":1818,"pd":true,"ask":"What does this line mean in the song?","truth":"All is calm and bright around that virgin mother and her child over there: 'round' means around, and 'yon' means yonder.","more":"Plenty of children hear it as 'Round John Virgin', as if he were a guest at the manger. The carol was first sung in German, as 'Stille Nacht', in 1818; the usual English words are an 1859 translation.","key":["virgin","mother","baby","calm","surrounding"],"clues":["It's from Silent Night, first sung in Austria in 1818.","Two of the words are old shortenings.","Read it straight after 'All is calm, all is bright.'"],"decoys":["Round John Virgin is one of the shepherds, a stout old man who comes down from the hills to visit the baby.","'Round' means a round song: the angels sing a round to the mother and child, one voice after another.","Yon was the name of the village inn, where the young mother and her child spent the night in the stable."],"url":"https://en.wikipedia.org/wiki/Silent_Night","source":"https://www.mentalfloss.com/holidays/christmas/quick-10-10-archaic-christmas-carol-words-explained","checked":"2026-10-06","fun":4,"difficulty":1,"rating":"G","graded":[{"g":"around that virgin over there, mary and the baby","s":100,"h":"Spot on."},{"g":"all is calm around mary and jesus","s":95,"h":"Spot on."},{"g":"around the virgin mary","s":85,"h":"Yes; there's a child, too."},{"g":"about mary and baby jesus","s":60,"h":"Right people; read the line before."},{"g":"yon means yonder","s":55,"h":"Right word; now the whole line."},{"g":"the three wise men arriving","s":15,"h":"Wrong visitors Right setting; who does what?"},{"g":"it's a mistranslation","s":45,"h":"True; what does the original say?"},{"g":"an alarm clock going off","s":15,"h":"Too literal: who makes the noise?"},{"g":"a lazy kid late for school","s":10,"h":"Wrong person, wrong place."},{"g":"a funeral","s":5,"h":"Nobody has died."},{"g":"a fire drill","s":0,"h":"Off the wall."}]},{"id":"lyric-take-me-out-never-get-back","cat":"lyric","kind":"lyric","prompt":"I don't care if I never get back","song":"Take Me Out to the Ball Game","year":1908,"pd":true,"ask":"What does this line mean in the song?","truth":"A baseball-mad young woman, Katie Casey, is so happy at the ballpark that she doesn't care if she never goes home.","more":"Jack Norworth's 1908 verses, now rarely sung, tell how her beau asked her out to a show and she said no, take me to the game instead. Norworth got the idea from a sign for a ball game he saw on the subway.","key":["stay","baseball","forever","leave","home"],"clues":["The song is from 1908 and is still sung at ballparks.","The singer is a young woman in a verse most people have forgotten.","She'd happily sit in the bleachers till the end of time."],"decoys":["She doesn't care if her team never gets back to first place: win or lose, she'll keep cheering them on.","It's a batter who doesn't care if he never gets back to home plate, as long as the crowd cheers his hit.","She doesn't care if she never gets her ticket money back, because a day at the game is worth every cent."],"url":"https://en.wikipedia.org/wiki/Take_Me_Out_to_the_Ball_Game","source":"https://www.wgbh.org/lifestyle/2019-06-06/take-me-out-to-the-ball-game-could-have-been-a-feminist-anthem","checked":"2026-10-06","fun":3,"difficulty":1,"rating":"G","graded":[{"g":"she loves baseball so much she never wants to leave","s":100,"h":"Spot on."},{"g":"happy to stay at the ballgame forever","s":95,"h":"Spot on."},{"g":"doesn't want to go home","s":85,"h":"Yes; and where is she?"},{"g":"a girl obsessed with baseball","s":55,"h":"Right person; what's she saying?"},{"g":"a baseball fan","s":45,"h":"Right person; what's the feeling?"},{"g":"running away from home","s":35,"h":"Right about home; why stay away?"},{"g":"never getting money back on tickets","s":15,"h":"Tempting, but no refunds involved."},{"g":"a runner not getting back to base","s":15,"h":"Too literal: think about the stands."},{"g":"a soldier going off to war","s":5,"h":"Off target."},{"g":"a bad back","s":0,"h":"Off the wall."}]},{"id":"paper-gorillas","cat":"paper","kind":"paper","prompt":"Gorillas in our midst","ask":"What field is it from, and what is the paper about?","full":"Gorillas in our midst: sustained inattentional blindness for dynamic events","authors":"Simons & Chabris","journal":"Perception","year":1999,"field":"Psychology","truth":"Psychology. About half the volunteers counting basketball passes in a video failed to notice a person in a gorilla suit walking through the game: inattentional blindness.","more":"The gorilla stops among the players, faces the camera and thumps its chest. The study won the 2004 Ig Nobel Prize in psychology; the title plays on the Dian Fossey film Gorillas in the Mist.","key":["attention","notice","gorilla","blindness","psychology"],"clues":["The study used a short video and gave volunteers a simple task.","The volunteers were busy counting passes between players in white shirts.","Something big and hairy strolled through the middle of the game, and many never saw it."],"decoys":["Primatology. A census of mountain gorillas in Rwanda found that groups living near villages had changed their daily routes to avoid people.","Psychology. Zoo visitors who watched gorillas for ten minutes rated them as more human-like than visitors who only read about them.","Ecology. Gorillas living near forest edges spread the seeds of fruit trees farther than any other animal, helping logged land regrow."],"graded":[{"g":"psychology, people miss a gorilla in a video while counting passes","s"
