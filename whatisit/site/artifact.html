<title>What Is It?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@600&family=Public+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: a quiet frame around one mystery at a time. Each mystery is drawn in its own habitat
   (an address bar, a licence plate, a patent front page, a shop sign, a search box); the frame
   around it stays plain so the habitat carries the look. */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --surface-2: #e8ebf0;
  --ink: #16181d;
  --muted: #586070;
  --line: #d4d9e1;
  --accent: #f2b200;
  --accent-ink: #231a00;
  --accent-soft: #fdf0c7;
  --focus: #2b59c3;
  --good: #1d8a57;
  --bad: #c0392b;
  --cold: #3d7be8;
  --cool: #63a3d8;
  --warm: #e9b300;
  --hot: #ec6a2a;
  --spot: #d4243c;
  /* habitats: physical things keep their real colours */
  --plate-bg: #fbfbf6;
  --plate-ink: #1c2a7c;
  --plate-red: #b0232b;
  --plate-edge: #9aa1ad;
  --paper: #fcfbf6;
  --paper-ink: #1f1f1f;
  --paper-rule: #8a8a8a;
  --bar-bg: #e3e6eb;
  --bar-field: #ffffff;
  --bar-ink: #202227;
  --sign-board: #1e3a34;
  --sign-ink: #f7f1df;
  --awning-a: #1e6b57;
  --awning-b: #f1ead6;
  --search-ring: #c9ced8;
  --shadow: 0 1px 2px rgba(20, 24, 33, 0.06), 0 6px 18px rgba(20, 24, 33, 0.07);

  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --plate-face: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --serif: Georgia, "Times New Roman", Times, serif;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: 2.75rem;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115;
    --surface: #181b21;
    --surface-2: #232730;
    --ink: #eceef2;
    --muted: #a2a9b6;
    --line: #2f3440;
    --accent: #ffc21a;
    --accent-ink: #1e1600;
    --accent-soft: #3a3010;
    --focus: #8fb0ff;
    --good: #46c28a;
    --bad: #ff6b5e;
    --cold: #6ea3ff;
    --cool: #8cc0ea;
    --warm: #ffc21a;
    --hot: #ff8a4c;
    --spot: #ff5468;
    --plate-bg: #ecece4;
    --plate-ink: #1c2a7c;
    --plate-red: #b0232b;
    --plate-edge: #6d7480;
    --paper: #ecebe4;
    --paper-ink: #1f1f1f;
    --paper-rule: #7a7a7a;
    --bar-bg: #2a2e36;
    --bar-field: #14171c;
    --bar-ink: #e9ebef;
    --sign-board: #183029;
    --sign-ink: #f7f1df;
    --awning-a: #1e6b57;
    --awning-b: #d9d2bf;
    --search-ring: #3a404c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #181b21;
  --surface-2: #232730;
  --ink: #eceef2;
  --muted: #a2a9b6;
  --line: #2f3440;
  --accent: #ffc21a;
  --accent-ink: #1e1600;
  --accent-soft: #3a3010;
  --focus: #8fb0ff;
  --good: #46c28a;
  --bad: #ff6b5e;
  --cold: #6ea3ff;
  --cool: #8cc0ea;
  --warm: #ffc21a;
  --hot: #ff8a4c;
  --spot: #ff5468;
  --plate-bg: #ecece4;
  --plate-ink: #1c2a7c;
  --plate-red: #b0232b;
  --plate-edge: #6d7480;
  --paper: #ecebe4;
  --paper-ink: #1f1f1f;
  --paper-rule: #7a7a7a;
  --bar-bg: #2a2e36;
  --bar-field: #14171c;
  --bar-ink: #e9ebef;
  --sign-board: #183029;
  --sign-ink: #f7f1df;
  --awning-a: #1e6b57;
  --awning-b: #d9d2bf;
  --search-ring: #3a404c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--step-0) / 1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--focus); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 14px; }
.wordmark { white-space: nowrap; font-family: var(--display); font-size: clamp(1.15rem, 5vw, var(--step-2)); letter-spacing: 0.01em; line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.wordmark .q { color: var(--accent); -webkit-text-stroke: 1px var(--accent-ink); }
.topnav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.topnav button { background: none; border: 0; padding: 6px 10px; border-radius: 999px; color: var(--muted); cursor: pointer; font-size: var(--step--1); font-weight: 600; }
.topnav button:hover, .topnav button[aria-current="true"] { background: var(--surface-2); color: var(--ink); }

/* ---------- generic ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.eyebrow { font-size: var(--step--1); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 60ch; }
.tabular { font-variant-numeric: tabular-nums; }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.04); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: var(--step--1); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-weight: 700; font-size: var(--step--1); }
.input, textarea.input, select.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--focus); outline: none; }
.guessrow { display: flex; gap: 8px; }
.guessrow .input { flex: 1; font-size: var(--step-1); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 999px; font-weight: 600; cursor: pointer; font-size: var(--step--1); }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); font-size: var(--step--1); }
.chip b { font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px); text-align: center; }

/* ---------- hub ---------- */
.hero { display: grid; gap: 18px; padding-block: 8px 6px; }
.hero h1 { font-family: var(--display); font-size: clamp(2.1rem, 8vw, var(--step-4)); line-height: 0.98; letter-spacing: 0.005em; }
.hero h1 .q { color: var(--accent); -webkit-text-stroke: 1.5px var(--accent-ink); }
.trials { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.trial { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.trial .tag { font-family: var(--mono); font-size: var(--step--1); color: var(--muted); }
.trial h2 { font-size: var(--step-1); }
.trial p { color: var(--muted); }
.trial .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.meta { font-size: var(--step--1); color: var(--muted); }

/* ---------- mystery habitats ---------- */
.mystery { display: flex; flex-direction: column; gap: 12px; }
.mystery .ask { font-size: var(--step-1); font-weight: 700; }
.catline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.catline .num { font-family: var(--mono); color: var(--muted); font-size: var(--step--1); }

.bar { background: var(--bar-bg); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.bar .dots { display: flex; gap: 6px; margin: 0 0 8px 4px; }
.bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--plate-edge); opacity: 0.55; }
.bar .field { flex-direction: row; align-items: center; gap: 10px; background: var(--bar-field); color: var(--bar-ink); border-radius: 999px; padding: 10px 16px; }
.bar .url { font-family: var(--mono); font-size: clamp(1.15rem, 5vw, 1.7rem); font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.bar .url .proto { color: var(--muted); font-weight: 400; }
.bar svg { flex: none; width: 16px; height: 16px; color: var(--muted); }

.plate-wrap { display: flex; justify-content: center; }
.plate { position: relative; width: min(100%, 420px); aspect-ratio: 2 / 1; background: var(--plate-bg); border: 3px solid var(--plate-edge); border-radius: 16px; box-shadow: var(--shadow), inset 0 0 0 5px var(--plate-bg), inset 0 0 0 7px var(--plate-edge); display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 12px 18px 10px; }
.plate .state { font-family: var(--serif); font-style: italic; font-weight: 700; color: var(--plate-red); font-size: clamp(1rem, 4.5vw, 1.45rem); line-height: 1; letter-spacing: 0.01em; }
.plate .chars { align-self: center; font-family: var(--plate-face); font-weight: 600; color: var(--plate-ink); font-size: clamp(2.3rem, 13vw, 4.4rem); line-height: 1; letter-spacing: 0.06em; white-space: nowrap; }
.plate .foot { font-family: var(--ui); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--plate-ink); opacity: 0.75; }
.plate .bolt { position: absolute; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--plate-edge); opacity: 0.6; }
.plate .bolt.l { left: 22%; } .plate .bolt.r { right: 22%; }

.patent { background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 16px 18px 18px; box-shadow: var(--shadow); font-family: var(--serif); }
.patent .hd { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 3px double var(--paper-rule); padding-bottom: 8px; font-size: 0.95rem; }
.patent .hd b { font-size: 1.05rem; }
.patent .inid { font-size: 0.82rem; color: #444; margin-top: 10px; font-variant-numeric: tabular-nums; }
.patent .title { margin-top: 4px; font-size: clamp(1.15rem, 4.6vw, 1.55rem); line-height: 1.25; text-transform: uppercase; letter-spacing: 0.02em; }

.sign { box-shadow: var(--shadow); border-radius: 8px; overflow: hidden; }
.sign .awning { height: 28px; background: repeating-linear-gradient(90deg, var(--awning-a) 0 28px, var(--awning-b) 28px 56px); }
.sign .board { background: var(--sign-board); color: var(--sign-ink); padding: 22px 18px 24px; text-align: center; }
.sign .name { font-family: var(--display); font-size: clamp(1.7rem, 8vw, 2.9rem); line-height: 1.05; overflow-wrap: anywhere; }
.sign .est { margin-top: 8px; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.7; }

.searchbox { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1.5px solid var(--search-ring); border-radius: 999px; padding: 12px 18px; box-shadow: var(--shadow); }
.searchbox svg { flex: none; width: 20px; height: 20px; color: var(--muted); }
.searchbox .q { font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.searchbox .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); vertical-align: -0.15em; margin-left: 2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- warmth ---------- */
.warmth { display: grid; gap: 6px; }
.warmth .track { position: relative; height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--cold) 0%, var(--cool) 25%, var(--warm) 50%, var(--hot) 72%, var(--spot) 100%); }
.warmth .pin { position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); transform: translate(-50%, -50%); transition: left 0.5s ease; }
.warmth .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.warmth .word { font-family: var(--display); font-size: var(--step-1); }
.warmth .num { font-family: var(--mono); font-weight: 600; }
.guesslog { display: grid; gap: 8px; }
.guesslog .g { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.guesslog .g .t { font-weight: 600; overflow-wrap: anywhere; }
.guesslog .g .s { font-family: var(--mono); font-weight: 700; }
.guesslog .g .why { grid-column: 1 / -1; }
.lv1 { color: var(--cold); } .lv2 { color: var(--cool); } .lv3 { color: var(--warm); } .lv4 { color: var(--hot); } .lv5 { color: var(--spot); }

.clue { border-left: 4px solid var(--accent); padding: 6px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.choice:hover { border-color: var(--muted); }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }

/* ---------- reveal ---------- */
.reveal { border: 2px solid var(--ink); border-radius: var(--radius); padding: 18px; background: var(--surface); display: grid; gap: 10px; animation: rise 0.35s ease both; }
@keyframes rise { from { transform: translateY(6px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.reveal .truth { font-size: var(--step-2); font-weight: 800; line-height: 1.2; text-wrap: pretty; }
.reveal .more { color: var(--muted); }
.results { display: grid; gap: 6px; }
.results .r { padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.results .r .d { font-family: var(--mono); font-size: var(--step--1); color: var(--good); }
.stamp { justify-self: start; font-family: var(--display); font-size: 1.05rem; letter-spacing: 0.06em; padding: 4px 12px; border: 3px solid currentColor; border-radius: 6px; transform: rotate(-4deg); }
.stamp.ok { color: var(--good); } .stamp.no { color: var(--bad); }
.trapnote { font-weight: 600; color: var(--hot); }

.stars { display: inline-flex; gap: 2px; }
.stars button { background: none; border: 0; font-size: 1.7rem; line-height: 1; padding: 4px; cursor: pointer; color: var(--line); }
.stars button[aria-pressed="true"] { color: var(--accent); }
.stars button:hover { transform: scale(1.08); }
.rate { display: grid; gap: 8px; padding: 14px; border-radius: var(--radius); background: var(--surface-2); }

/* ---------- daily ---------- */
.pips { display: flex; gap: 6px; }
.pips i { width: 30px; height: 8px; border-radius: 999px; background: var(--line); }
.pips i.done { background: var(--ink); } .pips i.now { background: var(--accent); }
.scorebig { font-family: var(--display); font-size: var(--step-3); }
.grid-emoji { font-size: 1.6rem; letter-spacing: 0.1em; }

/* ---------- party board ---------- */
.board { display: grid; gap: 6px; }
.board.points { grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); }
.board.ttt { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 460px; margin: 0 auto; width: 100%; }
.board .head { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; padding: 6px 2px; color: var(--muted); line-height: 1.2; display: flex; align-items: end; justify-content: center; min-height: 3.2em; }
.tile { aspect-ratio: 4 / 3; border-radius: 10px; border: 0; background: var(--sign-board); color: var(--accent); font-family: var(--display); font-size: clamp(1rem, 4.4vw, 1.6rem); cursor: pointer; display: grid; place-items: center; padding: 4px; text-align: center; }
.board.ttt .tile { aspect-ratio: 1; font-family: var(--ui); font-weight: 800; font-size: clamp(0.8rem, 3.4vw, 1rem); color: var(--sign-ink); line-height: 1.15; }
.tile:hover:not([disabled]) { filter: brightness(1.2); }
.tile[disabled] { cursor: default; background: var(--surface-2); color: var(--muted); }
.tile .mark { font-family: var(--display); font-size: clamp(2rem, 12vw, 3.6rem); line-height: 1; }
.tile.x { background: color-mix(in srgb, var(--spot) 18%, var(--surface)); color: var(--spot); }
.tile.o { background: color-mix(in srgb, var(--cold) 18%, var(--surface)); color: var(--cold); }
.scores { display: flex; gap: 8px; flex-wrap: wrap; }
.scores .sc { flex: 1 1 120px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.scores .sc b { display: block; font-family: var(--display); font-size: var(--step-2); }
.scores .sc.lead { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick button { padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.pick button[aria-pressed="true"] { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.timer { font-family: var(--mono); font-weight: 700; font-size: var(--step-2); }
.passcard { text-align: center; padding: 28px 18px; display: grid; gap: 14px; justify-items: center; }
.passcard .who { font-family: var(--display); font-size: var(--step-3); }

/* ---------- bluff ---------- */
.votes { display: grid; gap: 8px; }
.vote { padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.vote.truth { border-color: var(--good); }
.vote .by { font-size: var(--step--1); color: var(--muted); margin-top: 4px; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 16, 0.55); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { width: min(100%, 640px); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 14px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.code { font-family: var(--mono); font-size: 0.8rem; white-space: pre-wrap; background: var(--surface-2); padding: 10px; border-radius: 8px; max-height: 220px; overflow: auto; }

details.how { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
details.how summary { cursor: pointer; font-weight: 700; }
details.how[open] summary { margin-bottom: 8px; }
.prose { display: grid; gap: 10px; max-width: 65ch; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

@media (max-width: 520px) {
  .topnav button { padding: 5px 6px; font-size: 0.75rem; }
  .wordmark { font-size: 1.05rem; }
  .topbar { gap: 6px; }
  .board.points .head { font-size: 0.6rem; }
  .panel { padding: 14px; }
  .reveal .truth { font-size: var(--step-1); }
}
@media (prefers-reduced-motion: reduce) {

<script>
/*
 * "What Is It?" judges.
 *
 * The robot judge is free and runs offline: it compares the words of a guess with an item's key
 * words using ConceptNet Numberbatch vectors (the Word Bocce "common sense" set, reduced to 96
 * dims by tools/build_vectors.py). It rewards guesses that land near the key ideas and explains
 * each match, so players can see why it scored the way it did. It also checks whether a guess sits
 * closer to one of the item's decoys (the obvious-but-wrong reading) than to the truth.
 *
 * The AI judge is a prompt plus a tolerant reply parser; who runs the prompt (the viewer's own
 * Claude plan, the player's own API key, or a chatbot the player pastes it into) is decided in app.js.
 *
 * Works in the browser (window.WhatJudge) and in Node (module.exports), like web/engine.js.
 */
(function (root) {
  "use strict";

  // ---------- word lists ----------
  const STOP = new Set((
    "a an the and or but nor of to in on for with at by from as into onto off over under about " +
    "is are was were be been being am it its it's this that these those there here what which who whom whose " +
    "where when why how i you he she we they me him her us them my your his our their mine yours " +
    "not no yes do does did done doing can could would should will shall may might must just very really " +
    "quite some any all each every more most other such only own same so than too also again then once " +
    "like thing things stuff something someone somebody anything kind type sort lot lots bit maybe probably " +
    "perhaps guess think pretty sure actually basically literally get gets got make makes made " +
    "website site web page webpage online internet com www http https net org url link dot " +
    "s t d ll ve re m"
  ).split(/\s+/));

  // Common spellings the vector vocabulary lacks.
  const ALIAS = {
    donut: "doughnut", donuts: "doughnut", favorite: "favourite", colour: "color", colours: "color",
    anaesthetist: "anesthesia", anesthesiologist: "anesthesia", anaesthesia: "anesthesia",
    tv: "television", telly: "television", movie: "film", movies: "film", cellphone: "phone",
    smartphone: "phone", ad: "advertisement", ads: "advertisement", vid: "video", vids: "video",
    bbq: "barbecue", aeroplane: "airplane", gaming: "game", ecommerce: "shop", startup: "company",
  };

  function tokenize(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[‘’]/g, "'")
      .replace(/https?:\/\/\S+/g, " ")
      .split(/[^a-z0-9'à-ÿ]+/)
      .map((w) => w.replace(/^'+|'+$/g, "").replace(/'s$/, ""))
      .filter(Boolean);
  }

  /** Content words of a text, in order, without duplicates. */
  function contentWords(text, limit) {
    const out = [];
    const seen = new Set();
    for (const w of tokenize(text)) {
      if (STOP.has(w) || w.length < 2 || /^\d+$/.test(w)) continue;
      const k = stem(w);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(w);
      if (limit && out.length >= limit) break;
    }
    return out;
  }

  /** A crude stem, used only to decide that two words are "the same word". */
  function stem(w) {
    w = ALIAS[w] || w;
    if (w.length > 5 && w.endsWith("ies")) return w.slice(0, -3) + "y";
    if (w.length > 5 && w.endsWith("ing")) return w.slice(0, -3);
    if (w.length > 4 && w.endsWith("ed")) return w.slice(0, -2);
    if (w.length > 4 && w.endsWith("es") && /(ch|sh|ss|x|z)es$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
    return w;
  }

  /** Spellings to try in the vocabulary, most likely first. */
  function variants(w) {
    const v = [w];
    if (ALIAS[w]) v.unshift(ALIAS[w]);
    const add = (x) => { if (x.length > 1 && !v.includes(x)) v.push(x); };
    if (w.endsWith("ies")) add(w.slice(0, -3) + "y");
    if (w.endsWith("es")) add(w.slice(0, -2));
    if (w.endsWith("s") && !w.endsWith("ss")) add(w.slice(0, -1));
    if (w.endsWith("ing")) { add(w.slice(0, -3)); add(w.slice(0, -3) + "e"); add(w.slice(0, -4)); }
    if (w.endsWith("ed")) { add(w.slice(0, -2)); add(w.slice(0, -1)); add(w.slice(0, -3)); }
    if (w.endsWith("ers")) { add(w.slice(0, -3)); add(w.slice(0, -2)); }
    if (w.endsWith("er")) { add(w.slice(0, -2)); add(w.slice(0, -1)); }
    if (w.endsWith("ly")) add(w.slice(0, -2));
    if (w.includes("ou")) add(w.replace("ou", "o")); // British spellings
    if (w.endsWith("ise")) add(w.slice(0, -3) + "ize");
    return v;
  }

  if (code === "rate_limited") return "Claude is busy or your usage limit was reached. Try again in a bit.";
  if (code === "invalid_json") return "Claude's verdict didn't come back in the right shape. Try again.";
  return "Claude couldn't judge this one" + (e && e.message ? ": " + e.message : ".");
}
function apiErrorText(e) {
  const status = e && e.status;
  if (status === 401) return "That API key was rejected. Check it in Settings.";
  if (status === 429) return "Rate limited by the API. Wait a moment and try again.";
  if (status === 400) return "The API rejected the request: " + (e.message || "bad request");
  return "The API call failed" + (e && e.message ? ": " + e.message : ".");
}
function pasteJudge(prompt, n) {
  return new Promise((resolve, reject) => {
    let done = false;
    const close = modal((closeFn) => {
      const reply = h("textarea", { class: "input", id: "paste-reply", rows: 6, placeholder: "Paste the chatbot's whole reply here" });

          h("li", {}, "Copy the prompt below."),

          h("li", {}, "Paste the reply back here.")),
        h("div", { class: "code" }, prompt),
        h("div", { class: "row" }, h("button", { class: "btn small", onclick: () => copyText(prompt, "Prompt copied") }, "Copy prompt")),
        h("div", { class: "field" }, h("label", { for: "paste-reply" }, "The reply"), reply),
        err,
        h("div", { class: "row" },
          h("button", { class: "btn primary", onclick: () => {
            try {
              const out = J.parseJudgeReply(reply.value, n);
              done = true;
              closeFn();
              resolve(Object.assign(out, { source: "paste" }));
            } catch (e) {
              err.textContent = "Couldn't read a verdict in that reply. Paste all of it, including the part in curly brackets.";
            }
          } }, "Use this verdict"),
          h("button", { class: "btn ghost", onclick: () => { closeFn(); if (!done) reject(new Error("cancelled")); } }, "Cancel")),
      ];
    });
    void close;

}

/**
 * Pass-and-play: each player in turn types privately. Renders into `host`; resolves with texts.
 * opts: {item, prompt (label), placeholder, check(text, i) -> error string or ""}
 */
function collectPrivately(host, players, opts) {
  return new Promise((resolve) => {
    const out = new Array(players.length).fill("");
    let i = 0;
    const step = (phase) => {
      clear(host);
      if (i >= players.length) { resolve(out); return; }
      const who = players[i];
      if (phase === "pass") {
        host.append(h("div", { class: "panel passcard" },
          h("span", { class: "eyebrow" }, `${i + 1} of ${players.length}`),
          h("div", {}, "Pass the device to"),
          h("div", { class: "who" }, who),
          h("button", { class: "btn primary", onclick: () => step("type") }, "I'm " + who)));
        return;
      }
      const input = h("input", { class: "input", id: "private-" + i, autocomplete: "off", placeholder: opts.placeholder || "Your guess", maxlength: 160 });
      const err = h("p", { class: "small", style: { color: "var(--bad)" } });
      const submit = () => {
        const text = input.value.trim();
        if (!text) { err.textContent = "Write something first."; return; }
        const problem = opts.check ? opts.check(text, i) : "";
        if (problem) { err.textContent = problem; return; }
        out[i] = text;
        i++;
        step("pass");
      };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      host.append(h("div", { class: "stack" },
        opts.item ? mysteryCard(opts.item) : null,
        h("div", { class: "field" }, h("label", { for: "private-" + i }, `${who}: ${opts.prompt || "your guess"}`), input),
        err,
        h("div", { class: "row" },
          h("button", { class: "btn primary", onclick: submit }, "Done, hide it"),
          opts.skippable ? h("button", { class: "btn ghost", onclick: () => { out[i] = ""; i++; step("pass"); } }, "Skip") : null)));
      input.focus();
    };
    step("pass");
  });
}

/** Judge a set of guesses. Shows controls inside `host`; calls onWinner(indexes, details). */
function judgePanel(host, { round, item, players, guesses, mode, defaultJudge, onAward }) {
  const typed = guesses && guesses.some((g) => g);
  const picked = new Set();
  let funniest = null;
  let details = { judge: "room" };
  const box = h("div", { class: "stack" });
  const pickRow = h("div", { class: "pick", role: "group", "aria-label": "Winner" });
  const funRow = h("div", { class: "pick", role: "group", "aria-label": "Funniest guess" });
  const paintPicks = () => {
    pickRow.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(picked.has(i))));
    funRow.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(funniest === i)));
  };
  players.forEach((p, i) => {
    pickRow.append(h("button", { type: "button", onclick: () => { picked.has(i) ? picked.delete(i) : picked.add(i); paintPicks(); } }, p));
    funRow.append(h("button", { type: "button", onclick: () => { funniest = funniest === i ? null : i; paintPicks(); } }, p));
  });
  const results = h("div", { class: "guesslog" });
  const showScores = (scores, label) => {
    clear(results);
    const order = players.map((_, i) => i).filter((i) => guesses[i]).sort((a, b) => (scores[b] ? scores[b].score : -1) - (scores[a] ? scores[a].score : -1));
    for (const i of order) {
      const s = scores[i];
      const w = J.warmth(s ? s.score : 0);
      results.append(h("div", { class: "g" },
        h("span", { class: "t" }, players[i], ": “", guesses[i], "”"),
        h("span", { class: "s lv" + w.level }, s ? s.score : "–"),
        s && s.why ? h("span", { class: "why small muted" }, s.why) : null));
    }
    results.prepend(h("p", { class: "small muted" }, label));
    picked.clear();
    const top = order.length ? (scores[order[0]] ? scores[order[0]].score : 0) : 0;
    order.forEach((i) => { if (scores[i] && scores[i].score === top && top > 0) picked.add(i); });
    paintPicks();
  };
  const robotBtn = h("button", { class: "btn small", onclick: async () => {
    robotBtn.disabled = true;
    const sp = await loadRobot();
    robotBtn.disabled = false;
    if (!sp) { toast("The robot judge couldn't load its word list."); return; }
    const scores = guesses.map((g) => (g ? (round.custom ? J.scoreAgainst(SPACE, g, round.target) : robotScore(g, item)) : null));
    details = { judge: "robot", scores: scores.map((s) => (s ? s.score : null)) };
    showScores(scores, "Robot judge: word-vector closeness to the answer's key ideas.");
  } }, "Robot judge");
  const aiBtn = h("button", { class: "btn small", onclick: async () => {
    aiBtn.disabled = true;
    const old = aiBtn.textContent;
    aiBtn.textContent = "Judging…";
    try {
      const list = players.map((p, i) => ({ name: p, text: guesses[i] })).filter((g) => g.text);
      const idx = players.map((_, i) => i).filter((i) => guesses[i]);
      const out = await aiJudge(round, list);
      const scores = new Array(players.length).fill(null);
      out.scores.forEach((s, k) => { scores[idx[k]] = s; });
      details = { judge: "ai", source: out.source, scores: scores.map((s) => (s ? s.score : null)), comment: out.comment };
      showScores(scores, `AI judge (${aiSourceLabel(out.source)}). ${out.comment || ""}`);
      if (out.funniest != null) { funniest = idx[out.funniest]; paintPicks(); }
    } catch (e) {
      if (e.message !== "cancelled") toast(e.message);
    } finally {
      aiBtn.disabled = false;
      aiBtn.textContent = old;
    }
  } }, "AI judge");

  box.append(h("p", { class: "label" }, typed ? "Who was closest?" : "Who was closest? Read your guesses out, then tap the winner."));
  if (typed) box.append(h("div", { class: "row" }, robotBtn, aiBtn, h("span", { class: "small muted" }, "or just tap a name")));
  box.append(results, pickRow,
    h("p", { class: "label" }, "Funniest guess (bonus, optional)"), funRow,
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
      details.winners = [...picked];
      details.funniest = funniest;
      if (details.judge !== "room" && typed) {
        Store.send("judge", { id: item && item.id, prompt: round.prompt, truth: round.truth, mode, guesses, judge: details.judge, scores: details.scores, winners: details.winners });
      }
      onAward([...picked], funniest, details);
    } }, "Award and continue")));
  host.append(box);
  if (typed && defaultJudge === "robot") robotBtn.click();
  if (typed && defaultJudge === "ai") aiBtn.click();
}

function timerEl(seconds, onEnd) {
  if (!seconds) return { el: null, stop() {} };
  let left = seconds;
  const el = h("span", { class: "timer", "aria-live": "polite" }, left + "s");
  const id = setInterval(() => {
    left--;
    el.textContent = left > 0 ? left + "s" : "Time!";
    if (left <= 0) { clearInterval(id); if (onEnd) onEnd(); }
  }, 1000);
  return { el, stop() { clearInterval(id); } };
}

// ---- daily.js ----
/* Trial A: Daily five. Solo; five mysteries a day, one per category. Type guesses and the robot
   judge says how warm each one is; clues and "pick from four" are there when stuck, at a cost. */

const CLUE_MULT = [1, 0.85, 0.7, 0.55];
const MAX_GUESSES = 4;
const { dayNumber } = window.WhatPick;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dailyItems(dateStr) {
  return window.WhatPick.dailyItems(CONTENT, dateStr);
}

function practiceItems() {
  const cats = catsAvailable().filter((c) => c !== "double" || SETTINGS.pg13);
  return RAND.shuffle(cats.slice()).slice(0, 5).map((c) => {
    const p = pool(c);
    return p[RAND.int(p.length)];
  });
}

function newRound() {
  return { guesses: [], clues: 0, mc: null, verdict: null, revealed: false, points: 0, ai: null };
}

function roundPoints(item, r) {
  const best = r.guesses.reduce((m, g) => Math.max(m, g.s), 0);
  let base = best;
  if (r.mc && r.mc.pick != null) base = r.mc.right ? Math.max(best, 50) : Math.round(best / 2);
  let pts = Math.round(base * CLUE_MULT[r.clues]);
  if (item.kind === "plate" && r.verdict && item.dmv && r.verdict === item.dmv) pts += 10;
  return pts;
}
function pointsWhy(item, r) {
  const best = r.guesses.reduce((m, g) => Math.max(m, g.s), 0);
  const bits = [];
  if (r.mc && r.mc.pick != null) bits.push(r.mc.right ? "picked the right one of four (50)" : "picked a wrong one of four (half your best guess)");
  else bits.push(r.guesses.length ? "best guess " + best : "no guess");
  if (r.clues) bits.push(`× ${CLUE_MULT[r.clues]} for ${r.clues} clue${r.clues > 1 ? "s" : ""}`);
  if (item.kind === "plate" && r.verdict) bits.push(r.verdict === item.dmv ? "+10 for calling the DMV verdict" : "DMV verdict missed");
  return bits.join(", ");
}
function emojiFor(points) {
  return points >= 70 ? "🟩" : points >= 45 ? "🟨" : points >= 20 ? "🟧" : "⬛";
}

function dailyScreen(opts = {}) {
  const practice = !!opts.practice;
  const date = todayStr();
  const items = practice ? practiceItems() : dailyItems(date);
  const key = "daily:" + date;
  const st = (!practice && load(key, null)) || { date, i: 0, rounds: items.map(newRound) };
  const persist = () => { if (!practice) save(key, st); };
  const root = h("div", { class: "stack" });
  let rating = null;
  let robot = "loading";
  loadRobot().then((s) => { robot = s ? "ready" : "failed"; if (!st.rounds[st.i] || !st.rounds[st.i].revealed) render(); });
  render();
  return root;

  function header() {
    return h("div", { class: "spread" },
      h("div", { class: "stack-sm" },
        h("span", { class: "eyebrow" }, practice ? "Trial A · Practice five" : `Trial A · Daily No. ${dayNumber(date)}`),
        h("div", { class: "pips", "aria-label": `Mystery ${Math.min(st.i + 1, 5)} of 5` },
          items.map((_, i) => h("i", { class: i < st.i ? "done" : i === st.i ? "now" : "" })))),
      h("span", { class: "tabular muted small" }, st.rounds.reduce((s, r) => s + (r.revealed ? r.points : 0), 0), " pts"));
  }

  function render() {
    clear(root);
    root.append(header());
    if (st.i >= items.length) { renderEnd(); return; }
    const item = items[st.i];
    const r = st.rounds[st.i];
    root.append(mysteryCard(item, h("span", { class: "num" }, `${st.i + 1}/5`)));
    if (r.revealed) renderReveal(item, r);
    else renderPlay(item, r);
    window.scrollTo({ top: 0 });
  }

  function guessLog(r, withChips) {
    if (!r.guesses.length) return null;
    return h("div", { class: "guesslog" }, r.guesses.map((g, i) => {
      const w = J.warmth(g.s);
      const last = i === r.guesses.length - 1;
      return h("div", { class: "g" },
        h("span", { class: "t" }, g.t),
        h("span", { class: "s lv" + w.level }, g.s),
        last && withChips && g.res ? h("div", { class: "why" }, warmthMeter(g.s)) : null,
        last && withChips && g.res ? h("div", { class: "why" }, matchChips(g.res)) : null,
        g.trap ? h("div", { class: "why trapnote small" }, "That's close to a tempting wrong answer: “" + g.trap + "”") : null);
    }));
  }

  function renderPlay(item, r) {
    const left = MAX_GUESSES - r.guesses.length;
    const input = h("input", { class: "input", id: "daily-guess", autocomplete: "off", maxlength: 160, placeholder: r.guesses.length ? "Another guess" : "Your guess, in a few words" });
    const go = async () => {
      const text = input.value.trim();
      if (!text) return;
      const sp = await loadRobot();
      if (!sp) { toast("The robot judge didn't load. Use “Pick from four” instead."); return; }
      const res = robotScore(text, item);
      r.guesses.push({ t: text, s: res.score, trap: res.trap ? res.trap.decoy : null, res: { matches: res.matches, unknown: res.unknown } });
      if (res.score >= 85 || r.guesses.length >= MAX_GUESSES) finish(item, r);
      persist();
      render();
      const again = $("#daily-guess");
      if (again) again.focus();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });

    const log = guessLog(r, true);
    if (log) root.append(log);
    if (r.clues) root.append(h("div", { class: "stack-sm" }, item.clues.slice(0, r.clues).map((c, i) => h("p", { class: "clue" }, h("b", {}, "Clue " + (i + 1) + ": "), c))));

    if (r.mc) {
      root.append(h("p", { class: "label" }, "Which one is it?"),
        h("div", { class: "choices" }, r.mc.opts.map((o, i) => h("button", { class: "choice", onclick: () => {
          r.mc.pick = i;
          r.mc.right = o === item.truth;
          finish(item, r);
          persist();
          render();
        } }, o))));
    } else {
      root.append(h("div", { class: "guessrow" }, input, h("button", { class: "btn primary", onclick: go, disabled: left <= 0 }, "Guess")));
      root.append(h("p", { class: "small muted" },
        robot === "loading" ? "Warming up the robot judge… " : robot === "failed" ? "The robot judge couldn't load here; pick from four instead. " : "",
        `${left} guess${left === 1 ? "" : "es"} left. A score of 85 or more counts as spot on.`));
    }

    if (item.kind === "plate" && item.dmv) {
      root.append(h("div", { class: "stack-sm" },
        h("span", { class: "label" }, "Side bet (+10): did the DMV approve it?"),
        seg([["approved", "Approved"], ["denied", "Denied"]], r.verdict, (v) => { r.verdict = v; persist(); })));
    }

    const clueBtn = h("button", { class: "btn small", disabled: r.clues >= Math.min(3, (item.clues || []).length) || !!r.mc, onclick: () => { r.clues++; persist(); render(); } },
      r.clues >= (item.clues || []).length ? "No more clues" : `Clue (×${CLUE_MULT[r.clues + 1] || CLUE_MULT[3]})`);
    const mcBtn = h("button", { class: "btn small", disabled: !!r.mc || !(item.decoys && item.decoys.length), onclick: () => {
      const opts2 = rng("mc-" + item.id).shuffle([item.truth, ...item.decoys.slice(0, 3)]);
      r.mc = { opts: opts2, pick: null, right: null };
      persist();
      render();
    } }, "Pick from four");
    const giveUp = h("button", { class: "btn ghost small", onclick: () => { finish(item, r); persist(); render(); } }, "Show me");
    root.append(h("div", { class: "row" }, clueBtn, mcBtn, giveUp));
    root.append(howJudging());
    if (!r.mc) input.focus();
  }

  function finish(item, r) {
    r.revealed = true;
    r.points = roundPoints(item, r);
  }

  function renderReveal(item, r) {
    const extra = [];
    if (item.kind === "plate" && r.verdict) {
      extra.push(h("p", { class: "small" }, `You said ${r.verdict}: `, r.verdict === item.dmv ? h("b", {}, "right (+10)") : "not this time"));
    }
    if (r.mc && r.mc.pick != null) {
      extra.push(h("p", { class: "small" }, r.mc.right ? "You picked the real one." : `You picked: “${r.mc.opts[r.mc.pick]}”`));
    }
    root.append(revealCard(item, { extra: extra.length ? h("div", { class: "stack-sm" }, extra) : null }));
    root.append(h("div", { class: "spread" },
      h("span", { class: "scorebig tabular" }, "+" + r.points),
      h("span", { class: "small muted", style: { maxWidth: "40ch", textAlign: "right" } }, pointsWhy(item, r))));
    const log = guessLog(r, false);
    if (log) root.append(log);

    if (r.guesses.length) {
      const aiBox = h("div", { class: "stack-sm" });
      if (r.ai) aiBox.append(aiCompare(r));
      else {
        const btn = h("button", { class: "btn small", onclick: async () => {
          btn.disabled = true;
          btn.textContent = "Asking…";
          try {
            const out = await aiJudge(
              { prompt: item.prompt, kindLabel: kindLabel(item), ask: item.ask, truth: item.truth, more: item.more },
              r.guesses.map((g, i) => ({ name: "Guess " + (i + 1), text: g.t })));
            r.ai = { source: out.source, scores: out.scores.map((s) => (s ? s.score : null)), why: out.scores.map((s) => (s ? s.why : "")), comment: out.comment };
            persist();
            Store.send("judge", { id: item.id, prompt: item.prompt, truth: item.truth, mode: "daily", guesses: r.guesses.map((g) => g.t), robot: r.guesses.map((g) => g.s), ai: r.ai.scores, source: out.source });
            clear(aiBox).append(aiCompare(r));
          } catch (e) {
            btn.disabled = false;
            btn.textContent = "Ask the AI judge for a second opinion";
            if (e.message !== "cancelled") toast(e.message);
          }
        } }, "Ask the AI judge for a second opinion");
        aiBox.append(h("div", { class: "row" }, btn, h("span", { class: "small muted" }, "Uses " + aiSourceLabel(aiSource()) + ". Compare it with the robot.")));
      }
      root.append(aiBox);
    }

    rating = funRating(item, practice ? "practice" : "daily", { points: r.points, guesses: r.guesses.length, clues: r.clues, mc: !!r.mc });
    root.append(rating);
    root.append(h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
      if (rating) rating.flush();
      st.i++;
      persist();
      render();
    } }, st.i < items.length - 1 ? "Next mystery" : "See your score")));
  }

  function aiCompare(r) {
    return h("div", { class: "panel stack-sm" },
      h("span", { class: "label" }, "Robot vs AI judge (" + aiSourceLabel(r.ai.source) + ")"),
      r.guesses.map((g, i) => h("div", { class: "spread small" },
        h("span", {}, "“", g.t, "”"),
        h("span", { class: "tabular" }, "robot ", h("b", {}, g.s), " · AI ", h("b", {}, r.ai.scores[i] == null ? "–" : r.ai.scores[i])),
        r.ai.why[i] ? h("span", { class: "muted", style: { flexBasis: "100%" } }, r.ai.why[i]) : null)),
      r.ai.comment ? h("p", { class: "small muted" }, r.ai.comment) : null);
  }

  function renderEnd() {
    const total = st.rounds.reduce((s, r) => s + r.points, 0);
    const grid = st.rounds.map((r) => emojiFor(r.points)).join("");
    const share = `What Is It? ${practice ? "practice" : "No. " + dayNumber(date)}\n${grid} ${total}/500${CONFIG.shareUrl ? "\n" + CONFIG.shareUrl : ""}`;
    root.append(h("div", { class: "panel stack" },
      h("span", { class: "eyebrow" }, practice ? "Practice done" : "Today's five, done"),
      h("div", { class: "spread" }, h("span", { class: "scorebig tabular" }, total, " / 500"), h("span", { class: "grid-emoji", "aria-label": "Results grid" }, grid)),
      h("div", { class: "row" },
        h("button", { class: "btn primary", onclick: () => copyText(share, "Result copied") }, "Copy result"),
        h("button", { class: "btn", onclick: () => go("practice") }, "Practice five more"))));
    root.append(h("div", { class: "stack-sm" }, items.map((it, i) => h("div", { class: "panel", style: { padding: "12px 14px" } },
      h("div", { class: "spread" }, h("span", { class: "eyebrow" }, CATS[it.cat].short), h("span", { class: "tabular small" }, emojiFor(st.rounds[i].points), " ", st.rounds[i].points)),
      h("div", {}, h("b", {}, it.prompt), " — ", it.truth)))));
    root.append(trialRating("A", "Rate Trial A: Daily five"));
  }
}

function howJudging() {
  return h("details", { class: "how" },
    h("summary", {}, "How the robot judge scores"),
    h("div", { class: "prose small" },
      h("p", {}, "Each mystery has a few key ideas (for Liquid Death: water, canned, drink). The robot compares the words of your guess with those ideas using ConceptNet Numberbatch word vectors, the same “common sense” word map as Word Bocce, so near-synonyms count: “store” lands close to “shop”."),
      h("p", {}, "It reads your first eight words and ignores filler like “a website where”. 85 or more is spot on. It is quick and free, and sometimes too generous with close cousins (shoes for a sock company). After the reveal you can ask an AI judge for a second opinion and compare.")));
}

// ---- party.js ----
/* Trial B: Party board. Same room or on a call. Pick a square; everyone guesses; the closest guess
   takes it. Two layouts: a points board (categories x 100/200/300) or tic-tac-toe for two teams. */

const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const CLUE_VALUE = [1, 0.75, 0.5, 0.25];

function partyScreen() {
  const root = h("div", { class: "stack" });
  let P = null;
  setup();
  return root;

  function setup() {
    clear(root);
    const cfg = Object.assign({ style: "points", entry: "typed", judge: "robot", timer: 0 }, load("party-cfg", {}));
    let editor;
    const edHost = h("div");
    const paintEditor = () => {
      clear(edHost);
      const names = cfg.style === "ttt" ? (load("party-teams", ["Team X", "Team O"])) : (SETTINGS.players.length ? SETTINGS.players : ["Player 1", "Player 2", "Player 3"]);
      editor = cfg.style === "ttt"
        ? playersEditor(names.slice(0, 2), { min: 2, max: 2, noun: "Team" })
        : playersEditor(names, { min: 2, max: 8, noun: "Player" });
      edHost.append(h("p", { class: "label" }, cfg.style === "ttt" ? "Two teams" : "Players or teams"), editor.el);
    };
    paintEditor();
    const pg = h("input", { type: "checkbox", id: "party-pg13", checked: SETTINGS.pg13 });
    root.append(
      h("div", { class: "stack-sm" }, h("span", { class: "eyebrow" }, "Trial B"), h("h2", {}, "Party board"),
        h("p", { class: "lede" }, "For a room or a video call. Pick a square, everyone guesses what the mystery really is, and the closest guess takes the square.")),
      h("div", { class: "panel stack" },
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Board"),
          seg([["points", "Points board"], ["ttt", "Tic-tac-toe, two teams"]], cfg.style, (v) => { cfg.style = v; paintEditor(); })),
        edHost,
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Guesses"),
          seg([["typed", "Type them on this device, passing it round"], ["paper", "Paper or out loud"]], cfg.entry, (v) => { cfg.entry = v; })),
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Judge"),
          seg([["robot", "Robot"], ["ai", "AI"], ["room", "The room decides"]], cfg.judge, (v) => { cfg.judge = v; }),
          h("p", { class: "small muted" }, "Robot and AI need typed guesses. You can always overrule them by tapping a name.")),
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Timer"),
          seg([[0, "None"], [30, "30 seconds"], [60, "60 seconds"]], cfg.timer, (v) => { cfg.timer = v; })),
        h("label", { class: "check", for: "party-pg13" }, pg, h("span", {}, "Include ", h("b", {}, "Double take"), " (PG-13 misreadings)")),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
          SETTINGS.pg13 = pg.checked;
          const names = editor.get();
          if (cfg.style === "ttt") save("party-teams", names);
          else { SETTINGS.players = names; }
          saveSettings();
          save("party-cfg", cfg);
          start(cfg, names);
        } }, "Deal the board"))));
  }

  function start(cfg, names) {
    loadRobot();
    const used = new Set();
    const take = (cat, diff) => {
      const p = pool(cat).filter((it) => !used.has(it.id));
      const exact = p.filter((it) => (it.difficulty || 2) === diff);
      const from = exact.length ? exact : p.length ? p : CONTENT.filter((it) => allowed(it) && !used.has(it.id));
      const it = from[RAND.int(from.length)];
      used.add(it.id);
      return it;
    };
    P = { cfg, players: names.map((n) => ({ name: n, score: 0 })), turn: 0, log: [] };
    if (cfg.style === "points") {
      const cats = catsAvailable().slice(0, 6);
      P.cols = cats.map((cat) => ({ cat, tiles: [1, 2, 3].map((d) => ({ value: d * 100, item: take(cat, d), done: false, by: [] })) }));
    } else {
      const cats = RAND.shuffle(catsAvailable().slice());
      P.cells = Array.from({ length: 9 }, (_, i) => {
        const cat = cats[i % cats.length];
        return { cat, item: take(cat, 1 + RAND.int(3)), mark: null, done: false };
      });
    }
    board();
  }

  function scoresBar() {
    const top = Math.max(...P.players.map((p) => p.score));
    return h("div", { class: "scores" }, P.players.map((p, i) => h("div", { class: "sc" + (p.score === top && top > 0 ? " lead" : "") },
      h("span", { class: "small muted" }, P.cfg.style === "ttt" ? (i === 0 ? "X · " : "O · ") + p.name : p.name),
      h("b", { class: "tabular" }, P.cfg.style === "ttt" ? P.cells.filter((c) => c.mark === i).length : p.score))));
  }

  function board() {
    clear(root);
    root.append(h("div", { class: "spread" }, h("span", { class: "eyebrow" }, "Trial B · Party board"),
      h("button", { class: "btn ghost small", onclick: () => { if (P) end(); } }, "End game")));
    root.append(scoresBar());
    if (P.cfg.style === "points") {
      const grid = h("div", { class: "board points", style: { "--cols": P.cols.length } });
      P.cols.forEach((c) => grid.append(h("div", { class: "head" }, CATS[c.cat].label)));
      for (let row = 0; row < 3; row++) {
        P.cols.forEach((c) => {
          const t = c.tiles[row];
          grid.append(h("button", { class: "tile", disabled: t.done, "aria-label": `${CATS[c.cat].label}, ${t.value}`, onclick: () => round({ kind: "points", tile: t, cat: c.cat }) },
            t.done ? (t.by.length ? P.players[t.by[0]].name.slice(0, 10) : "–") : t.value));
        });
      }
      root.append(grid);
      if (P.cols.every((c) => c.tiles.every((t) => t.done))) { end(); return; }
      root.append(h("p", { class: "small muted" }, "Take turns choosing. Bigger numbers are harder."));
    } else {
      const team = P.players[P.turn % 2];
      root.append(h("p", { class: "label" }, `${P.turn % 2 === 0 ? "X" : "O"} · ${team.name} picks a square. Both teams guess; the closer one claims it.`));
      const grid = h("div", { class: "board ttt" });
      P.cells.forEach((c) => grid.append(h("button", { class: "tile" + (c.mark === 0 ? " x" : c.mark === 1 ? " o" : ""), disabled: c.done, "aria-label": c.done ? "Taken" : CATS[c.cat].label, onclick: () => round({ kind: "ttt", cell: c, cat: c.cat }) },
        c.mark === 0 ? h("span", { class: "mark" }, "X") : c.mark === 1 ? h("span", { class: "mark" }, "O") : c.done ? "–" : CATS[c.cat].short)));
      root.append(grid);
    }
  }

  function round(sel) {
    const item = sel.kind === "points" ? sel.tile.item : sel.cell.item;
    const names = P.players.map((p) => p.name);
    let clues = 0;
    clear(root);
    const valueEl = h("span", { class: "chip" });
    const paintValue = () => {
      valueEl.textContent = sel.kind === "points" ? `Worth ${Math.round(sel.tile.value * CLUE_VALUE[clues])}` : "Claims the square";
    };
    paintValue();
    const t = timerEl(P.cfg.timer, () => toast("Time's up"));
    root.append(mysteryCard(item, valueEl));
    const clueBox = h("div", { class: "stack-sm" });
    const clueBtn = h("button", { class: "btn small", onclick: () => {
      if (clues >= (item.clues || []).length) return;
      clueBox.append(h("p", { class: "clue" }, h("b", {}, "Clue " + (clues + 1) + ": "), item.clues[clues]));
      clues++;
      paintValue();
      if (clues >= (item.clues || []).length) clueBtn.disabled = true;
    } }, "Give a clue");
    const area = h("div", { class: "stack" });
    root.append(h("div", { class: "row" }, clueBtn, t.el), clueBox, area);

    const reveal = (guesses) => {
      t.stop();
      clear(area);
      area.append(revealCard(item));
      const rating = funRating(item, "party");
      judgePanel(area, {
        round: { prompt: item.prompt, kindLabel: kindLabel(item), ask: item.ask, truth: item.truth, more: item.more },
        item, players: names, guesses, mode: "party", defaultJudge: P.cfg.entry === "typed" ? P.cfg.judge : "room",
        onAward: (winners, funniest) => {
          rating.flush();
          if (sel.kind === "points") {
            const pts = Math.round(sel.tile.value * CLUE_VALUE[clues]);
            winners.forEach((w) => { P.players[w].score += pts; });
            if (funniest != null) P.players[funniest].score += 50;
            sel.tile.done = true;
            sel.tile.by = winners;
          } else {
            sel.cell.done = true;
            sel.cell.mark = winners.length === 1 ? winners[0] : null;
            P.turn++;
            const winner = LINES.find((l) => l.every((k) => P.cells[k].mark === 0)) ? 0 : LINES.find((l) => l.every((k) => P.cells[k].mark === 1)) ? 1 : null;
            if (winner != null || P.cells.every((c) => c.done)) { end(winner); return; }
          }
          board();
        },
      });
      area.append(rating);
    };

    if (P.cfg.entry === "typed") {
      area.append(h("p", { class: "muted" }, "Everyone take a look. Then pass the device round so each player types a guess in private."),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: async () => {
          const guesses = await collectPrivately(area, names, { item, prompt: "what is it?", placeholder: "Your guess, in a few words", skippable: true });
          clear(area);
          area.append(h("p", { class: "label" }, "All guesses are in."), h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => reveal(guesses) }, "Reveal the answer")));
        } }, "Collect guesses")));
    } else {
      area.append(h("p", { class: "muted" }, "Everyone write a guess on paper (or keep it in your head). When you're ready, reveal."),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => reveal(names.map(() => "")) }, "Reveal the answer")));
    }
  }

  function end(tttWinner) {
    clear(root);
    let headline;
    if (P.cfg.style === "ttt") {
      headline = tttWinner != null ? `${P.players[tttWinner].name} got three in a row` : (() => {
        const x = P.cells.filter((c) => c.mark === 0).length;
        const o = P.cells.filter((c) => c.mark === 1).length;
        return x === o ? "A draw" : `${P.players[x > o ? 0 : 1].name} took more squares`;
      })();
    } else {
      const top = Math.max(...P.players.map((p) => p.score));
      const winners = P.players.filter((p) => p.score === top).map((p) => p.name);
      headline = top > 0 ? `${winners.join(" and ")} win${winners.length > 1 ? "" : "s"}` : "Nobody scored";
    }
    root.append(h("span", { class: "eyebrow" }, "Trial B · Final"), h("h2", { class: "scorebig" }, headline), scoresBar(),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => start(P.cfg, P.players.map((p) => p.name)) }, "Play again"),
        h("button", { class: "btn", onclick: setup }, "Change setup")),
      trialRating("B", "Rate Trial B: Party board"));
  }
}

// ---- byo.js ----
/* Trial C: Bring your own. The original game: someone types any word, phrase or web address,
   everyone guesses, then you look it up together and judge who was closest. Optional Family-Feud
   bonus for matching the 2nd and 3rd search results. */

const BYO_IDEAS = [
  "kafka.com", "Bring your own balls", "Spaghetti tree", "Radio garden", "Point Nemo", "Toad in the hole",
  "Head cheese", "Chocolate rain", "Jack in the Box", "Bored Panda", "The Onion", "Five Guys",
  "pointerpointer.com", "isitchristmas.com", "zombo.com", "hackertyper.net", "theuselessweb.com",
  "Dihydrogen monoxide", "Mechanical Turk", "Three Wolf Moon", "Pet rock", "Hush puppies", "Monkey's eyebrow",
  "Correct horse battery staple", "Truth or Consequences", "Cracker Barrel", "Up goer five", "Drop bears",
  "Kettle war", "Wilhelm scream",
];

function byoScreen() {
  const root = h("div", { class: "stack" });
  const S = { prompt: "", players: SETTINGS.players.length ? SETTINGS.players.slice() : ["Player 1", "Player 2", "Player 3"], entry: "typed", tally: {} };
  ask();
  return root;

  function itemFor() {
    return { id: null, cat: "byo", kind: looksLikeDomain(S.prompt) ? "domain" : "phrase", prompt: S.prompt.replace(/^https?:\/\//i, ""), ask: looksLikeDomain(S.prompt) ? "What is this website?" : "What comes up first when you search this?" };
  }

  function ask() {
    clear(root);
    const input = h("input", { class: "input", id: "byo-prompt", maxlength: 120, value: S.prompt, placeholder: "A word, phrase or web address" });
    const editor = playersEditor(S.players, { min: 1, max: 8, noun: "Player" });
    const next = () => {
      const p = input.value.trim();
      if (!p) { toast("Type a mystery first, or tap “Give me one”"); return; }
      S.prompt = p;
      S.players = editor.get();
      SETTINGS.players = S.players;
      saveSettings();
      guesses();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") next(); });
    root.append(
      h("div", { class: "stack-sm" }, h("span", { class: "eyebrow" }, "Trial C"), h("h2", {}, "Bring your own"),
        h("p", { class: "lede" }, "The original version. One person types something mysterious. Everyone guesses what it is, or what comes up first when you search it. Then you look it up together.")),
      h("div", { class: "panel stack" },
        h("div", { class: "field" }, h("label", { for: "byo-prompt" }, "The mystery"), input),
        h("div", { class: "row" },

/* Trial D: Bluff. Pass the device: everyone writes a believable fake answer, the real one is mixed
   in (plus, if you like, one of our tempting wrong answers), and everyone votes. Points for finding
   the truth and for fooling the others. */

function bluffScreen() {
  const root = h("div", { class: "stack" });
  let B = null;
  setup();
  return root;

  function setup() {
    clear(root);
    const editor = playersEditor(SETTINGS.players.length >= 3 ? SETTINGS.players : ["Player 1", "Player 2", "Player 3"], { min: 3, max: 8, noun: "Player" });
    const cfg = Object.assign({ rounds: 5, decoy: true }, load("bluff-cfg", {}));
    const decoy = h("input", { type: "checkbox", id: "bluff-decoy", checked: cfg.decoy });
    const pg = h("input", { type: "checkbox", id: "bluff-pg13", checked: SETTINGS.pg13 });
    root.append(
      h("div", { class: "stack-sm" }, h("span", { class: "eyebrow" }, "Trial D"), h("h2", {}, "Bluff"),
        h("p", { class: "lede" }, "Three or more players, one device. Everyone writes a fake answer that sounds true. Spot the real one; fool the others.")),
      h("div", { class: "panel stack" },
        h("p", { class: "label" }, "Players"), editor.el,
        h("div", { class: "stack-sm" }, h("span", { class: "label" }, "Rounds"), seg([[3, "3"], [5, "5"], [8, "8"]], cfg.rounds, (v) => { cfg.rounds = v; })),
        h("label", { class: "check", for: "bluff-decoy" }, decoy, h("span", {}, "Add one of our tempting wrong answers to each round (good with 3 or 4 players)")),
        h("label", { class: "check", for: "bluff-pg13" }, pg, h("span", {}, "Include ", h("b", {}, "Double take"), " (PG-13)")),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
          cfg.decoy = decoy.checked;
          SETTINGS.pg13 = pg.checked;
          SETTINGS.players = editor.get();
          saveSettings();
          save("bluff-cfg", cfg);
          B = { cfg, players: SETTINGS.players.slice(), scores: SETTINGS.players.map(() => 0), n: 0, used: new Set() };
          loadRobot();
          roundStart();
        } }, "Start"))));
  }

  function nextItem() {
    const p = CONTENT.filter((it) => allowed(it) && !B.used.has(it.id) && (it.decoys || []).length);
    const it = p[RAND.int(p.length)];
    B.used.add(it.id);
    return it;
  }

  function roundStart() {
    B.n++;
    const item = nextItem();
    clear(root);
    root.append(h("span", { class: "eyebrow" }, `Trial D · Round ${B.n} of ${B.cfg.rounds}`), mysteryCard(item));
    const area = h("div", { class: "stack" });
    root.append(area);
    area.append(h("p", { class: "muted" }, "Everyone read it. Then each player, in private, writes a fake answer that could pass for the truth."),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: async () => {
        const fakes = await collectPrivately(area, B.players, {
          item, prompt: "write a believable fake answer", placeholder: "Something that sounds true",
          check: (t) => {
            if (SPACE && J.scoreGuess(SPACE, t, item).score >= 85) return "That's very close to the real answer. Write something false.";
            return "";
          },
        });
        vote(item, fakes);
      } }, "Write fakes")));
  }

  function vote(item, fakes) {
    // Options: the truth, each player's fake, and maybe one of our decoys. Identical texts merge.
    const opts = [];
    const addOpt = (text, by) => {
      const k = text.trim().toLowerCase();
      const ex = opts.find((o) => o.key === k);
      if (ex) ex.by.push(by);
      else opts.push({ key: k, text: text.trim(), by: [by] });
    };
    addOpt(item.truth, "truth");
    fakes.forEach((f, i) => addOpt(f, i));
    if (B.cfg.decoy && item.decoys && item.decoys.length) addOpt(item.decoys[RAND.int(item.decoys.length)], "house");
    RAND.shuffle(opts);
    const votes = new Array(B.players.length).fill(null);
    let i = 0;
    const host = h("div", { class: "stack" });
    clear(root);
    root.append(h("span", { class: "eyebrow" }, `Trial D · Round ${B.n} · Vote`), host);
    const step = (phase) => {
      clear(host);
      if (i >= B.players.length) { reveal(item, opts, votes); return; }
      const who = B.players[i];
      if (phase === "pass") {
        host.append(h("div", { class: "panel passcard" }, h("span", { class: "eyebrow" }, `${i + 1} of ${B.players.length}`),
          h("div", {}, "Pass the device to"), h("div", { class: "who" }, who),
          h("button", { class: "btn primary", onclick: () => step("vote") }, "I'm " + who)));
        return;
      }
      host.append(mysteryCard(item), h("p", { class: "label" }, `${who}: which one is real?`),
        h("div", { class: "choices" }, opts.map((o, k) => o.by.includes(i)
          ? h("button", { class: "choice", disabled: true }, o.text, h("span", { class: "small muted" }, " (yours)"))
          : h("button", { class: "choice", onclick: () => { votes[i] = k; i++; step("pass"); } }, o.text))));
    };
    step("pass");
  }

  function reveal(item, opts, votes) {
    const gained = B.players.map(() => 0);
    votes.forEach((k, voter) => {
      if (k == null) return;
      const o = opts[k];
      if (o.by.includes("truth")) gained[voter] += 2;
      o.by.forEach((b) => { if (typeof b === "number" && b !== voter) gained[b] += 1; });
    });
    gained.forEach((g, i) => { B.scores[i] += g; });
    clear(root);
    root.append(h("span", { class: "eyebrow" }, `Trial D · Round ${B.n} · The truth`), mysteryCard(item), revealCard(item));
    root.append(h("div", { class: "votes" }, opts.map((o, k) => {
      const voters = votes.map((v, i) => (v === k ? B.players[i] : null)).filter(Boolean);
      const authors = o.by.map((b) => (b === "truth" ? "The real answer" : b === "house" ? "Our tempting wrong answer" : "Written by " + B.players[b]));
      return h("div", { class: "vote" + (o.by.includes("truth") ? " truth" : "") },
        h("div", {}, o.by.includes("truth") ? h("b", {}, o.text) : o.text),
        h("div", { class: "by" }, authors.join(" · "), " · ", voters.length ? "picked by " + voters.join(", ") : "nobody picked it"));
    })));
    root.append(h("div", { class: "scores" }, B.players.map((p, i) => h("div", { class: "sc" },
      h("span", { class: "small muted" }, p), h("b", { class: "tabular" }, B.scores[i]), gained[i] ? h("span", { class: "small" }, "+" + gained[i] + " this round") : null))));
    const rating = funRating(item, "bluff", { fooled: votes.filter((k) => k != null && !opts[k].by.includes("truth")).length });
    root.append(rating);
    root.append(h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
      rating.flush();
      if (B.n >= B.cfg.rounds) final();
      else roundStart();
    } }, B.n >= B.cfg.rounds ? "Final scores" : "Next round")));
  }

  function final() {
    clear(root);
    const top = Math.max(...B.scores);
    const winners = B.players.filter((_, i) => B.scores[i] === top);
    root.append(h("span", { class: "eyebrow" }, "Trial D · Final"), h("h2", { class: "scorebig" }, `${winners.join(" and ")} win${winners.length > 1 ? "" : "s"}`),
      h("div", { class: "scores" }, B.players.map((p, i) => h("div", { class: "sc" + (B.scores[i] === top ? " lead" : "") }, h("span", { class: "small muted" }, p), h("b", { class: "tabular" }, B.scores[i])))),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => { B.n = 0; B.scores = B.players.map(() => 0); roundStart(); } }, "Play again"),
        h("button", { class: "btn", onclick: setup }, "Change players")),
      trialRating("D", "Rate Trial D: Bluff"));
  }
}

        }
        status.textContent = savedMsg(await Store.send("suggestion", rec)) + ". Thanks for this one.";
        [f.c1, f.c2, f.c3, f.decoy].forEach((x) => { x.value = ""; });
        if (!clueFor) { f.prompt.value = ""; f.truth.value = ""; f.url.value = ""; }
      } }, "Send suggestion")),
      status));
  return root;
}
